<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>강의 준비 체크리스트 — Flowmus 부업클래스</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, 'Apple SD Gothic Neo', sans-serif;
    color: #191f28;
    background: #f2f4f6;
    font-size: 15px;
    line-height: 1.6;
    letter-spacing: -0.3px;
    -webkit-text-size-adjust: 100%;
    min-height: 100vh;
    padding-bottom: 100px;
  }

  /* Header */
  .hdr {
    background: #191f28;
    color: #fff;
    padding: 24px 20px 20px;
    position: sticky;
    top: 0;
    z-index: 100;
  }
  .hdr-badge {
    font-size: 11px;
    font-weight: 700;
    color: #3182f6;
    letter-spacing: 1px;
    margin-bottom: 4px;
  }
  .hdr-name {
    font-size: 20px;
    font-weight: 800;
    letter-spacing: -1px;
    line-height: 1.3;
  }
  .hdr-sub {
    font-size: 13px;
    color: #8b95a1;
    margin-top: 6px;
    line-height: 1.5;
  }
  .hdr-instructor {
    display: inline-block;
    margin-top: 10px;
    padding: 4px 12px;
    background: #2d333b;
    border-radius: 8px;
    font-size: 13px;
    font-weight: 700;
    color: #3182f6;
  }

  /* Progress */
  .progress-wrap {
    background: #191f28;
    padding: 0 20px 16px;
    border-bottom: 1px solid #2d333b;
  }
  .progress-bar {
    background: #2d333b;
    height: 6px;
    border-radius: 3px;
    overflow: hidden;
  }
  .progress-fill {
    height: 100%;
    background: linear-gradient(90deg, #3182f6, #00b894);
    border-radius: 3px;
    transition: width 0.4s ease;
  }
  .progress-text {
    font-size: 12px;
    color: #6b7684;
    margin-top: 6px;
    text-align: right;
  }
  .progress-text b { color: #3182f6; }

  /* Intro */
  .intro {
    margin: 16px 12px;
    padding: 20px;
    background: #fff;
    border-radius: 16px;
    border-left: 4px solid #3182f6;
  }
  .intro-title {
    font-size: 15px;
    font-weight: 800;
    color: #191f28;
    margin-bottom: 8px;
  }
  .intro-text {
    font-size: 13px;
    color: #4e5968;
    line-height: 1.7;
  }

  /* Phase Tab */
  .phase-tabs {
    display: flex;
    gap: 6px;
    padding: 12px 12px 4px;
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
  }
  .phase-tab {
    flex-shrink: 0;
    padding: 8px 16px;
    border-radius: 20px;
    border: 1px solid #d1d6db;
    background: #fff;
    color: #6b7684;
    font-size: 13px;
    font-weight: 700;
    font-family: inherit;
    cursor: pointer;
    transition: all 0.2s;
  }
  .phase-tab.active {
    background: #3182f6;
    border-color: #3182f6;
    color: #fff;
  }
  .phase-tab .tab-count {
    display: inline-block;
    margin-left: 4px;
    padding: 1px 6px;
    border-radius: 8px;
    font-size: 10px;
    background: rgba(0,0,0,0.08);
  }
  .phase-tab.active .tab-count {
    background: rgba(255,255,255,0.25);
  }

  /* Section */
  .section {
    margin: 12px 12px 0;
  }
  .sec-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 14px 16px;
    background: #fff;
    border-radius: 16px 16px 0 0;
    border-bottom: 1px solid #f2f4f6;
  }
  .sec-icon { font-size: 16px; margin-right: 8px; }
  .sec-title {
    font-size: 15px;
    font-weight: 800;
    color: #191f28;
    letter-spacing: -0.5px;
  }
  .sec-count {
    font-size: 12px;
    font-weight: 700;
    color: #3182f6;
    background: #f2f7ff;
    padding: 2px 10px;
    border-radius: 12px;
  }

  /* Item */
  .item {
    background: #fff;
    padding: 14px 16px;
    border-bottom: 1px solid #f2f4f6;
    display: flex;
    gap: 12px;
    align-items: flex-start;
  }
  .item:last-child {
    border-bottom: none;
    border-radius: 0 0 16px 16px;
  }
  .item.checked { opacity: 0.5; }

  /* Checkbox */
  .chk {
    width: 24px;
    height: 24px;
    border-radius: 7px;
    border: 2px solid #d1d6db;
    background: #fff;
    flex-shrink: 0;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 13px;
    transition: all 0.2s;
    margin-top: 1px;
    color: transparent;
  }
  .chk.on {
    border-color: #00b894;
    background: #00b894;
    color: #fff;
  }

  .item-body { flex: 1; min-width: 0; }
  .item-title {
    font-size: 14px;
    font-weight: 700;
    color: #191f28;
    word-break: keep-all;
    line-height: 1.4;
  }
  .item-desc {
    font-size: 12px;
    color: #8b95a1;
    margin-top: 3px;
    line-height: 1.5;
    word-break: keep-all;
  }
  .item-tags {
    display: flex;
    gap: 6px;
    margin-top: 6px;
    flex-wrap: wrap;
  }
  .tag {
    font-size: 10px;
    font-weight: 700;
    padding: 2px 8px;
    border-radius: 6px;
    white-space: nowrap;
  }
  .tag-must { background: #fff0f0; color: #e8344e; }
  .tag-nice { background: #f2f4f6; color: #8b95a1; }
  .tag-format { background: #f2f7ff; color: #3182f6; }

  /* Phase Description */
  .phase-desc {
    margin: 12px 12px 0;
    padding: 16px;
    background: #fff;
    border-radius: 16px;
    border-left: 4px solid #f7971e;
  }
  .phase-desc-title {
    font-size: 14px;
    font-weight: 800;
    color: #191f28;
    margin-bottom: 4px;
  }
  .phase-desc-text {
    font-size: 12px;
    color: #6b7684;
    line-height: 1.6;
  }

  /* Bottom */
  .bottom-bar {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    background: #fff;
    padding: 12px 20px;
    z-index: 100;
    border-top: 1px solid #e5e8eb;
    display: flex;
    justify-content: space-between;
    align-items: center;
    box-shadow: 0 -2px 12px rgba(0,0,0,0.06);
  }
  .bottom-text { font-size: 13px; color: #4e5968; font-weight: 600; }
  .bottom-text b { color: #3182f6; }
  .bottom-btn {
    font-size: 12px;
    color: #fff;
    background: #3182f6;
    border: none;
    padding: 8px 16px;
    border-radius: 10px;
    font-weight: 700;
    font-family: inherit;
    cursor: pointer;
  }

  /* Hidden */
  .hidden { display: none; }
</style>
</head>
<body>

<div id="app"></div>

<script>
// === CONFIG ===
const INSTRUCTOR = new URLSearchParams(location.search).get('name') || '강사님';
const STORE_KEY = 'buup_onboard_' + encodeURIComponent(INSTRUCTOR);

// === DATA ===
const PHASES = [
  {
    id: 1,
    label: '1차 요청',
    when: '미팅 직후',
    desc: '강사님의 기본 프로필과 신뢰 증빙 자료입니다. 랜딩페이지의 핵심 소구점이 됩니다.',
    sections: [
      {

          { key: 'p2', title: '한 줄 소개 (20자 이내)', desc: '썸네일, 배너, 광고 소재에 활용됩니다', must: true, format: '텍스트' },
          { key: 'p3', title: '경력 요약 (3~5줄)', desc: '본업 경력, 핵심 성과 위주로 작성해주세요', must: true, format: '텍스트' },
          { key: 'p4', title: '나의 스토리 (시작 계기 \u2192 전환점 \u2192 현재)', desc: '랜딩페이지 스토리 섹션에 활용됩니다. 수강생이 공감할 수 있는 이야기가 좋습니다', must: true, format: '텍스트 300자+' },
          { key: 'p5', title: '프로필 사진 (정면, 고화질)', desc: '밝은 조명, 깔끔한 배경 권장. 랜딩/광고 전 소재에 사용됩니다', must: true, format: '이미지 (1MB+)' },
          { key: 'p6', title: '작업 환경/일상 사진 3장 이상', desc: '실제 작업하는 모습, 장비, 공간 등 리얼한 사진이 신뢰감을 줍니다', must: true, format: '이미지' },

      {

          { key: 't2', title: '증빙 기간 (최근 몇 개월치인지)', desc: '1~2개월이 아닌 지속적 수익임을 보여주는 것이 중요합니다', must: true, format: '텍스트' },
          { key: 't3', title: '대표 숫자 3개', desc: '예: 월수익 OO만원 / 경력 OO년 / 수강생 OO명. 랜딩 상단 핵심 뱃지에 들어갑니다', must: true, format: '텍스트' },
          { key: 't4', title: '자격증/수상/인증 내역', desc: '공식 자격이나 수상 이력이 있으면 권위 보조 요소로 활용합니다', must: false, format: '이미지/텍스트' },
          { key: 't5', title: '사업자등록증 / 세금신고서 (내부 검증용)', desc: '외부 공개되지 않습니다. 내부 강사 검증 절차에만 사용됩니다', must: true, format: '이미지' },

          { key: 'c4', title: '강의당 예상 시간', desc: '총 학습시간을 계산해서 "총 OO시간 분량"으로 표기합니다', must: true, format: '숫자' },
          { key: 'c5', title: '수강 후 결과물 (뭘 만들 수 있는지)', desc: '랜딩 히어로 섹션의 핵심 카피가 됩니다. 가장 중요한 항목입니다', must: true, format: '텍스트' },

          { key: 'c7', title: '과제/미션 구조', desc: '실습 과제가 있으면 "실전형 강의" 소구에 활용됩니다', must: false, format: '텍스트' },

        ]

      {
        title: '운영/계약',
        icon: '\u{1F4CB}',
        items: [
          { key: 'o1', title: '희망 가격대', desc: '가격 설계 참고용', must: true, format: '숫자' },
          { key: 'o2', title: '얼리버드/할인 구조 의견', desc: '런칭 프로모션 긴급성 설계에 참고합니다', must: true, format: '텍스트' },
          { key: 'o3', title: '환불 조건 (며칠 이내, 수강률 등)', desc: '랜딩페이지 보증/환불 섹션에 명시됩니다', must: true, format: '텍스트' },
          { key: 'o4', title: '웨비나/설명회 진행 가능 여부', desc: '런칭 퍼널 설계에 활용됩니다', must: true, format: '예/아니오' },
          { key: 'o5', title: '광고 출연 동의 (얼굴/이름/성과 노출)', desc: '퍼포먼스 마케팅 집행에 필요합니다', must: true, format: '동의/미동의' },
          { key: 'o6', title: '기존 DB 규모 (이메일/오픈채팅방 등)', desc: '런칭 초기 모수 확보에 중요합니다', must: true, format: '숫자' },
          { key: 'o7', title: '타 플랫폼 독점 계약 유무', desc: '법적 리스크 확인용', must: true, format: '예/아니오' },
          { key: 'o8', title: '희망 오픈 일정', desc: '런칭 로드맵 설계에 반영됩니다', must: true, format: '날짜' },
          { key: 'o9', title: '2기/3기 반복 운영 의향', desc: '장기 수익 설계 참고용', must: false, format: '텍스트' },
        ]
      }
    ]
  }
];

// === STATE ===
let checked = JSON.parse(localStorage.getItem(STORE_KEY) || '{}');
let currentPhase = 0; // 0 = all, 1/2/3 = phase

function save() {
  localStorage.setItem(STORE_KEY, JSON.stringify(checked));
}

function toggle(key) {
  checked[key] = !checked[key];
  save();
  render();
}

function setPhase(p) {
  currentPhase = p;
  render();
}

function getAllItems() {
  const items = [];
  PHASES.forEach(ph => ph.sections.forEach(sec => sec.items.forEach(it => items.push(it))));
  return items;
}

function getPhaseItems(phaseId) {
  const items = [];
  const ph = PHASES.find(p => p.id === phaseId);
  if (ph) ph.sections.forEach(sec => sec.items.forEach(it => items.push(it)));
  return items;
}

function countChecked(items) {
  return items.filter(it => checked[it.key]).length;
}

// === RENDER ===
function render() {
  const all = getAllItems();
  const totalChecked = countChecked(all);
  const totalItems = all.length;
  const pct = totalItems > 0 ? Math.round((totalChecked / totalItems) * 100) : 0;

  const phases = currentPhase === 0 ? PHASES : PHASES.filter(p => p.id === currentPhase);

  let html = `
    <div class="hdr">
      <div class="hdr-badge">ONBOARDING CHECKLIST</div>
      <div class="hdr-name">강의 준비 자료 체크리스트</div>
      <div class="hdr-sub">랜딩페이지 제작에 필요한 자료 목록입니다.<br>단계별로 준비해주시면 됩니다.</div>
      <div class="hdr-instructor">${INSTRUCTOR}</div>
    </div>
    <div class="progress-wrap">
      <div class="progress-bar"><div class="progress-fill" style="width:${pct}%"></div></div>
      <div class="progress-text"><b>${totalChecked}</b> / ${totalItems} 완료 (${pct}%)</div>
    </div>

    <div class="phase-tabs">
      <button class="phase-tab ${currentPhase === 0 ? 'active' : ''}" onclick="setPhase(0)">
        전체<span class="tab-count">${totalChecked}/${totalItems}</span>
      </button>
      ${PHASES.map(ph => {
        const phItems = getPhaseItems(ph.id);
        const phChecked = countChecked(phItems);
        return `<button class="phase-tab ${currentPhase === ph.id ? 'active' : ''}" onclick="setPhase(${ph.id})">
          ${ph.label}<span class="tab-count">${phChecked}/${phItems.length}</span>
        </button>`;
      }).join('')}
    </div>
  `;

  phases.forEach(ph => {
    html += `
      <div class="phase-desc">
        <div class="phase-desc-title">${ph.label} \u2014 ${ph.when}</div>
        <div class="phase-desc-text">${ph.desc}</div>
      </div>
    `;

    ph.sections.forEach(sec => {
      const secChecked = countChecked(sec.items);
      html += `
        <div class="section">
          <div class="sec-header">
            <div><span class="sec-icon">${sec.icon}</span><span class="sec-title">${sec.title}</span></div>
            <div class="sec-count">${secChecked}/${sec.items.length}</div>
          </div>
      `;

      sec.items.forEach(item => {
        const isChecked = !!checked[item.key];
        html += `
          <div class="item ${isChecked ? 'checked' : ''}">
            <div class="chk ${isChecked ? 'on' : ''}" onclick="toggle('${item.key}')">\u2713</div>
            <div class="item-body">
              <div class="item-title">${item.title}</div>
              <div class="item-desc">${item.desc}</div>
              <div class="item-tags">
                ${item.must ? '<span class="tag tag-must">필수</span>' : '<span class="tag tag-nice">선택</span>'}
                <span class="tag tag-format">${item.format}</span>
              </div>
            </div>
          </div>
        `;
      });

      html += `</div>`;
    });
  });

  html += `
    <div class="bottom-bar">
      <div class="bottom-text"><b>Flowmus</b> 부업클래스</div>
      <div class="bottom-text">${totalChecked}/${totalItems}</div>
    </div>
  `;

  document.getElementById('app').innerHTML = html;
}

// === INIT ===
render();
</script>
</body>
</html>
