<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>강의 준비 체크리스트 — Flowmus 부업클래스</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, 'Apple SD Gothic Neo', sans-serif;
    color: #191f28; background: #f2f4f6; font-size: 15px;
    line-height: 1.6; letter-spacing: -0.3px;
    -webkit-text-size-adjust: 100%; min-height: 100vh; padding-bottom: 120px;
  }

  .hdr { background: #191f28; color: #fff; padding: 24px 20px 20px; position: sticky; top: 0; z-index: 100; }
  .hdr-badge { font-size: 11px; font-weight: 700; color: #3182f6; letter-spacing: 1px; margin-bottom: 4px; }
  .hdr-name { font-size: 20px; font-weight: 800; letter-spacing: -1px; line-height: 1.3; }
  .hdr-sub { font-size: 13px; color: #8b95a1; margin-top: 6px; line-height: 1.5; }
  .hdr-instructor { display: inline-block; margin-top: 10px; padding: 4px 12px; background: #2d333b; border-radius: 8px; font-size: 13px; font-weight: 700; color: #3182f6; }

  .progress-wrap { background: #191f28; padding: 0 20px 16px; border-bottom: 1px solid #2d333b; }
  .progress-bar { background: #2d333b; height: 6px; border-radius: 3px; overflow: hidden; }
  .progress-fill { height: 100%; background: linear-gradient(90deg, #3182f6, #00b894); border-radius: 3px; transition: width 0.4s ease; }
  .progress-text { font-size: 12px; color: #6b7684; margin-top: 6px; text-align: right; }
  .progress-text b { color: #3182f6; }

  .phase-tabs { display: flex; gap: 6px; padding: 12px 12px 4px; overflow-x: auto; -webkit-overflow-scrolling: touch; }
  .phase-tab { flex-shrink: 0; padding: 8px 16px; border-radius: 20px; border: 1px solid #d1d6db; background: #fff; color: #6b7684; font-size: 13px; font-weight: 700; font-family: inherit; cursor: pointer; transition: all 0.2s; }
  .phase-tab.active { background: #3182f6; border-color: #3182f6; color: #fff; }
  .phase-tab .tc { display: inline-block; margin-left: 4px; padding: 1px 6px; border-radius: 8px; font-size: 10px; background: rgba(0,0,0,0.08); }
  .phase-tab.active .tc { background: rgba(255,255,255,0.25); }

  .section { margin: 12px 12px 0; }
  .sec-header { display: flex; justify-content: space-between; align-items: center; padding: 14px 16px; background: #fff; border-radius: 16px 16px 0 0; border-bottom: 1px solid #f2f4f6; }
  .sec-title { font-size: 15px; font-weight: 800; color: #191f28; letter-spacing: -0.5px; }
  .sec-count { font-size: 12px; font-weight: 700; color: #3182f6; background: #f2f7ff; padding: 2px 10px; border-radius: 12px; }

  .item { background: #fff; padding: 14px 16px; border-bottom: 1px solid #f2f4f6; display: flex; gap: 12px; align-items: flex-start; }
  .item:last-child { border-bottom: none; border-radius: 0 0 16px 16px; }

  .si { width: 24px; height: 24px; border-radius: 7px; border: 2px solid #d1d6db; background: #fff; flex-shrink: 0; display: flex; align-items: center; justify-content: center; font-size: 13px; margin-top: 1px; color: transparent; transition: all 0.2s; }
  .si.done { border-color: #00b894; background: #00b894; color: #fff; }

  .item-body { flex: 1; min-width: 0; }
  .item-title { font-size: 14px; font-weight: 700; color: #191f28; word-break: keep-all; line-height: 1.4; }
  .item-desc { font-size: 12px; color: #8b95a1; margin-top: 3px; line-height: 1.5; word-break: keep-all; }
  .item-tags { display: flex; gap: 6px; margin-top: 6px; flex-wrap: wrap; }
  .tag { font-size: 10px; font-weight: 700; padding: 2px 8px; border-radius: 6px; white-space: nowrap; }
  .tag-must { background: #fff0f0; color: #e8344e; }
  .tag-nice { background: #f2f4f6; color: #8b95a1; }
  .tag-done { background: #edf8f0; color: #1b8a4a; }

  .text-input {
    width: 100%; padding: 10px 12px; border: 1px solid #e5e8eb; border-radius: 10px;
    font-size: 13px; font-family: inherit; color: #191f28; background: #fafbfc;
    resize: vertical; min-height: 38px; outline: none; line-height: 1.5; margin-top: 10px;
  }
  .text-input:focus { border-color: #3182f6; background: #fff; }
  .text-input::placeholder { color: #b0b8c1; }

  .file-check { margin-top: 10px; display: flex; align-items: center; gap: 8px; }
  .fc-btn { width: 20px; height: 20px; border-radius: 6px; border: 2px solid #d1d6db; background: #fff; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 11px; color: transparent; transition: all 0.2s; }
  .fc-btn.on { border-color: #3182f6; background: #3182f6; color: #fff; }
  .fc-label { font-size: 12px; color: #6b7684; }

  .phase-desc { margin: 12px 12px 0; padding: 16px; background: #fff; border-radius: 16px; border-left: 4px solid #f7971e; }
  .phase-desc-title { font-size: 14px; font-weight: 800; color: #191f28; margin-bottom: 4px; }
  .phase-desc-text { font-size: 12px; color: #6b7684; line-height: 1.6; }

  .bottom-bar { position: fixed; bottom: 0; left: 0; right: 0; background: #fff; padding: 12px 16px; z-index: 100; border-top: 1px solid #e5e8eb; display: flex; gap: 10px; align-items: center; box-shadow: 0 -2px 12px rgba(0,0,0,0.06); }
  .bottom-text { font-size: 12px; color: #4e5968; font-weight: 600; flex: 1; }
  .bottom-text b { color: #3182f6; }
  .btn-group { display: flex; gap: 8px; }
  .copy-btn { padding: 10px 16px; border-radius: 10px; border: none; background: #3182f6; color: #fff; font-size: 13px; font-weight: 700; font-family: inherit; cursor: pointer; white-space: nowrap; }
  .copy-btn.copied { background: #00b894; }
  .dl-btn { padding: 10px 16px; border-radius: 10px; border: 1px solid #3182f6; background: #fff; color: #3182f6; font-size: 13px; font-weight: 700; font-family: inherit; cursor: pointer; white-space: nowrap; }

  .toast { position: fixed; bottom: 80px; left: 50%; transform: translateX(-50%); background: #191f28; color: #fff; padding: 10px 24px; border-radius: 12px; font-size: 13px; font-weight: 600; z-index: 200; opacity: 0; transition: opacity 0.3s; pointer-events: none; }
  .toast.show { opacity: 1; }
</style>
</head>
<body>
<div id="app"></div>
<div id="toast" class="toast"></div>

<script>
const INSTRUCTOR = new URLSearchParams(location.search).get('name') || '강사님';
const SK = 'buup_ob_' + encodeURIComponent(INSTRUCTOR);
let data = JSON.parse(localStorage.getItem(SK) || '{}'); // { key: { text, fileOk } }
let phase = 0;

function save() { localStorage.setItem(SK, JSON.stringify(data)); }
function get(key) { return data[key] || {}; }
function isDone(key) { const d = get(key); return !!(d.text && d.text.trim()) || !!d.fileOk; }

function onInput(key) {
  const el = document.getElementById('t_' + key);
  if (!el) return;
  if (!data[key]) data[key] = {};
  data[key].text = el.value;
  save();
  updateStatus(key);
  updateProgress();
}

function toggleFile(key) {
  if (!data[key]) data[key] = {};
  data[key].fileOk = !data[key].fileOk;
  save();
  updateStatus(key);
  updateProgress();
}

function updateStatus(key) {
  const si = document.getElementById('si_' + key);
  const done = isDone(key);
  if (si) { si.className = 'si' + (done ? ' done' : ''); }
}

function updateProgress() {
  const all = getAllItems();
  const done = all.filter(i => isDone(i.key)).length;
  const pct = all.length > 0 ? Math.round((done / all.length) * 100) : 0;
  const pf = document.getElementById('pf');
  const pt = document.getElementById('pt');
  if (pf) pf.style.width = pct + '%';
  if (pt) pt.innerHTML = '<b>' + done + '</b> / ' + all.length + ' (' + pct + '%)';
}

function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2000);
}

function copyAll() {
  const text = buildExport();
  navigator.clipboard.writeText(text).then(() => {
    toast('전체 내용이 클립보드에 복사되었습니다');
    const btn = document.getElementById('copyBtn');
    if (btn) { btn.classList.add('copied'); btn.textContent = '복사 완료'; setTimeout(() => { btn.classList.remove('copied'); btn.textContent = '전체 복사'; }, 2000); }
  });
}

function buildExport() {
  let text = '[ ' + INSTRUCTOR + ' ] 강의 준비 자료\n';
  text += '='.repeat(40) + '\n\n';
  PHASES.forEach(ph => {
    text += '## ' + ph.label + ' (' + ph.when + ')\n\n';
    ph.sections.forEach(sec => {
      text += '### ' + sec.title + '\n';
      sec.items.forEach(item => {
        const d = get(item.key);
        const status = isDone(item.key) ? '[v]' : '[ ]';
        text += status + ' ' + item.title + '\n';
        if (d.text && d.text.trim()) text += '   > ' + d.text.trim().replace(/\n/g, '\n   > ') + '\n';
        if (d.fileOk) text += '   (파일 준비 완료)\n';
        text += '\n';
      });
    });
    text += '\n';
  });
  return text;
}

function downloadAll() {
  const text = buildExport();
  const blob = new Blob([text], { type: 'text/plain;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = INSTRUCTOR + '_강의준비자료.txt';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
  toast('파일이 다운로드되었습니다');
}

// === DATA ===
const PHASES = [
  {
    id: 1, label: '1차 요청', when: '미팅 직후',
    desc: '강사님의 기본 프로필과 신뢰 증빙 자료입니다. 랜딩페이지의 핵심 소구점이 됩니다.',
    sections: [
      { title: '프로필', items: [
        { key: 'p1', title: '활동명 / 본명', desc: '랜딩페이지 크리에이터 소개에 표기됩니다', must: true, type: 'text' },
        { key: 'p2', title: '한 줄 소개 (20자 이내)', desc: '썸네일, 배너, 광고 소재에 활용됩니다', must: true, type: 'text' },
        { key: 'p3', title: '경력 요약 (3~5줄)', desc: '본업 경력, 핵심 성과 위주로 작성해주세요', must: true, type: 'text', rows: 4 },
        { key: 'p4', title: '나의 스토리 (시작 계기 > 전환점 > 현재)', desc: '랜딩페이지 스토리 섹션에 활용됩니다. 수강생이 공감할 수 있는 이야기가 좋습니다', must: true, type: 'text', rows: 6 },
        { key: 'p5', title: '프로필 사진 (정면, 고화질)', desc: '밝은 조명, 깔끔한 배경 권장. 랜딩/광고 전 소재에 사용됩니다', must: true, type: 'file' },
        { key: 'p6', title: '작업 환경/일상 사진 3장 이상', desc: '실제 작업하는 모습, 장비, 공간 등 리얼한 사진이 신뢰감을 줍니다', must: true, type: 'file' },
        { key: 'p7', title: 'SNS/유튜브 채널 링크 전체', desc: '팔로워 수와 함께 랜딩페이지에 연결됩니다', must: true, type: 'text', rows: 2 },
        { key: 'p8', title: '미디어 노출 이력 (기사/방송/인터뷰)', desc: '있으시면 권위 뱃지로 활용합니다', must: false, type: 'text' },
      ]},
      { title: '신뢰 증빙', items: [
        { key: 't1', title: '소득/매출 증빙 캡처 3장 이상', desc: '정산내역, 매출 대시보드, 통장 입금 내역 등. 민감한 부분은 가려도 됩니다', must: true, type: 'file' },
        { key: 't2', title: '증빙 기간 (최근 몇 개월치인지)', desc: '1~2개월이 아닌 지속적 수익임을 보여주는 것이 중요합니다', must: true, type: 'text' },
        { key: 't3', title: '대표 숫자 3개', desc: '예: 월수익 OO만원 / 경력 OO년 / 수강생 OO명. 랜딩 상단 핵심 뱃지에 들어갑니다', must: true, type: 'text' },
        { key: 't4', title: '자격증/수상/인증 내역', desc: '공식 자격이나 수상 이력이 있으면 권위 보조 요소로 활용합니다', must: false, type: 'file' },
        { key: 't5', title: '사업자등록증 / 세금신고서 (내부 검증용)', desc: '외부 공개되지 않습니다. 내부 강사 검증 절차에만 사용됩니다', must: true, type: 'file' },
      ]},
      { title: '수강생 사례', items: [
        { key: 's1', title: '수강생 성과 사례 5건 이상 (Before/After)', desc: '"월 0원에서 월 150만원" 같은 구체적 숫자 포함', must: true, type: 'both', rows: 5 },
        { key: 's2', title: '수강생 후기 캡처 10장 이상', desc: '카톡, DM, 커뮤니티, 네이버카페 후기 등. 많을수록 전환율이 올라갑니다', must: true, type: 'file' },
        { key: 's3', title: '수강생 인터뷰 가능자 1~2명', desc: '영상 후기 촬영에 협조 가능한 분의 연락처', must: true, type: 'text' },
        { key: 's4', title: '기존 강의 수강생 수', desc: '"누적 OOO명 수강" 뱃지에 활용됩니다', must: false, type: 'text' },
        { key: 's5', title: '커뮤니티/오픈채팅방 활성화 캡처', desc: '운영 중인 커뮤니티가 있다면 활발한 대화 캡처', must: false, type: 'file' },
        { key: 's6', title: '세미나/강연/워크숍 경험 여부', desc: '오프라인/온라인 세미나 진행 경험이 있으시면 알려주세요', must: true, type: 'text' },
        { key: 's7', title: '세미나/강연 현장 사진', desc: '진행했던 세미나, 강연, 워크숍 현장 사진', must: false, type: 'file' },
      ]}
    ]
  },
  {
    id: 2, label: '2차 요청', when: '기획 확정 후',
    desc: '강의의 구체적인 설계와 타겟팅 자료입니다. 커리큘럼 섹션과 광고 타겟에 활용됩니다.',
    sections: [
      { title: '강의 구조', items: [
        { key: 'c1', title: '총 강의 기간 (몇 주)', desc: '예: 4주, 6주, 8주 등', must: true, type: 'text' },
        { key: 'c2', title: 'VOD / 라이브 / 혼합 여부', desc: '어떤 형태로 진행하실지, 혼합이면 비율도 알려주세요', must: true, type: 'text' },
        { key: 'c3', title: '커리큘럼 (주차별 강의 제목 + 1줄 설명 + 중요도)', desc: '주차별로 묶어서 작성해주세요', must: true, type: 'text', rows: 8 },
        { key: 'c4', title: '강의당 예상 시간', desc: '"총 OO시간 분량"으로 표기합니다', must: true, type: 'text' },
        { key: 'c5', title: '수강 후 결과물 (뭘 만들 수 있는지)', desc: '랜딩 히어로 섹션의 핵심 카피. 가장 중요한 항목입니다', must: true, type: 'text', rows: 3 },
        { key: 'c10', title: '맛보기 강의 1개 (통째로 공개 가능한 것)', desc: '가장 임팩트 있는 강의 1개를 무료 공개용으로 선정해주세요', must: true, type: 'file' },
        { key: 'c6', title: '제공 부교재 목록', desc: '템플릿, 엑셀, PDF, 노션 등 제공하는 자료', must: true, type: 'text', rows: 3 },
        { key: 'c7', title: '과제/미션 구조', desc: '실습 과제가 있으면 "실전형 강의" 소구에 활용됩니다', must: false, type: 'text' },
        { key: 'c8', title: '커뮤니티/QnA 운영 방식', desc: '오픈채팅방, 슬랙, 디스코드 등', must: true, type: 'text' },
        { key: 'c9', title: '수료증 발급 여부', desc: '발급 시 부가 혜택으로 표기합니다', must: false, type: 'text' },
      ]},
      { title: '타겟 & 포지셔닝', items: [
        { key: 'g1', title: '타겟 페르소나 3개', desc: '각각 나이/직업/상황/고민을 포함해주세요', must: true, type: 'text', rows: 5 },
        { key: 'g2', title: '이런 사람은 듣지 마세요 (역타겟 3개)', desc: '오히려 신뢰도를 올려주고 환불율을 낮춰줍니다', must: true, type: 'text', rows: 3 },
        { key: 'g3', title: '경쟁 강의 대비 차별점', desc: '"왜 이 강의여야 하는가"에 대한 답변', must: true, type: 'text', rows: 3 },
        { key: 'g4', title: '"유튜브에서 무료로 배울 수 있는데 왜 돈 내야 해?" 답변', desc: '수강 망설이는 분들의 가장 큰 반론입니다', must: true, type: 'text', rows: 3 },
        { key: 'g5', title: 'FAQ 5개 이상', desc: '예상 질문과 답변', must: true, type: 'text', rows: 8 },
      ]}
    ]
  },
  {
    id: 3, label: '3차 요청', when: '프로덕션 진입 시',
    desc: '마케팅 소재와 운영에 필요한 자료입니다. 광고/영상 제작 시 활용됩니다.',
    sections: [
      { title: '비주얼/영상 소재', items: [
        { key: 'v1', title: '유튜브 출연 동의 및 희망 횟수', desc: '부업남/사찍남 채널 출연 동의 여부와 몇 회 출연 가능한지', must: true, type: 'text' },
        { key: 'v2', title: '광고 영상 촬영 동의', desc: '퍼포먼스 광고용 영상 촬영 참여 가능 여부', must: true, type: 'text' },
        { key: 'v3', title: 'Before/After 극적인 사진', desc: '시작 전과 현재를 비교할 수 있는 사진. 차이가 확실할수록 좋습니다', must: true, type: 'file' },
        { key: 'v4', title: '과정 기록 사진/영상', desc: '성장 과정에서 찍어둔 사진이나 영상. 초기 작업물, 첫 수익 캡처 등', must: true, type: 'file' },
        { key: 'v5', title: '소득/매출 화면 캡처 (고화질)', desc: '랜딩페이지 및 광고 소재에 직접 사용됩니다', must: true, type: 'file' },
        { key: 'v6', title: '작업 환경/일상 촬영용 사진', desc: '실제 작업하는 모습, 장비, 공간', must: true, type: 'file' },
        { key: 'v7', title: '강의 썸네일용 포즈 사진 (표정 다양하게 3장+)', desc: '배경 제거 가능한 사진. 강의 썸네일/광고 배너에 활용', must: true, type: 'file' },
        { key: 'v8', title: '강의 미리보기 영상 (1~2분)', desc: '실제 강의 일부를 보여주는 맛보기 영상', must: true, type: 'file' },
      ]},
      { title: '카피 소재', items: [
        { key: 'w1', title: '강의 한 줄 요약', desc: '히어로 카피 초안으로 활용됩니다', must: true, type: 'text' },
        { key: 'w2', title: '"왜 이 강의를 만들었는가" (3줄)', desc: '스토리 섹션에서 진정성을 보여주는 파트입니다', must: true, type: 'text', rows: 3 },
        { key: 'w3', title: '수강생이 가장 많이 하는 칭찬', desc: '강사님이 직접 느끼시는 강점', must: true, type: 'text' },
        { key: 'w4', title: '수강 전 가장 큰 걱정 3가지 + 답변', desc: '망설이는 수강생의 결정을 도와줍니다', must: true, type: 'text', rows: 5 },
        { key: 'w6', title: '"다른 강의와 뭐가 다른가요?" 답변', desc: '이 강의만의 고유한 강점을 적어주세요', must: true, type: 'text', rows: 3 },
        { key: 'w7', title: '강의를 안 들으면 생기는 문제', desc: '"혼자 하면 OO개월 허비합니다" 같은 현실적인 경고', must: false, type: 'text' },
        { key: 'w5', title: '수강생에게 하고 싶은 말', desc: '랜딩페이지 클로징 감성 섹션에 활용됩니다', must: false, type: 'text', rows: 3 },
      ]},
      { title: '운영/계약', items: [
        { key: 'o1', title: '희망 가격대 (원가 + 할인가)', desc: '할인율 소구에 활용합니다', must: true, type: 'text' },
        { key: 'o10', title: '할부 옵션 협의', desc: '"월 OO만원 (N개월)" 표기가 전환율에 큰 영향을 줍니다', must: true, type: 'text' },
        { key: 'o2', title: '얼리버드/할인 구조 의견', desc: '런칭 프로모션 긴급성 설계에 참고합니다', must: true, type: 'text' },
        { key: 'o11', title: '성과 보증/환급 제도 의향', desc: '"OO 달성 못하면 환불" 같은 보증 제도', must: false, type: 'text' },
        { key: 'o3', title: '환불 조건 (며칠 이내, 수강률 등)', desc: '랜딩페이지 보증/환불 섹션에 명시됩니다', must: true, type: 'text' },
        { key: 'o4', title: '웨비나/설명회 진행 가능 여부', desc: '런칭 퍼널 설계에 활용됩니다', must: true, type: 'text' },
        { key: 'o5', title: '광고 출연 동의 (얼굴/이름/성과 노출)', desc: '퍼포먼스 마케팅 집행에 필요합니다', must: true, type: 'text' },
        { key: 'o6', title: '기존 DB 규모 (이메일/오픈채팅방 등)', desc: '런칭 초기 모수 확보에 중요합니다', must: true, type: 'text' },
        { key: 'o7', title: '타 플랫폼 독점 계약 유무', desc: '법적 리스크 확인용', must: true, type: 'text' },
        { key: 'o8', title: '희망 오픈 일정', desc: '런칭 로드맵 설계에 반영됩니다', must: true, type: 'text' },
        { key: 'o9', title: '2기/3기 반복 운영 의향', desc: '장기 수익 설계 참고용', must: false, type: 'text' },
      ]}
    ]
  }
];

function getAllItems() {
  const r = [];
  PHASES.forEach(ph => ph.sections.forEach(sec => sec.items.forEach(it => r.push(it))));
  return r;
}
function getPhaseItems(id) {
  const r = [];
  const ph = PHASES.find(p => p.id === id);
  if (ph) ph.sections.forEach(sec => sec.items.forEach(it => r.push(it)));
  return r;
}

function setPhase(p) { phase = p; render(); }

function render() {
  const all = getAllItems();
  const done = all.filter(i => isDone(i.key)).length;
  const pct = all.length > 0 ? Math.round((done / all.length) * 100) : 0;
  const list = phase === 0 ? PHASES : PHASES.filter(p => p.id === phase);

  let h = `
    <div class="hdr">
      <div class="hdr-badge">ONBOARDING CHECKLIST</div>
      <div class="hdr-name">강의 준비 자료 체크리스트</div>
      <div class="hdr-sub">각 항목에 내용을 입력해주세요. 입력한 내용은 자동 저장됩니다.<br>파일은 카카오톡 또는 구글드라이브로 별도 전달 부탁드립니다.</div>
      <div class="hdr-instructor">${INSTRUCTOR}</div>
    </div>
    <div class="progress-wrap">
      <div class="progress-bar"><div id="pf" class="progress-fill" style="width:${pct}%"></div></div>
      <div id="pt" class="progress-text"><b>${done}</b> / ${all.length} (${pct}%)</div>
    </div>
    <div class="phase-tabs">
      <button class="phase-tab ${phase===0?'active':''}" onclick="setPhase(0)">전체<span class="tc">${done}/${all.length}</span></button>
      ${PHASES.map(ph => {
        const pi = getPhaseItems(ph.id), pd = pi.filter(i=>isDone(i.key)).length;
        return `<button class="phase-tab ${phase===ph.id?'active':''}" onclick="setPhase(${ph.id})">${ph.label}<span class="tc">${pd}/${pi.length}</span></button>`;
      }).join('')}
    </div>
  `;

  list.forEach(ph => {
    h += `<div class="phase-desc"><div class="phase-desc-title">${ph.label} - ${ph.when}</div><div class="phase-desc-text">${ph.desc}</div></div>`;
    ph.sections.forEach(sec => {
      const sd = sec.items.filter(i=>isDone(i.key)).length;
      h += `<div class="section"><div class="sec-header"><div class="sec-title">${sec.title}</div><div class="sec-count">${sd}/${sec.items.length}</div></div>`;
      sec.items.forEach(item => {
        const d = get(item.key);
        const done = isDone(item.key);
        const rows = item.rows || 2;
        const showText = item.type === 'text' || item.type === 'both';
        const showFile = item.type === 'file' || item.type === 'both';

        h += `<div class="item">
          <div id="si_${item.key}" class="si ${done?'done':''}">\u2713</div>
          <div class="item-body">
            <div class="item-title">${item.title}</div>
            <div class="item-desc">${item.desc}</div>
            <div class="item-tags">
              ${item.must ? '<span class="tag tag-must">필수</span>' : '<span class="tag tag-nice">선택</span>'}
              ${done ? '<span class="tag tag-done">입력완료</span>' : ''}
            </div>`;

        if (showText) {
          h += `<textarea id="t_${item.key}" class="text-input" rows="${rows}" placeholder="여기에 입력해주세요..." oninput="onInput('${item.key}')">${d.text||''}</textarea>`;
        }
        if (showFile) {
          h += `<div class="file-check">
            <div class="fc-btn ${d.fileOk?'on':''}" onclick="toggleFile('${item.key}')">\u2713</div>
            <span class="fc-label">${d.fileOk ? '파일 준비 완료' : '파일 준비되면 체크해주세요'}</span>
          </div>`;
        }

        h += `</div></div>`;
      });
      h += `</div>`;
    });
  });

  h += `<div class="bottom-bar">
    <div class="bottom-text"><b>${done}</b>/${all.length} 완료</div>
    <div class="btn-group">
      <button class="dl-btn" onclick="downloadAll()">다운로드</button>
      <button id="copyBtn" class="copy-btn" onclick="copyAll()">전체 복사</button>
    </div>
  </div>`;

  document.getElementById('app').innerHTML = h;
}

render();
</script>
</body>
</html>
