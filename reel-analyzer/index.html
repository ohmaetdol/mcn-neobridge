<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>릴스 기획서 생성기</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: -apple-system, 'Pretendard', sans-serif;
  background: #fff;
  color: #191f28;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 60px 20px;
}

.container {
  width: 100%;
  max-width: 560px;
}

h1 {
  font-size: 24px;
  font-weight: 700;
  margin-bottom: 8px;
}

.subtitle {
  font-size: 14px;
  color: #8b95a1;
  margin-bottom: 40px;
}

/* Upload Area */
.upload-area {
  border: 2px dashed #e5e8eb;
  border-radius: 16px;
  padding: 48px 24px;
  text-align: center;
  cursor: pointer;
  transition: all 0.2s;
  margin-bottom: 24px;
}
.upload-area:hover, .upload-area.dragover {
  border-color: #3182f6;
  background: #f8fbff;
}
.upload-area.has-file {
  border-color: #3182f6;
  border-style: solid;
  background: #f8fbff;
}
.upload-icon {
  width: 48px;
  height: 48px;
  margin: 0 auto 16px;
  background: #f2f4f6;
  border-radius: 12px;
  display: flex;
  align-items: center;
  justify-content: center;
}
.upload-icon svg { width: 24px; height: 24px; color: #8b95a1; }
.upload-text { font-size: 15px; color: #4e5968; }
.upload-hint { font-size: 13px; color: #8b95a1; margin-top: 8px; }
.file-name {
  font-size: 14px;
  font-weight: 600;
  color: #3182f6;
  margin-top: 8px;
}

/* Topic Input */
.input-group {
  margin-bottom: 24px;
}
.input-group label {
  display: block;
  font-size: 13px;
  font-weight: 600;
  color: #4e5968;
  margin-bottom: 8px;
}
.input-group input, .input-group select {
  width: 100%;
  padding: 14px 16px;
  border: 1px solid #e5e8eb;
  border-radius: 12px;
  font-size: 15px;
  outline: none;
  transition: border-color 0.2s;
}
.input-group input:focus, .input-group select:focus {
  border-color: #3182f6;
}
.input-group input::placeholder { color: #adb5bd; }

/* Button */
.btn-generate {
  width: 100%;
  padding: 16px;
  background: #3182f6;
  color: #fff;
  border: none;
  border-radius: 12px;
  font-size: 16px;
  font-weight: 600;
  cursor: pointer;
  transition: background 0.2s;
}
.btn-generate:hover { background: #1b64da; }
.btn-generate:disabled {
  background: #e5e8eb;
  color: #adb5bd;
  cursor: not-allowed;
}

/* Progress */
.progress {
  display: none;
  margin-top: 24px;
  text-align: center;
}
.progress.active { display: block; }
.progress-bar {
  height: 4px;
  background: #e5e8eb;
  border-radius: 2px;
  overflow: hidden;
  margin-bottom: 12px;
}
.progress-bar-fill {
  height: 100%;
  background: #3182f6;
  border-radius: 2px;
  transition: width 0.3s;
  animation: pulse 1.5s infinite;
}
@keyframes pulse {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.6; }
}
.progress-text { font-size: 13px; color: #8b95a1; }

/* Result */
.result {
  display: none;
  margin-top: 32px;
}
.result.active { display: block; }
.result-card {
  background: #f8f9fa;
  border-radius: 16px;
  padding: 24px;
  margin-bottom: 16px;
}
.result-card h3 {
  font-size: 16px;
  font-weight: 700;
  margin-bottom: 16px;
  color: #191f28;
}
.result-section {
  margin-bottom: 20px;
}
.result-section:last-child { margin-bottom: 0; }
.result-label {
  font-size: 11px;
  font-weight: 700;
  color: #3182f6;
  text-transform: uppercase;
  letter-spacing: 0.5px;
  margin-bottom: 6px;
}
.result-value {
  font-size: 14px;
  line-height: 1.6;
  color: #333d4b;
}
.hook-text {
  font-size: 18px;
  font-weight: 700;
  color: #191f28;
  padding: 16px;
  background: #fff;
  border-radius: 12px;
  border-left: 4px solid #3182f6;
}
.scene-list {
  list-style: none;
}
.scene-item {
  padding: 14px;
  background: #fff;
  border-radius: 10px;
  margin-bottom: 8px;
}
.scene-header {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 6px;
}
.scene-num {
  width: 22px;
  height: 22px;
  background: #3182f6;
  color: #fff;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 11px;
  font-weight: 700;
  flex-shrink: 0;
}
.scene-time {
  font-size: 12px;
  color: #8b95a1;
}
.scene-action {
  font-size: 13px;
  color: #333d4b;
  line-height: 1.5;
  margin-left: 30px;
}
.scene-text {
  font-size: 12px;
  color: #3182f6;
  margin-left: 30px;
  margin-top: 4px;
}

.alt-hooks {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin-top: 8px;
}
.alt-hook {
  padding: 8px 12px;
  background: #fff;
  border-radius: 8px;
  font-size: 13px;
  color: #4e5968;
  border: 1px solid #e5e8eb;
}

.caption-box {
  font-size: 13px;
  line-height: 1.7;
  color: #4e5968;
  background: #fff;
  border-radius: 10px;
  padding: 14px;
  white-space: pre-wrap;
}

.checklist {
  list-style: none;
}
.checklist li {
  padding: 6px 0;
  font-size: 13px;
  color: #4e5968;
}
.checklist li::before {
  content: '';
  display: inline-block;
  width: 16px;
  height: 16px;
  border: 2px solid #e5e8eb;
  border-radius: 4px;
  margin-right: 10px;
  vertical-align: middle;
}

.frames-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
  gap: 8px;
  margin-top: 8px;
}
.frames-grid img {
  width: 100%;
  border-radius: 8px;
  aspect-ratio: 9/16;
  object-fit: cover;
}

/* API key bar - hidden (hardcoded) */
.api-key-bar { display: none; }

/* Video Preview */
.video-preview {
  display: none;
  margin: 12px 0;
  border-radius: 12px;
  overflow: hidden;
  max-height: 300px;
}
.video-preview video {
  width: 100%;
  max-height: 300px;
  object-fit: contain;
  background: #000;
}
</style>
</head>
<body>

<div class="api-key-bar">
  <input type="hidden" id="apiKey" value="AIzaSyBjATr1K0AT5pfkp-wJK7HofGI8_SPH4qk">
</div>

<div class="container">
  <h1>릴스 기획서 생성기</h1>
  <p class="subtitle">레퍼런스 영상을 넣으면 촬영 기획서가 나옵니다</p>

  <!-- Upload -->
  <div class="upload-area" id="uploadArea">
    <div class="upload-icon">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/>
        <polyline points="17 8 12 3 7 8"/>
        <line x1="12" y1="3" x2="12" y2="15"/>
      </svg>
    </div>
    <div class="upload-text">레퍼런스 영상을 올려주세요</div>
    <div class="upload-hint">mp4, mov (최대 20MB)</div>
    <div class="file-name" id="fileName"></div>
    <div class="video-preview" id="videoPreview"><video id="previewVideo" controls></video></div>
  </div>
  <input type="file" id="fileInput" accept="video/*" hidden>

  <!-- Topic -->
  <div class="input-group">
    <label>오늘의 기획 주제</label>
    <input type="text" id="topicInput" placeholder="예: 일주일 -3kg 식단 루틴">
  </div>

  <div class="input-group">
    <label>콘텐츠 형식</label>
    <select id="formatSelect">
      <option value="bgm_text">BGM + 텍스트 (추천)</option>
      <option value="narration">나레이션</option>
    </select>
  </div>

  <!-- Generate -->
  <button class="btn-generate" id="btnGenerate" disabled>기획서 생성</button>

  <!-- Progress -->
  <div class="progress" id="progress">
    <div class="progress-bar"><div class="progress-bar-fill" id="progressFill"></div></div>
    <div class="progress-text" id="progressText">영상 분석중...</div>
  </div>

  <!-- Result -->
  <div class="result" id="result"></div>
</div>

<script>
const VIRAL_FORMULA = `핵심 데이터:
- 50만+ 바이럴 영상 첫 3초: 평균 27자 (짧고 강렬)
- BGM+텍스트가 나레이션보다 6.5배 높은 조회수
- 터지는 후킹 패턴: 숫자+결과, 비포애프터, 충격반전, 문제공감, 권위/비밀
- 30-45초 최적 길이
- 후킹(3초) → 문제제기(5초) → 해결/정보(20초) → CTA(5초) 구조`;

// State
let videoFile = null;
let videoFrames = [];

// Elements
const uploadArea = document.getElementById('uploadArea');
const fileInput = document.getElementById('fileInput');
const fileName = document.getElementById('fileName');
const topicInput = document.getElementById('topicInput');
const btnGenerate = document.getElementById('btnGenerate');
const progress = document.getElementById('progress');
const progressFill = document.getElementById('progressFill');
const progressText = document.getElementById('progressText');
const result = document.getElementById('result');
const apiKeyInput = document.getElementById('apiKey');
const videoPreview = document.getElementById('videoPreview');
const previewVideo = document.getElementById('previewVideo');

// API key is hardcoded

// Upload handlers
uploadArea.addEventListener('click', () => fileInput.click());
uploadArea.addEventListener('dragover', e => { e.preventDefault(); uploadArea.classList.add('dragover'); });
uploadArea.addEventListener('dragleave', () => uploadArea.classList.remove('dragover'));
uploadArea.addEventListener('drop', e => {
  e.preventDefault();
  uploadArea.classList.remove('dragover');
  if (e.dataTransfer.files[0]) handleFile(e.dataTransfer.files[0]);
});
fileInput.addEventListener('change', e => { if (e.target.files[0]) handleFile(e.target.files[0]); });

function handleFile(file) {
  if (!file.type.startsWith('video/')) return;
  if (file.size > 20 * 1024 * 1024) { alert('20MB 이하 파일만 가능합니다'); return; }
  videoFile = file;
  fileName.textContent = file.name;
  uploadArea.classList.add('has-file');

  // Show preview
  const url = URL.createObjectURL(file);
  previewVideo.src = url;
  videoPreview.style.display = 'block';

  checkReady();
}

topicInput.addEventListener('input', checkReady);

function checkReady() {
  btnGenerate.disabled = !(videoFile && topicInput.value.trim());
}

// Frame extraction from video
async function extractFrames(file, count = 6) {
  return new Promise((resolve) => {
    const video = document.createElement('video');
    const url = URL.createObjectURL(file);
    video.src = url;
    video.muted = true;

    video.addEventListener('loadedmetadata', async () => {
      const duration = video.duration;
      const canvas = document.createElement('canvas');
      const ctx = canvas.getContext('2d');
      canvas.width = 360;
      canvas.height = 640;

      const frames = [];
      const times = [];
      for (let i = 0; i < count; i++) {
        times.push((duration / count) * i + 0.5);
      }

      let idx = 0;
      video.addEventListener('seeked', () => {
        ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
        const dataUrl = canvas.toDataURL('image/jpeg', 0.7);
        frames.push({
          time: times[idx].toFixed(1),
          data: dataUrl.split(',')[1] // base64 only
        });
        idx++;
        if (idx < times.length) {
          video.currentTime = times[idx];
        } else {
          URL.revokeObjectURL(url);
          resolve(frames);
        }
      });

      video.currentTime = times[0];
    });
  });
}

// Generate plan
btnGenerate.addEventListener('click', async () => {
  const apiKey = apiKeyInput.value.trim();
  const topic = topicInput.value.trim();
  const format = document.getElementById('formatSelect').value;

  if (!apiKey || !videoFile || !topic) return;

  btnGenerate.disabled = true;
  progress.classList.add('active');
  result.classList.remove('active');

  try {
    // Step 1: Extract frames
    setProgress(20, '프레임 추출중...');
    videoFrames = await extractFrames(videoFile, 6);

    // Step 2: Send to Gemini
    setProgress(50, 'AI 기획서 생성중...');
    const plan = await callGemini(apiKey, topic, format, videoFrames);

    // Step 3: Render result
    setProgress(100, '완료!');
    setTimeout(() => {
      progress.classList.remove('active');
      renderResult(plan);
    }, 500);

  } catch (err) {
    progress.classList.remove('active');
    alert('오류: ' + err.message);
    btnGenerate.disabled = false;
  }
});

function setProgress(pct, text) {
  progressFill.style.width = pct + '%';
  progressText.textContent = text;
}

async function callGemini(apiKey, topic, format, frames) {
  const formatLabel = format === 'bgm_text' ? 'BGM+텍스트 (나레이션 없음, 화면 텍스트로 전달)' : '나레이션 (직접 말하면서 촬영)';

  const prompt = `당신은 인스타그램 다이어트/웰니스 릴스 전문 기획자입니다.

## 바이럴 공식 (142개 영상 분석 결과)
${VIRAL_FORMULA}

## 요청
아래 레퍼런스 영상의 프레임들을 분석하고, 주어진 주제로 촬영 기획서를 만들어주세요.

## 주제: ${topic}
## 형식: ${formatLabel}

## 규칙
- 첫 3초 후킹은 반드시 20-27자 이내
- 총 영상 길이 30-45초
- 장면은 5-7개로 구성
- 각 장면에 구체적인 촬영 지시 포함

반드시 아래 JSON 형식으로만 응답하세요 (다른 텍스트 없이):
{
  "title": "기획서 제목",
  "hook_text": "첫 3초 후킹 텍스트 (20-27자)",
  "hook_alternatives": ["대안1", "대안2", "대안3"],
  "total_duration": "35초",
  "scenes": [
    {
      "number": 1,
      "time": "0-3초",
      "action": "구체적 촬영 내용",
      "text_overlay": "화면 텍스트",
      "tip": "촬영 팁"
    }
  ],
  "caption": "게시물 캡션 (해시태그 포함)",
  "checklist": ["준비물1", "준비물2"]
}`;

  // Build parts with frames
  const parts = [{ text: prompt }];
  for (const frame of frames) {
    parts.push({ text: `\n[영상 ${frame.time}초 프레임]` });
    parts.push({
      inline_data: {
        mime_type: 'image/jpeg',
        data: frame.data
      }
    });
  }

  const response = await fetch(
    `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${apiKey}`,
    {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        contents: [{ parts }],
        generationConfig: { temperature: 0.4, maxOutputTokens: 4096 }
      })
    }
  );

  if (!response.ok) {
    const err = await response.json();
    throw new Error(err.error?.message || 'API 호출 실패');
  }

  const data = await response.json();
  let text = data.candidates?.[0]?.content?.parts?.[0]?.text || '';

  // Extract JSON
  const jsonMatch = text.match(/```(?:json)?\s*\n([\s\S]*?)\n```/);
  if (jsonMatch) text = jsonMatch[1];

  const start = text.indexOf('{');
  const end = text.lastIndexOf('}');
  if (start !== -1 && end !== -1) {
    text = text.slice(start, end + 1);
  }

  return JSON.parse(text);
}

function renderResult(plan) {
  // Frame images HTML
  let framesHtml = '';
  if (videoFrames.length) {
    framesHtml = `
      <div class="result-card">
        <h3>레퍼런스 프레임</h3>
        <div class="frames-grid">
          ${videoFrames.map(f => `<img src="data:image/jpeg;base64,${f.data}" title="${f.time}s">`).join('')}
        </div>
      </div>`;
  }

  result.innerHTML = `
    ${framesHtml}

    <div class="result-card">
      <h3>${plan.title || '기획서'}</h3>

      <div class="result-section">
        <div class="result-label">첫 3초 후킹</div>
        <div class="hook-text">${plan.hook_text || ''}</div>
        ${plan.hook_alternatives ? `
        <div class="alt-hooks">
          ${plan.hook_alternatives.map(h => `<span class="alt-hook">${h}</span>`).join('')}
        </div>` : ''}
      </div>

      <div class="result-section">
        <div class="result-label">촬영 구성 (${plan.total_duration || '30-40초'})</div>
        <ul class="scene-list">
          ${(plan.scenes || []).map(s => `
            <li class="scene-item">
              <div class="scene-header">
                <span class="scene-num">${s.number}</span>
                <span class="scene-time">${s.time}</span>
              </div>
              <div class="scene-action">${s.action}</div>
              ${s.text_overlay ? `<div class="scene-text">${s.text_overlay}</div>` : ''}
            </li>
          `).join('')}
        </ul>
      </div>
    </div>

    <div class="result-card">
      <h3>캡션</h3>
      <div class="caption-box">${plan.caption || ''}</div>
    </div>

    ${plan.checklist ? `
    <div class="result-card">
      <h3>촬영 준비물</h3>
      <ul class="checklist">
        ${plan.checklist.map(c => `<li>${c}</li>`).join('')}
      </ul>
    </div>` : ''}
  `;

  result.classList.add('active');
  btnGenerate.disabled = false;
}
</script>
</body>
</html>
