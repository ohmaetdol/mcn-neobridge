<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>릴스 기획서 생성기</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: -apple-system, 'Pretendard', sans-serif;
  background: #fff;
  color: #191f28;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 40px 20px;
}
.container { width: 100%; max-width: 560px; }
h1 { font-size: 24px; font-weight: 700; margin-bottom: 8px; }
.subtitle { font-size: 14px; color: #8b95a1; margin-bottom: 40px; }

/* Upload */
.upload-area {
  border: 2px dashed #e5e8eb;
  border-radius: 16px;
  padding: 40px 24px;
  text-align: center;
  cursor: pointer;
  transition: all 0.2s;
  margin-bottom: 24px;
}
.upload-area:hover, .upload-area.dragover { border-color: #3182f6; background: #f8fbff; }
.upload-area.has-file { border-color: #3182f6; border-style: solid; background: #f8fbff; }
.upload-icon {
  width: 48px; height: 48px; margin: 0 auto 12px;
  background: #f2f4f6; border-radius: 12px;
  display: flex; align-items: center; justify-content: center;
}
.upload-icon svg { width: 24px; height: 24px; color: #8b95a1; }
.upload-text { font-size: 15px; color: #4e5968; }
.upload-hint { font-size: 13px; color: #8b95a1; margin-top: 6px; }
.file-name { font-size: 14px; font-weight: 600; color: #3182f6; margin-top: 8px; }
.video-preview { display: none; margin: 12px auto 0; border-radius: 10px; overflow: hidden; max-width: 200px; }
.video-preview video { width: 100%; border-radius: 10px; }

/* Input */
.input-group { margin-bottom: 20px; }
.input-group label { display: block; font-size: 13px; font-weight: 600; color: #4e5968; margin-bottom: 8px; }
.input-group input, .input-group select {
  width: 100%; padding: 14px 16px;
  border: 1px solid #e5e8eb; border-radius: 12px;
  font-size: 15px; outline: none; transition: border-color 0.2s;
}
.input-group input:focus { border-color: #3182f6; }
.input-group input::placeholder { color: #adb5bd; }

/* Button */
.btn-generate {
  width: 100%; padding: 16px;
  background: #3182f6; color: #fff; border: none; border-radius: 12px;
  font-size: 16px; font-weight: 600; cursor: pointer; transition: background 0.2s;
}
.btn-generate:hover { background: #1b64da; }
.btn-generate:disabled { background: #e5e8eb; color: #adb5bd; cursor: not-allowed; }

/* Progress */
.progress { display: none; margin-top: 24px; text-align: center; }
.progress.active { display: block; }
.progress-bar { height: 4px; background: #e5e8eb; border-radius: 2px; overflow: hidden; margin-bottom: 12px; }
.progress-fill { height: 100%; background: #3182f6; border-radius: 2px; transition: width 0.3s; animation: pulse 1.5s infinite; }
@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.6} }
.progress-text { font-size: 13px; color: #8b95a1; }

/* Result */
.result { display: none; margin-top: 32px; }
.result.active { display: block; }
.card { background: #f8f9fa; border-radius: 16px; padding: 24px; margin-bottom: 16px; }
.card h3 { font-size: 16px; font-weight: 700; margin-bottom: 16px; }
.label { font-size: 11px; font-weight: 700; color: #3182f6; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 6px; }
.section { margin-bottom: 20px; }
.section:last-child { margin-bottom: 0; }

/* Hook */
.hook-box {
  font-size: 18px; font-weight: 700; color: #191f28;
  padding: 16px; background: #fff; border-radius: 12px; border-left: 4px solid #3182f6;
}
.alt-hooks { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
.alt-hook { padding: 8px 12px; background: #fff; border-radius: 8px; font-size: 13px; color: #4e5968; border: 1px solid #e5e8eb; }

/* Script */
.script-block {
  background: #fff; border-radius: 12px; padding: 16px; margin-bottom: 10px;
}
.script-time {
  display: inline-block; background: #3182f6; color: #fff;
  font-size: 11px; font-weight: 700; padding: 3px 8px; border-radius: 6px; margin-bottom: 8px;
}
.script-direction { font-size: 12px; color: #8b95a1; margin-bottom: 6px; }
.script-line { font-size: 14px; line-height: 1.7; color: #191f28; }
.script-overlay { font-size: 12px; color: #3182f6; margin-top: 6px; font-weight: 600; }

/* Reference frames */
.ref-section { margin-top: 12px; }
.ref-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 10px; }
.ref-item { position: relative; border-radius: 10px; overflow: hidden; }
.ref-item img { width: 100%; aspect-ratio: 9/16; object-fit: cover; display: block; }
.ref-badge {
  position: absolute; bottom: 4px; left: 4px;
  background: rgba(0,0,0,0.7); color: #fff; font-size: 10px;
  padding: 2px 6px; border-radius: 4px;
}

/* Caption */
.caption-box { font-size: 13px; line-height: 1.7; color: #4e5968; background: #fff; border-radius: 10px; padding: 14px; white-space: pre-wrap; }

/* Checklist */
.checklist { list-style: none; }
.checklist li { padding: 6px 0; font-size: 13px; color: #4e5968; }
.checklist li::before { content: ''; display: inline-block; width: 16px; height: 16px; border: 2px solid #e5e8eb; border-radius: 4px; margin-right: 10px; vertical-align: middle; }
</style>
</head>
<body>

<div class="container">
  <h1>릴스 기획서 생성기</h1>
  <p class="subtitle">레퍼런스 영상 + 주제 = 새로운 촬영 기획서</p>

  <div class="upload-area" id="uploadArea">
    <div class="upload-icon">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/>
      </svg>
    </div>
    <div class="upload-text">레퍼런스 영상을 올려주세요</div>
    <div class="upload-hint">이 영상의 구조/스타일을 참고해서 새 기획서를 만듭니다</div>
    <div class="file-name" id="fileName"></div>
    <div class="video-preview" id="videoPreview"><video id="previewVideo" muted></video></div>
  </div>
  <input type="file" id="fileInput" accept="video/*" hidden>

  <div class="input-group">
    <label>오늘의 기획 주제</label>
    <input type="text" id="topicInput" placeholder="예: 일주일 -3kg 식단 루틴">
  </div>

  <button class="btn-generate" id="btnGenerate" disabled>기획서 생성</button>

  <div class="progress" id="progress">
    <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
    <div class="progress-text" id="progressText">분석중...</div>
  </div>

  <div class="result" id="result"></div>
</div>

<script>
const API_KEY = 'AIzaSyBjATr1K0AT5pfkp-wJK7HofGI8_SPH4qk';
let videoFile = null;
let framesLibrary = [];

// Load frame library
fetch('data/frames_library.json')
  .then(r => r.json())
  .then(data => { framesLibrary = data; })
  .catch(() => {});

// Elements
const uploadArea = document.getElementById('uploadArea');
const fileInput = document.getElementById('fileInput');
const fileName = document.getElementById('fileName');
const topicInput = document.getElementById('topicInput');
const btnGenerate = document.getElementById('btnGenerate');
const progress = document.getElementById('progress');
const progressFill = document.getElementById('progressFill');
const progressText = document.getElementById('progressText');
const result = document.getElementById('result');
const videoPreview = document.getElementById('videoPreview');
const previewVideo = document.getElementById('previewVideo');

// Upload
uploadArea.addEventListener('click', () => fileInput.click());
uploadArea.addEventListener('dragover', e => { e.preventDefault(); uploadArea.classList.add('dragover'); });
uploadArea.addEventListener('dragleave', () => uploadArea.classList.remove('dragover'));
uploadArea.addEventListener('drop', e => { e.preventDefault(); uploadArea.classList.remove('dragover'); if (e.dataTransfer.files[0]) handleFile(e.dataTransfer.files[0]); });
fileInput.addEventListener('change', e => { if (e.target.files[0]) handleFile(e.target.files[0]); });
topicInput.addEventListener('input', checkReady);

function handleFile(file) {
  if (!file.type.startsWith('video/')) return;
  videoFile = file;
  fileName.textContent = file.name;
  uploadArea.classList.add('has-file');
  previewVideo.src = URL.createObjectURL(file);
  videoPreview.style.display = 'block';
  checkReady();
}

function checkReady() { btnGenerate.disabled = !(videoFile && topicInput.value.trim()); }

// Frame extraction
async function extractFrames(file, count = 5) {
  return new Promise((resolve) => {
    const video = document.createElement('video');
    video.src = URL.createObjectURL(file);
    video.muted = true;
    video.addEventListener('loadedmetadata', () => {
      const dur = video.duration;
      const canvas = document.createElement('canvas');
      const ctx = canvas.getContext('2d');
      canvas.width = 360; canvas.height = 640;
      const frames = [], times = [];
      for (let i = 0; i < count; i++) times.push((dur / count) * i + 0.3);
      let idx = 0;
      video.addEventListener('seeked', () => {
        ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
        frames.push({ time: times[idx].toFixed(1), data: canvas.toDataURL('image/jpeg', 0.6).split(',')[1] });
        idx++;
        if (idx < times.length) video.currentTime = times[idx];
        else resolve(frames);
      });
      video.currentTime = times[0];
    });
  });
}

// Pick reference frames from library (random selection from top performers)
function pickReferenceFrames(count = 6) {
  if (!framesLibrary.length) return [];
  const shuffled = [...framesLibrary].sort(() => Math.random() - 0.5);
  return shuffled.slice(0, count);
}

// Generate
btnGenerate.addEventListener('click', async () => {
  const topic = topicInput.value.trim();
  if (!videoFile || !topic) return;

  btnGenerate.disabled = true;
  progress.classList.add('active');
  result.classList.remove('active');

  try {
    setProgress(15, '영상 프레임 추출중...');
    const frames = await extractFrames(videoFile, 5);

    setProgress(40, '대본 + 기획서 생성중...');
    const plan = await callGemini(topic, frames);

    setProgress(90, '참고 캡쳐 매칭중...');
    const refFrames = pickReferenceFrames(6);

    setProgress(100, '완료!');
    setTimeout(() => { progress.classList.remove('active'); renderResult(plan, refFrames); }, 400);
  } catch (err) {
    progress.classList.remove('active');
    alert('오류: ' + err.message);
  }
  btnGenerate.disabled = false;
});

function setProgress(pct, text) { progressFill.style.width = pct+'%'; progressText.textContent = text; }

async function callGemini(topic, frames) {
  const prompt = `당신은 인스타그램 다이어트/웰니스 릴스 콘텐츠 기획자입니다.

## 임무
레퍼런스 영상의 **구조와 스타일**만 참고하고, 아래 주제에 맞는 **완전히 새로운 대본과 기획서**를 만드세요.
레퍼런스를 그대로 따라하면 안 됩니다. 새로운 내용이어야 합니다.

## 주제: ${topic}

## 바이럴 공식 (142개 영상 분석 데이터)
- 첫 3초: 20-27자, 짧고 강렬
- BGM+텍스트가 나레이션보다 6.5배 높은 조회수
- 30-45초 최적
- 구조: 후킹(3초) -> 문제(5초) -> 해결(20초) -> CTA(5초)
- 터지는 패턴: 숫자+결과, 비포애프터, 충격반전

## 출력 형식 (JSON만 출력, 다른 텍스트 없이)
{
  "title": "기획서 제목",
  "hook_text": "첫 3초 후킹 (20-27자)",
  "hook_alternatives": ["대안1", "대안2", "대안3"],
  "total_duration": "35초",
  "script": [
    {
      "time": "0-3초",
      "direction": "카메라/촬영 지시 (어떤 앵글, 어떤 배경)",
      "line": "실제 대본 텍스트 (화면에 보이거나 말하는 내용)",
      "overlay": "화면 오버레이 텍스트 (있으면)"
    }
  ],
  "caption": "게시물 캡션 전문 (해시태그 포함, 3-5줄)",
  "checklist": ["촬영 준비물 1", "준비물 2", "준비물 3"]
}`;

  const parts = [{ text: prompt }];
  for (const f of frames) {
    parts.push({ text: `[레퍼런스 ${f.time}초]` });
    parts.push({ inline_data: { mime_type: 'image/jpeg', data: f.data } });
  }

  const resp = await fetch(
    `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${API_KEY}`,
    { method: 'POST', headers: {'Content-Type':'application/json'},
      body: JSON.stringify({ contents: [{parts}], generationConfig: {temperature: 0.5, maxOutputTokens: 4096} }) }
  );

  if (!resp.ok) { const e = await resp.json(); throw new Error(e.error?.message || 'API 실패'); }
  const data = await resp.json();
  let text = data.candidates?.[0]?.content?.parts?.[0]?.text || '';

  const m = text.match(/```(?:json)?\s*\n([\s\S]*?)\n```/);
  if (m) text = m[1];
  const s = text.indexOf('{'), e2 = text.lastIndexOf('}');
  if (s !== -1 && e2 !== -1) text = text.slice(s, e2+1);
  return JSON.parse(text);
}

function renderResult(plan, refFrames) {
  const scriptHtml = (plan.script || []).map(s => `
    <div class="script-block">
      <span class="script-time">${s.time}</span>
      <div class="script-direction">${s.direction || ''}</div>
      <div class="script-line">${s.line || ''}</div>
      ${s.overlay ? `<div class="script-overlay">${s.overlay}</div>` : ''}
    </div>
  `).join('');

  const refHtml = refFrames.length ? `
    <div class="card">
      <h3>참고 레퍼런스</h3>
      <p style="font-size:12px;color:#8b95a1;margin-bottom:12px;">
        우리 라이브러리에서 추천하는 참고 장면들 (다른 영상에서 가져옴)
      </p>
      <div class="ref-grid">
        ${refFrames.map(f => `
          <div class="ref-item">
            <img src="data:image/jpeg;base64,${f.b}">
            <span class="ref-badge">@${f.a} ${(f.v/10000).toFixed(0)}만</span>
          </div>
        `).join('')}
      </div>
    </div>` : '';

  result.innerHTML = `
    <div class="card">
      <h3>${plan.title || '기획서'}</h3>
      <div class="section">
        <div class="label">첫 3초 후킹</div>
        <div class="hook-box">${plan.hook_text || ''}</div>
        ${plan.hook_alternatives ? `<div class="alt-hooks">${plan.hook_alternatives.map(h=>`<span class="alt-hook">${h}</span>`).join('')}</div>` : ''}
      </div>
    </div>

    <div class="card">
      <h3>대본 (${plan.total_duration || '35초'})</h3>
      ${scriptHtml}
    </div>

    ${refHtml}

    <div class="card">
      <h3>캡션</h3>
      <div class="caption-box">${plan.caption || ''}</div>
    </div>

    ${plan.checklist ? `
    <div class="card">
      <h3>촬영 준비물</h3>
      <ul class="checklist">${plan.checklist.map(c=>`<li>${c}</li>`).join('')}</ul>
    </div>` : ''}
  `;
  result.classList.add('active');
  result.scrollIntoView({ behavior: 'smooth', block: 'start' });
}
</script>
</body>
</html>
