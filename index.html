<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MCN Neobridge — 대시보드</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #0f0f0f; color: #fff; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; }
  h1 { font-size: 2rem; margin-bottom: 0.5rem; }
  p { color: #888; margin-bottom: 2rem; }
  .cards { display: flex; gap: 1.5rem; flex-wrap: wrap; justify-content: center; }
  a.card { text-decoration: none; color: #fff; background: #1a1a1a; border: 1px solid #333; border-radius: 12px; padding: 2rem 2.5rem; transition: all 0.2s; min-width: 240px; text-align: center; }
  a.card:hover { border-color: #666; transform: translateY(-2px); }
  .card h2 { font-size: 1.3rem; margin-bottom: 0.5rem; }
  .card .stats { color: #888; font-size: 0.9rem; }
  .card .emoji { font-size: 2.5rem; margin-bottom: 0.8rem; }
</style>
</head>
<body>
  <h1>MCN Neobridge</h1>
  <p>채널 분석 대시보드</p>
  <div class="cards">
    <a class="card" href="sajjiknam/">
      <div class="emoji">📊</div>
      <h2>사찍남</h2>
      <div class="stats">리텐션 · CTR · 히트맵 분석</div>
    </a>
    <a class="card" href="gyeoljeongsa/">
      <div class="emoji">💍</div>
      <h2>결정사</h2>
      <div class="stats">경쟁채널 · 벤치마크 분석</div>
    </a>
  </div>
</body>
</html>
