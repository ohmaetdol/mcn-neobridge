<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OCMD 업무 대시보드</title>
<style>
  :root {
    --bg: #0d1117;
    --card: #161b22;
    --border: #21262d;
    --text: #e6edf3;
    --text2: #8b949e;
    --text3: #484f58;
    --accent: #58a6ff;
    --green: #3fb950;
    --orange: #d29922;
    --red: #f85149;
    --purple: #bc8cff;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, 'Apple SD Gothic Neo', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
  }

  /* Header */
  .header {
    background: linear-gradient(135deg, #161b22 0%, #1a2332 100%);
    border-bottom: 1px solid var(--border);
    padding: 20px 24px 16px;
    position: sticky;
    top: 0;
    z-index: 100;
    backdrop-filter: blur(12px);
  }
  .header-top {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 16px;
  }
  .header h1 {
    font-size: 20px;
    font-weight: 700;
    background: linear-gradient(135deg, #58a6ff, #bc8cff);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  .header-date {
    font-size: 12px;
    color: var(--text2);
  }

  /* Stats Cards */
  .stats-row {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 10px;
  }
  .stat-card {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 10px 12px;
    text-align: center;
  }
  .stat-num {
    font-size: 22px;
    font-weight: 700;
  }
  .stat-num.c-green { color: var(--green); }
  .stat-num.c-orange { color: var(--orange); }
  .stat-num.c-gray { color: var(--text3); }
  .stat-num.c-accent { color: var(--accent); }
  .stat-label {
    font-size: 11px;
    color: var(--text2);
    margin-top: 2px;
  }

  /* Progress Bar */
  .progress-wrap {
    margin-top: 14px;
    background: var(--bg);
    border-radius: 6px;
    height: 8px;
    overflow: hidden;
    display: flex;
  }
  .progress-done {
    background: var(--green);
    height: 100%;
    transition: width 0.5s ease;
  }
  .progress-ing {
    background: var(--orange);
    height: 100%;
    transition: width 0.5s ease;
  }
  .progress-text {
    text-align: right;
    font-size: 11px;
    color: var(--text2);
    margin-top: 4px;
  }

  /* Filters */
  .filters {
    display: flex;
    gap: 6px;
    padding: 12px 24px;
    overflow-x: auto;
    background: var(--bg);
    border-bottom: 1px solid var(--border);
    -ms-overflow-style: none;
    scrollbar-width: none;
  }
  .filters::-webkit-scrollbar { display: none; }
  .filter-btn {
    padding: 6px 14px;
    border: 1px solid var(--border);
    border-radius: 20px;
    background: transparent;
    color: var(--text2);
    font-size: 13px;
    cursor: pointer;
    white-space: nowrap;
    font-family: inherit;
    transition: all 0.2s;
  }
  .filter-btn:hover { border-color: var(--accent); color: var(--text); }
  .filter-btn.active {
    background: var(--accent);
    color: #fff;
    border-color: var(--accent);
  }
  .filter-sep {
    width: 1px;
    background: var(--border);
    margin: 4px 2px;
    flex-shrink: 0;
  }

  /* Container */
  .container { max-width: 860px; margin: 0 auto; padding: 16px; }

  /* Phase */
  .phase { margin-bottom: 20px; }
  .phase-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 12px 16px;
    border-radius: 12px 12px 0 0;
    font-size: 14px;
    font-weight: 600;
  }
  .phase-header.p0 { background: linear-gradient(135deg, #21262d, #282e36); }
  .phase-header.p1 { background: linear-gradient(135deg, #0d2444, #132d56); }
  .phase-header.p2 { background: linear-gradient(135deg, #3b1d06, #4d2a0a); }
  .phase-header.p3 { background: linear-gradient(135deg, #3b0620, #4d0a2a); }
  .phase-header.pd { background: linear-gradient(135deg, #1a1a2e, #232345); }
  .phase-progress {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 12px;
    font-weight: 400;
    color: var(--text2);
  }
  .phase-bar {
    width: 60px;
    height: 4px;
    background: rgba(255,255,255,0.1);
    border-radius: 2px;
    overflow: hidden;
  }
  .phase-bar-fill {
    height: 100%;
    background: var(--green);
    border-radius: 2px;
    transition: width 0.5s ease;
  }

  /* Task List */
  .task-list {
    background: var(--card);
    border: 1px solid var(--border);
    border-top: none;
    border-radius: 0 0 12px 12px;
    overflow: hidden;
  }
  .task-item {
    display: flex;
    align-items: flex-start;
    padding: 12px 16px;
    border-bottom: 1px solid var(--border);
    gap: 12px;
    transition: background 0.15s;
    cursor: default;
  }
  .task-item:last-child { border-bottom: none; }
  .task-item:hover { background: rgba(88,166,255,0.04); }

  /* Status Button */
  .task-status {
    flex-shrink: 0;
    width: 24px;
    height: 24px;
    border-radius: 50%;
    border: 2px solid var(--text3);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 13px;
    transition: all 0.2s;
    margin-top: 1px;
    background: transparent;
  }
  .task-status:hover { transform: scale(1.2); border-color: var(--accent); }
  .task-status[data-status="완료"] {
    background: var(--green);
    border-color: var(--green);
    color: #fff;
  }
  .task-status[data-status="진행중"] {
    border-color: var(--orange);
    color: var(--orange);
    animation: pulse 2s infinite;
  }
  @keyframes pulse {
    0%, 100% { box-shadow: 0 0 0 0 rgba(210,153,34,0.3); }
    50% { box-shadow: 0 0 0 4px rgba(210,153,34,0); }
  }
  .task-status[data-status="대기"] { color: transparent; }

  /* Task Content */
  .task-content { flex: 1; min-width: 0; }
  .task-title {
    font-size: 13.5px;
    font-weight: 500;
    line-height: 1.4;
    word-break: keep-all;
  }
  .task-title.done {
    text-decoration: line-through;
    color: var(--text3);
  }
  .task-meta {
    display: flex;
    gap: 6px;
    margin-top: 5px;
    flex-wrap: wrap;
    align-items: center;
  }
  .tag {
    padding: 2px 8px;
    border-radius: 12px;
    font-size: 11px;
    font-weight: 500;
  }
  .tag-date {
    background: rgba(88,166,255,0.1);
    color: var(--accent);
  }
  .tag-owner {
    background: rgba(188,140,255,0.12);
    color: var(--purple);
  }
  .tag-output {
    background: rgba(255,255,255,0.06);
    color: var(--text2);
  }
  .tag-today {
    background: rgba(63,185,80,0.15);
    color: var(--green);
    font-weight: 600;
  }
  .task-note {
    font-size: 11px;
    color: var(--orange);
    margin-top: 3px;
    opacity: 0.8;
  }

  /* Status Menu */
  .status-menu {
    position: fixed;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    box-shadow: 0 8px 32px rgba(0,0,0,0.4);
    z-index: 300;
    overflow: hidden;
    min-width: 130px;
  }
  .status-menu-item {
    padding: 10px 14px;
    font-size: 13px;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 8px;
    border-bottom: 1px solid var(--border);
    color: var(--text);
    font-family: inherit;
    transition: background 0.1s;
  }
  .status-menu-item:last-child { border-bottom: none; }
  .status-menu-item:hover { background: rgba(88,166,255,0.08); }
  .smi-dot { width: 10px; height: 10px; border-radius: 50%; }
  .backdrop { position: fixed; inset: 0; z-index: 250; }

  /* Toast */
  .toast {
    position: fixed;
    bottom: 80px;
    left: 50%;
    transform: translateX(-50%) translateY(20px);
    background: var(--card);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 10px 20px;
    border-radius: 10px;
    font-size: 13px;
    opacity: 0;
    transition: all 0.3s;
    z-index: 200;
    pointer-events: none;
    box-shadow: 0 4px 16px rgba(0,0,0,0.3);
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  /* Refresh Button */
  .refresh-btn {
    position: fixed;
    bottom: 24px;
    right: 24px;
    width: 48px;
    height: 48px;
    border-radius: 50%;
    background: linear-gradient(135deg, #58a6ff, #bc8cff);
    color: #fff;
    border: none;
    font-size: 20px;
    cursor: pointer;
    box-shadow: 0 4px 16px rgba(88,166,255,0.3);
    z-index: 100;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: transform 0.3s;
  }
  .refresh-btn:hover { transform: scale(1.1); }
  .refresh-btn:active { transform: scale(0.95); }
  .refresh-btn.spinning { animation: spin 0.7s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* Loading */
  .loading {
    text-align: center;
    padding: 80px 20px;
    color: var(--text2);
    font-size: 14px;
  }
  .loading .spinner {
    width: 36px; height: 36px;
    border: 3px solid var(--border);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    margin: 0 auto 16px;
  }

  /* Empty */
  .empty {
    text-align: center;
    padding: 60px 20px;
    color: var(--text3);
    font-size: 14px;
  }

  /* Mobile */
  @media (max-width: 600px) {
    .header { padding: 16px; }
    .stats-row { grid-template-columns: repeat(4, 1fr); gap: 6px; }
    .stat-card { padding: 8px 6px; }
    .stat-num { font-size: 18px; }
    .container { padding: 10px; }
    .task-item { padding: 10px 12px; }
    .filters { padding: 10px 16px; }
  }
</style>
</head>
<body>

<div class="header">
  <div class="header-top">
    <h1>OCMD x Flowmus</h1>
    <span class="header-date" id="headerDate"></span>
  </div>
  <div class="stats-row" id="stats"></div>
  <div class="progress-wrap" id="progressBar"></div>
  <div class="progress-text" id="progressText"></div>
</div>

<div class="filters" id="filters"></div>

<div class="container" id="container">
  <div class="loading">
    <div class="spinner"></div>
    데이터 불러오는 중...
  </div>
</div>

<div class="toast" id="toast"></div>
<button class="refresh-btn" onclick="loadData()" title="새로고침">&#x21bb;</button>

<script>
const API_URL = 'https://script.google.com/macros/s/AKfycbx3K-jxudeBYthtZXEPCiBBjc24x273RZ21Oj6RmuvA8WXbF1jr-Idu0v_mLcMRe1ktVg/exec';

let allTasks = [];
let currentFilter = 'all';
let currentOwnerFilter = 'all';

// Set header date
const today = new Date();
const dateStr = today.toLocaleDateString('ko-KR', { year: 'numeric', month: 'long', day: 'numeric', weekday: 'short' });
document.getElementById('headerDate').textContent = dateStr;

async function loadData() {
  const btn = document.querySelector('.refresh-btn');
  btn.classList.add('spinning');
  try {
    const resp = await fetch(API_URL + '?action=list');
    const data = await resp.json();
    allTasks = data.tasks.filter(t => t.task && !t.task.startsWith('\u25b6'));
    renderAll();
  } catch (err) {
    document.getElementById('container').innerHTML =
      '<div class="loading" style="color:var(--red)">불러오기 실패. 새로고침 버튼을 눌러주세요.</div>';
  }
  btn.classList.remove('spinning');
}

function renderAll() {
  renderStats();
  renderFilters();
  renderTasks();
}

function renderStats() {
  const done = allTasks.filter(t => t.status === '완료').length;
  const ing = allTasks.filter(t => t.status === '진행중').length;
  const wait = allTasks.filter(t => !t.status || t.status === '대기').length;
  const total = allTasks.length;
  const pct = total ? Math.round(done / total * 100) : 0;
  const ingPct = total ? Math.round(ing / total * 100) : 0;

  document.getElementById('stats').innerHTML = `
    <div class="stat-card"><div class="stat-num c-accent">${total}</div><div class="stat-label">전체</div></div>
    <div class="stat-card"><div class="stat-num c-green">${done}</div><div class="stat-label">완료</div></div>
    <div class="stat-card"><div class="stat-num c-orange">${ing}</div><div class="stat-label">진행중</div></div>
    <div class="stat-card"><div class="stat-num c-gray">${wait}</div><div class="stat-label">대기</div></div>
  `;
  document.getElementById('progressBar').innerHTML =
    `<div class="progress-done" style="width:${pct}%"></div><div class="progress-ing" style="width:${ingPct}%"></div>`;
  document.getElementById('progressText').textContent = `${pct}% 완료`;
}

function renderFilters() {
  const owners = [...new Set(allTasks.map(t => t.owner).filter(Boolean))];
  let html = '';
  [['all','전체'],['대기','대기'],['진행중','진행중'],['완료','완료']].forEach(([v,l]) => {
    html += `<button class="filter-btn ${currentFilter===v?'active':''}" onclick="setFilter('${v}')">${l}</button>`;
  });
  html += '<div class="filter-sep"></div>';
  owners.forEach(o => {
    html += `<button class="filter-btn ${currentOwnerFilter===o?'active':''}" onclick="setOwnerFilter('${o}')">${o}</button>`;
  });
  document.getElementById('filters').innerHTML = html;
}

function setFilter(f) { currentFilter = f; renderFilters(); renderTasks(); }
function setOwnerFilter(o) { currentOwnerFilter = currentOwnerFilter === o ? 'all' : o; renderFilters(); renderTasks(); }

function renderTasks() {
  let filtered = allTasks;
  if (currentFilter !== 'all') filtered = filtered.filter(t => (t.status || '대기') === currentFilter);
  if (currentOwnerFilter !== 'all') filtered = filtered.filter(t => t.owner === currentOwnerFilter);

  const phases = [];
  let currentPhase = null;
  filtered.forEach(t => {
    let phase = 'etc';
    const w = t.week;
    if (w.startsWith('P0')) phase = 'p0';
    else if (w.startsWith('P1')) phase = 'p1';
    else if (w.startsWith('P2')) phase = 'p2';
    else if (w.startsWith('P3')) phase = 'p3';
    else if (w === 'D-Day' || w === 'Post') phase = 'pd';
    if (phase !== currentPhase) {
      currentPhase = phase;
      phases.push({ id: phase, tasks: [] });
    }
    phases[phases.length - 1].tasks.push(t);
  });

  if (!phases.length) {
    document.getElementById('container').innerHTML = '<div class="empty">해당하는 업무가 없습니다.</div>';
    return;
  }

  const labels = {
    p0: 'Phase 0 — 준비 (계약 + 세팅)',
    p1: 'Phase 1 — 재수강 클로즈드 (광고 OFF)',
    p2: 'Phase 2 — 신규 + 얼리버드 (광고 ON)',
    p3: 'Phase 3 — 정가 라스트콜',
    pd: 'D-Day & 이후',
  };

  let html = '';
  phases.forEach(p => {
    const done = p.tasks.filter(t => t.status === '완료').length;
    const pct = p.tasks.length ? Math.round(done / p.tasks.length * 100) : 0;

    html += `<div class="phase">
      <div class="phase-header ${p.id}">
        <span>${labels[p.id] || p.id}</span>
        <div class="phase-progress">
          <div class="phase-bar"><div class="phase-bar-fill" style="width:${pct}%"></div></div>
          <span>${done}/${p.tasks.length}</span>
        </div>
      </div>
      <div class="task-list">`;

    p.tasks.forEach(t => {
      const st = t.status || '대기';
      const isDone = st === '완료';
      const icon = st === '완료' ? '&#x2713;' : st === '진행중' ? '&#9679;' : '';
      const isToday = t.date && isDateToday(t.date);

      html += `<div class="task-item">
        <div class="task-status" data-status="${st}" data-row="${t.row}" onclick="showStatusMenu(event,${t.row})">${icon}</div>
        <div class="task-content">
          <div class="task-title ${isDone?'done':''}">${t.task}</div>
          <div class="task-meta">
            <span class="tag ${isToday ? 'tag-today' : 'tag-date'}">${isToday ? 'TODAY ' : ''}${t.date}</span>
            <span class="tag tag-owner">${t.owner}</span>
            ${t.output ? `<span class="tag tag-output">${t.output}</span>` : ''}
          </div>
          ${t.note ? `<div class="task-note">${t.note}</div>` : ''}
        </div>
      </div>`;
    });

    html += '</div></div>';
  });

  document.getElementById('container').innerHTML = html;
}

function isDateToday(dateStr) {
  const m = dateStr.match(/(\d+)\/(\d+)/);
  if (!m) return false;
  const now = new Date();
  return parseInt(m[1]) === now.getMonth() + 1 && parseInt(m[2]) === now.getDate();
}

function showStatusMenu(event, row) {
  event.stopPropagation();
  closeMenu();
  const rect = event.target.getBoundingClientRect();
  const menu = document.createElement('div');
  menu.className = 'status-menu';
  menu.style.left = Math.min(rect.left, window.innerWidth - 150) + 'px';
  menu.style.top = (rect.bottom + 6) + 'px';

  [
    { label: '대기', color: 'var(--text3)' },
    { label: '진행중', color: 'var(--orange)' },
    { label: '완료', color: 'var(--green)' },
  ].forEach(s => {
    const item = document.createElement('div');
    item.className = 'status-menu-item';
    item.innerHTML = `<span class="smi-dot" style="background:${s.color}"></span>${s.label}`;
    item.onclick = () => updateStatus(row, s.label);
    menu.appendChild(item);
  });

  const backdrop = document.createElement('div');
  backdrop.className = 'backdrop';
  backdrop.onclick = closeMenu;
  document.body.appendChild(backdrop);
  document.body.appendChild(menu);

  if (menu.getBoundingClientRect().bottom > window.innerHeight) {
    menu.style.top = (rect.top - menu.offsetHeight - 6) + 'px';
  }
}

function closeMenu() {
  document.querySelectorAll('.status-menu, .backdrop').forEach(el => el.remove());
}

async function updateStatus(row, status) {
  closeMenu();
  const task = allTasks.find(t => t.row === row);
  if (task) task.status = status;
  renderAll();
  showToast(`${status === '완료' ? '&#x2705;' : status === '진행중' ? '&#x1f525;' : '&#x23f8;'} ${status}`);
  try {
    await fetch(API_URL + `?action=update&row=${row}&status=${encodeURIComponent(status)}`);
  } catch { showToast('저장 실패'); }
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.innerHTML = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2000);
}

loadData();
</script>
</body>
</html>
