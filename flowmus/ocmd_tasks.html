<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OCMD 업무 대시보드</title>
<style>
  :root {
    --bg: #f2f2f7;
    --card: #ffffff;
    --border: #e5e5ea;
    --text: #1c1c1e;
    --text2: #8e8e93;
    --text3: #c7c7cc;
    --accent: #007aff;
    --green: #34c759;
    --orange: #ff9500;
    --red: #ff3b30;
    --purple: #af52de;
    --shadow: 0 1px 3px rgba(0,0,0,0.04), 0 4px 12px rgba(0,0,0,0.03);
    --shadow-lg: 0 4px 24px rgba(0,0,0,0.08);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, 'Apple SD Gothic Neo', 'Pretendard', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
  }

  /* ── Header ── */
  .header {
    background: var(--card);
    border-bottom: 1px solid var(--border);
    padding: 20px 24px 18px;
    position: sticky;
    top: 0;
    z-index: 100;
  }
  .header-top {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 18px;
  }
  .header-title {
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .header-logo {
    width: 32px;
    height: 32px;
    border-radius: 8px;
    background: linear-gradient(135deg, var(--accent), var(--purple));
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 16px;
    color: #fff;
    font-weight: 700;
  }
  .header h1 {
    font-size: 18px;
    font-weight: 700;
    color: var(--text);
    letter-spacing: -0.3px;
  }
  .header-sub {
    font-size: 11px;
    color: var(--text2);
    font-weight: 400;
    margin-top: 1px;
  }
  .header-date {
    font-size: 12px;
    color: var(--text2);
    background: var(--bg);
    padding: 4px 10px;
    border-radius: 8px;
  }

  /* ── Stats ── */
  .stats-row {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 8px;
  }
  .stat-card {
    background: var(--bg);
    border-radius: 12px;
    padding: 12px;
    text-align: center;
    position: relative;
    overflow: hidden;
  }
  .stat-card::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 3px;
    border-radius: 12px 12px 0 0;
  }
  .stat-card:nth-child(1)::before { background: var(--accent); }
  .stat-card:nth-child(2)::before { background: var(--green); }
  .stat-card:nth-child(3)::before { background: var(--orange); }
  .stat-card:nth-child(4)::before { background: var(--text3); }
  .stat-num {
    font-size: 24px;
    font-weight: 800;
    letter-spacing: -1px;
  }
  .stat-num.c-green { color: var(--green); }
  .stat-num.c-orange { color: var(--orange); }
  .stat-num.c-gray { color: var(--text3); }
  .stat-num.c-accent { color: var(--accent); }
  .stat-label {
    font-size: 11px;
    color: var(--text2);
    margin-top: 2px;
    font-weight: 500;
  }

  /* ── Progress ── */
  .progress-section {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-top: 14px;
  }
  .progress-wrap {
    flex: 1;
    background: var(--bg);
    border-radius: 6px;
    height: 6px;
    overflow: hidden;
    display: flex;
  }
  .progress-done {
    background: linear-gradient(90deg, #34c759, #30d158);
    height: 100%;
    transition: width 0.6s cubic-bezier(0.4, 0, 0.2, 1);
  }
  .progress-ing {
    background: var(--orange);
    height: 100%;
    transition: width 0.6s cubic-bezier(0.4, 0, 0.2, 1);
  }
  .progress-text {
    font-size: 13px;
    font-weight: 700;
    color: var(--green);
    white-space: nowrap;
  }

  /* ── Filters ── */
  .filters {
    display: flex;
    gap: 6px;
    padding: 10px 24px;
    overflow-x: auto;
    background: var(--card);
    border-bottom: 1px solid var(--border);
    -ms-overflow-style: none;
    scrollbar-width: none;
  }
  .filters::-webkit-scrollbar { display: none; }
  .filter-btn {
    padding: 6px 14px;
    border: 1.5px solid var(--border);
    border-radius: 20px;
    background: var(--card);
    color: var(--text2);
    font-size: 12.5px;
    font-weight: 500;
    cursor: pointer;
    white-space: nowrap;
    font-family: inherit;
    transition: all 0.2s;
  }
  .filter-btn:hover { border-color: var(--accent); color: var(--accent); }
  .filter-btn.active {
    background: var(--text);
    color: #fff;
    border-color: var(--text);
  }
  .filter-sep {
    width: 1px;
    background: var(--border);
    margin: 4px 4px;
    flex-shrink: 0;
  }

  /* ── Container ── */
  .container { max-width: 860px; margin: 0 auto; padding: 16px; }

  /* ── Phase ── */
  .phase { margin-bottom: 16px; }
  .phase-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 11px 16px;
    border-radius: 14px 14px 0 0;
    font-size: 13px;
    font-weight: 600;
    color: #fff;
    letter-spacing: -0.2px;
  }
  .phase-header.p0 { background: #8e8e93; }
  .phase-header.p1 { background: linear-gradient(135deg, #007aff, #5ac8fa); }
  .phase-header.p2 { background: linear-gradient(135deg, #ff9500, #ffcc00); }
  .phase-header.p3 { background: linear-gradient(135deg, #ff3b30, #ff6482); }
  .phase-header.pd { background: linear-gradient(135deg, #1c1c1e, #3a3a3c); }
  .phase-progress {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 12px;
    font-weight: 500;
    color: rgba(255,255,255,0.85);
  }
  .phase-bar {
    width: 50px;
    height: 4px;
    background: rgba(255,255,255,0.25);
    border-radius: 2px;
    overflow: hidden;
  }
  .phase-bar-fill {
    height: 100%;
    background: #fff;
    border-radius: 2px;
    transition: width 0.5s ease;
  }

  /* ── Task List ── */
  .task-list {
    background: var(--card);
    border-radius: 0 0 14px 14px;
    overflow: hidden;
    box-shadow: var(--shadow);
  }
  .task-item {
    display: flex;
    align-items: flex-start;
    padding: 14px 16px;
    gap: 12px;
    transition: background 0.15s;
    cursor: default;
    border-bottom: 1px solid #f2f2f7;
  }
  .task-item:last-child { border-bottom: none; }
  .task-item:hover { background: #fafafc; }

  /* ── Status Button ── */
  .task-status {
    flex-shrink: 0;
    width: 22px;
    height: 22px;
    border-radius: 50%;
    border: 2px solid var(--text3);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 12px;
    transition: all 0.2s;
    margin-top: 2px;
    background: transparent;
  }
  .task-status:hover { transform: scale(1.2); border-color: var(--accent); }
  .task-status[data-status="완료"] {
    background: var(--green);
    border-color: var(--green);
    color: #fff;
  }
  .task-status[data-status="진행중"] {
    border-color: var(--orange);
    color: var(--orange);
    animation: pulse 2s infinite;
  }
  @keyframes pulse {
    0%, 100% { box-shadow: 0 0 0 0 rgba(255,149,0,0.25); }
    50% { box-shadow: 0 0 0 5px rgba(255,149,0,0); }
  }
  .task-status[data-status="대기"] { color: transparent; }

  /* ── Task Content ── */
  .task-content { flex: 1; min-width: 0; }
  .task-title {
    font-size: 13.5px;
    font-weight: 500;
    line-height: 1.45;
    word-break: keep-all;
    color: var(--text);
  }
  .task-title.done {
    text-decoration: line-through;
    color: var(--text3);
    font-weight: 400;
  }
  .task-meta {
    display: flex;
    gap: 5px;
    margin-top: 6px;
    flex-wrap: wrap;
    align-items: center;
  }
  .tag {
    padding: 2px 9px;
    border-radius: 6px;
    font-size: 11px;
    font-weight: 500;
    letter-spacing: -0.1px;
  }
  .tag-date {
    background: #eef4ff;
    color: #3478f6;
  }
  .tag-owner {
    background: #f5eefa;
    color: #8944ab;
  }
  .tag-output {
    background: #f2f2f7;
    color: var(--text2);
  }
  .tag-today {
    background: #e5fae9;
    color: #1b8a2e;
    font-weight: 700;
  }
  .task-note {
    font-size: 11px;
    color: var(--orange);
    margin-top: 4px;
  }

  /* ── Status Menu ── */
  .status-menu {
    position: fixed;
    background: var(--card);
    border-radius: 14px;
    box-shadow: var(--shadow-lg);
    z-index: 300;
    overflow: hidden;
    min-width: 130px;
    border: 1px solid var(--border);
  }
  .status-menu-item {
    padding: 11px 16px;
    font-size: 13.5px;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 10px;
    color: var(--text);
    font-family: inherit;
    font-weight: 500;
    transition: background 0.1s;
  }
  .status-menu-item:not(:last-child) { border-bottom: 1px solid #f2f2f7; }
  .status-menu-item:hover { background: var(--bg); }
  .smi-dot { width: 10px; height: 10px; border-radius: 50%; }
  .backdrop { position: fixed; inset: 0; z-index: 250; }

  /* ── Toast ── */
  .toast {
    position: fixed;
    bottom: 88px;
    left: 50%;
    transform: translateX(-50%) translateY(16px);
    background: var(--text);
    color: #fff;
    padding: 10px 20px;
    border-radius: 12px;
    font-size: 13px;
    font-weight: 500;
    opacity: 0;
    transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    z-index: 200;
    pointer-events: none;
    box-shadow: var(--shadow-lg);
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  /* ── Refresh ── */
  .refresh-btn {
    position: fixed;
    bottom: 28px;
    right: 24px;
    width: 50px;
    height: 50px;
    border-radius: 50%;
    background: var(--text);
    color: #fff;
    border: none;
    font-size: 22px;
    cursor: pointer;
    box-shadow: 0 4px 16px rgba(0,0,0,0.15);
    z-index: 100;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.2s;
  }
  .refresh-btn:hover { transform: scale(1.08); box-shadow: 0 6px 20px rgba(0,0,0,0.2); }
  .refresh-btn:active { transform: scale(0.95); }
  .refresh-btn.spinning { animation: spin 0.7s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ── Loading ── */
  .loading {
    text-align: center;
    padding: 80px 20px;
    color: var(--text2);
    font-size: 14px;
  }
  .loading .spinner {
    width: 32px; height: 32px;
    border: 3px solid var(--border);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    margin: 0 auto 14px;
  }
  .empty {
    text-align: center;
    padding: 60px 20px;
    color: var(--text3);
    font-size: 14px;
  }

  /* ── Mobile ── */
  @media (max-width: 600px) {
    .header { padding: 14px 16px 14px; }
    .header h1 { font-size: 16px; }
    .header-logo { width: 28px; height: 28px; font-size: 14px; }
    .stats-row { gap: 6px; }
    .stat-card { padding: 10px 6px; border-radius: 10px; }
    .stat-num { font-size: 20px; }
    .container { padding: 10px; }
    .task-item { padding: 12px 14px; }
    .filters { padding: 8px 16px; }
    .phase-header { font-size: 12.5px; padding: 10px 14px; }
  }
</style>
</head>
<body>

<div class="header">
  <div class="header-top">
    <div class="header-title">
      <div class="header-logo">F</div>
      <div>
        <h1>OCMD x Flowmus</h1>
        <div class="header-sub">6.13 강연 프로젝트 대시보드</div>
      </div>
    </div>
    <span class="header-date" id="headerDate"></span>
  </div>
  <div class="stats-row" id="stats"></div>
  <div class="progress-section">
    <div class="progress-wrap" id="progressBar"></div>
    <div class="progress-text" id="progressText"></div>
  </div>
</div>

<div class="filters" id="filters"></div>

<div class="container" id="container">
  <div class="loading">
    <div class="spinner"></div>
    데이터 불러오는 중...
  </div>
</div>

<div class="toast" id="toast"></div>
<button class="refresh-btn" onclick="loadData()" title="새로고침">&#x21bb;</button>

<script>
const API_URL = 'https://script.google.com/macros/s/AKfycbx3K-jxudeBYthtZXEPCiBBjc24x273RZ21Oj6RmuvA8WXbF1jr-Idu0v_mLcMRe1ktVg/exec';

let allTasks = [];
let currentFilter = 'all';
let currentOwnerFilter = 'all';

const today = new Date();
const dateStr = today.toLocaleDateString('ko-KR', { year: 'numeric', month: 'long', day: 'numeric', weekday: 'short' });
document.getElementById('headerDate').textContent = dateStr;

const TITLE_MAP = { '오맷돌': '오맷돌 대표', '권현우': '권현우 대표' };
function withTitle(name) { return TITLE_MAP[name] || name; }

async function loadData() {
  const btn = document.querySelector('.refresh-btn');
  btn.classList.add('spinning');
  try {
    const resp = await fetch(API_URL + '?action=list');
    const data = await resp.json();
    allTasks = data.tasks.filter(t => t.task && !t.task.startsWith('\u25b6'));
    renderAll();
  } catch (err) {
    document.getElementById('container').innerHTML =
      '<div class="loading" style="color:var(--red)">불러오기 실패. 새로고침 버튼을 눌러주세요.</div>';
  }
  btn.classList.remove('spinning');
}

function renderAll() { renderStats(); renderFilters(); renderTasks(); }

function renderStats() {
  const done = allTasks.filter(t => t.status === '완료').length;
  const ing = allTasks.filter(t => t.status === '진행중').length;
  const wait = allTasks.filter(t => !t.status || t.status === '대기').length;
  const total = allTasks.length;
  const pct = total ? Math.round(done / total * 100) : 0;
  const ingPct = total ? Math.round(ing / total * 100) : 0;

  document.getElementById('stats').innerHTML = `
    <div class="stat-card"><div class="stat-num c-accent">${total}</div><div class="stat-label">전체</div></div>
    <div class="stat-card"><div class="stat-num c-green">${done}</div><div class="stat-label">완료</div></div>
    <div class="stat-card"><div class="stat-num c-orange">${ing}</div><div class="stat-label">진행중</div></div>
    <div class="stat-card"><div class="stat-num c-gray">${wait}</div><div class="stat-label">대기</div></div>
  `;
  document.getElementById('progressBar').innerHTML =
    `<div class="progress-done" style="width:${pct}%"></div><div class="progress-ing" style="width:${ingPct}%"></div>`;
  document.getElementById('progressText').textContent = `${pct}%`;
}

function renderFilters() {
  const owners = [...new Set(allTasks.map(t => t.owner).filter(Boolean))];
  let html = '';
  [['all','전체'],['대기','대기'],['진행중','진행중'],['완료','완료']].forEach(([v,l]) => {
    html += `<button class="filter-btn ${currentFilter===v?'active':''}" onclick="setFilter('${v}')">${l}</button>`;
  });
  html += '<div class="filter-sep"></div>';
  owners.forEach(o => {
    html += `<button class="filter-btn ${currentOwnerFilter===o?'active':''}" onclick="setOwnerFilter('${o}')">${withTitle(o)}</button>`;
  });
  document.getElementById('filters').innerHTML = html;
}

function setFilter(f) { currentFilter = f; renderFilters(); renderTasks(); }
function setOwnerFilter(o) { currentOwnerFilter = currentOwnerFilter === o ? 'all' : o; renderFilters(); renderTasks(); }

function renderTasks() {
  let filtered = allTasks;
  if (currentFilter !== 'all') filtered = filtered.filter(t => (t.status || '대기') === currentFilter);
  if (currentOwnerFilter !== 'all') filtered = filtered.filter(t => t.owner === currentOwnerFilter);

  const phases = [];
  let currentPhase = null;
  filtered.forEach(t => {
    let phase = 'etc';
    const w = t.week;
    if (w.startsWith('P0')) phase = 'p0';
    else if (w.startsWith('P1')) phase = 'p1';
    else if (w.startsWith('P2')) phase = 'p2';
    else if (w.startsWith('P3')) phase = 'p3';
    else if (w === 'D-Day' || w === 'Post') phase = 'pd';
    if (phase !== currentPhase) { currentPhase = phase; phases.push({ id: phase, tasks: [] }); }
    phases[phases.length - 1].tasks.push(t);
  });

  if (!phases.length) {
    document.getElementById('container').innerHTML = '<div class="empty">해당하는 업무가 없습니다.</div>';
    return;
  }

  const labels = {
    p0: 'Phase 0 — 준비 (계약 + 세팅)',
    p1: 'Phase 1 — 재수강 클로즈드',
    p2: 'Phase 2 — 신규 + 얼리버드',
    p3: 'Phase 3 — 라스트콜',
    pd: 'D-Day & 이후',
  };

  let html = '';
  phases.forEach(p => {
    const done = p.tasks.filter(t => t.status === '완료').length;
    const pct = p.tasks.length ? Math.round(done / p.tasks.length * 100) : 0;

    html += `<div class="phase">
      <div class="phase-header ${p.id}">
        <span>${labels[p.id] || p.id}</span>
        <div class="phase-progress">
          <div class="phase-bar"><div class="phase-bar-fill" style="width:${pct}%"></div></div>
          <span>${done}/${p.tasks.length}</span>
        </div>
      </div>
      <div class="task-list">`;

    p.tasks.forEach(t => {
      const st = t.status || '대기';
      const isDone = st === '완료';
      const icon = st === '완료' ? '&#x2713;' : st === '진행중' ? '&#9679;' : '';
      const isToday = t.date && isDateToday(t.date);

      html += `<div class="task-item">
        <div class="task-status" data-status="${st}" data-row="${t.row}" onclick="showStatusMenu(event,${t.row})">${icon}</div>
        <div class="task-content">
          <div class="task-title ${isDone?'done':''}">${t.task}</div>
          <div class="task-meta">
            <span class="tag ${isToday ? 'tag-today' : 'tag-date'}">${isToday ? 'TODAY ' : ''}${t.date}</span>
            <span class="tag tag-owner">${withTitle(t.owner)}</span>
            ${t.output ? `<span class="tag tag-output">${t.output}</span>` : ''}
          </div>
          ${t.note ? `<div class="task-note">${t.note}</div>` : ''}
        </div>
      </div>`;
    });
    html += '</div></div>';
  });
  document.getElementById('container').innerHTML = html;
}

function isDateToday(dateStr) {
  const m = dateStr.match(/(\d+)\/(\d+)/);
  if (!m) return false;
  const now = new Date();
  return parseInt(m[1]) === now.getMonth() + 1 && parseInt(m[2]) === now.getDate();
}

function showStatusMenu(event, row) {
  event.stopPropagation();
  closeMenu();
  const rect = event.target.getBoundingClientRect();
  const menu = document.createElement('div');
  menu.className = 'status-menu';
  menu.style.left = Math.min(rect.left, window.innerWidth - 150) + 'px';
  menu.style.top = (rect.bottom + 6) + 'px';

  [
    { label: '대기', color: 'var(--text3)' },
    { label: '진행중', color: 'var(--orange)' },
    { label: '완료', color: 'var(--green)' },
  ].forEach(s => {
    const item = document.createElement('div');
    item.className = 'status-menu-item';
    item.innerHTML = `<span class="smi-dot" style="background:${s.color}"></span>${s.label}`;
    item.onclick = () => updateStatus(row, s.label);
    menu.appendChild(item);
  });

  const backdrop = document.createElement('div');
  backdrop.className = 'backdrop';
  backdrop.onclick = closeMenu;
  document.body.appendChild(backdrop);
  document.body.appendChild(menu);

  if (menu.getBoundingClientRect().bottom > window.innerHeight)
    menu.style.top = (rect.top - menu.offsetHeight - 6) + 'px';
}

function closeMenu() { document.querySelectorAll('.status-menu, .backdrop').forEach(el => el.remove()); }

async function updateStatus(row, status) {
  closeMenu();
  const task = allTasks.find(t => t.row === row);
  if (task) task.status = status;
  renderAll();
  showToast(`${status === '완료' ? '&#x2705;' : status === '진행중' ? '&#x1f525;' : '&#x23f8;'} ${status}`);
  try { await fetch(API_URL + `?action=update&row=${row}&status=${encodeURIComponent(status)}`); }
  catch { showToast('저장 실패'); }
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.innerHTML = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2000);
}

loadData();
</script>
</body>
</html>
