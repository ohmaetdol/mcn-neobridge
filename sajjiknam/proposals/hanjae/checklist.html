<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#ffffff">
<title>사찍남 · 한희재 주도주 · PD 촬영 체크리스트</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
  :root {
    --bg: #ffffff;
    --card: #ffffff;
    --card2: #f8f9fb;
    --border: #e5e7eb;
    --border2: #f0f2f5;
    --text: #111827;
    --mute: #6b7280;
    --dim: #9ca3af;
    --hint: #adb5bd;
    --navy: #0A1628;
    --gold: #D4A017;
    --gold-b: #FFB800;
    --cream: #FFFBEA;
    --dark: #1f2937;
    --done: #D4A017;
    --accent: #b45309;
    --shadow-sm: 0 1px 2px rgba(17,24,39,0.04);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0;
    background: var(--bg);
    color: var(--text);
    font-family: 'Pretendard Variable', Pretendard, -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
    font-size: 15px; line-height: 1.55;
    overscroll-behavior-y: none;
    -webkit-font-smoothing: antialiased;
  }
  body { padding-bottom: 80px; }

  .header {
    position: sticky; top: 0; z-index: 50;
    background: rgba(255,255,255,0.94);
    backdrop-filter: saturate(180%) blur(14px);
    -webkit-backdrop-filter: saturate(180%) blur(14px);
    border-bottom: 1px solid var(--border);
    padding: 14px 16px 10px;
  }
  .header h1 {
    font-size: 15px; font-weight: 800; margin: 0 0 4px;
    letter-spacing: -0.02em;
    color: var(--navy);
  }
  .header .sub {
    color: var(--mute); font-size: 12px; margin-bottom: 10px;
  }
  .progress-wrap {
    display: flex; align-items: center; gap: 10px; margin-bottom: 10px;
  }
  .progress-bar {
    flex: 1; height: 8px; background: var(--card2);
    border-radius: 999px; overflow: hidden;
    border: 1px solid var(--border2);
  }
  .progress-fill {
    height: 100%; background: var(--gold);
    width: 0%; transition: width 0.3s ease;
    border-radius: 999px;
  }
  .progress-text {
    font-size: 13px; font-weight: 700; color: var(--text);
    min-width: 84px; text-align: right;
    font-variant-numeric: tabular-nums;
  }
  .filter-row {
    display: flex; gap: 6px; flex-wrap: wrap;
  }
  .filter-btn {
    flex: 1; min-width: 0;
    background: var(--card); border: 1px solid var(--border);
    color: var(--mute); padding: 9px 10px;
    border-radius: 8px; font-size: 12px; font-weight: 700;
    cursor: pointer; transition: all 0.15s;
    font-family: inherit;
  }
  .filter-btn:active { transform: scale(0.97); }
  .filter-btn.active {
    background: var(--navy); border-color: var(--navy); color: #fff;
  }
  .filter-btn.reset {
    flex: 0 0 auto; color: var(--dim);
  }
  .filter-btn.reset:hover,
  .filter-btn.reset:active { color: var(--text); border-color: var(--text); }
  .filter-btn.export {
    flex: 0 0 auto; color: var(--gold); border-color: var(--gold);
  }
  .filter-btn.export:active { background: var(--gold); color: #fff; }

  main { padding: 14px 14px 40px; }

  .loc-group { margin-bottom: 20px; }
  .loc-header {
    display: flex; align-items: center; gap: 10px;
    padding: 12px 14px;
    border-bottom: 1px solid var(--border);
    border-left: 4px solid var(--gold);
    font-weight: 800; font-size: 14px;
    margin-bottom: 10px; color: var(--navy);
    letter-spacing: -0.01em;
  }
  .loc-header .loc-title { flex: 1; min-width: 0; }
  .loc-header .loc-time {
    font-size: 11px; font-weight: 600; color: var(--mute);
    margin-left: 6px;
  }
  .loc-header .loc-count {
    font-size: 12px; font-weight: 700; color: var(--mute);
    background: var(--card2); padding: 3px 9px;
    border-radius: 999px; font-variant-numeric: tabular-nums;
    border: 1px solid var(--border);
  }

  .q {
    background: var(--card); border: 1px solid var(--border);
    border-radius: 10px; margin-bottom: 8px;
    overflow: hidden; transition: all 0.15s;
    box-shadow: var(--shadow-sm);
  }
  .q.done {
    background: var(--card2);
    opacity: 0.62;
  }
  .q-row {
    display: flex; align-items: flex-start; gap: 12px;
    padding: 14px;
    cursor: pointer; user-select: none;
    min-height: 52px;
  }
  .q-check {
    flex-shrink: 0;
    width: 24px; height: 24px;
    border: 2px solid var(--dim);
    border-radius: 6px;
    display: flex; align-items: center; justify-content: center;
    transition: all 0.15s;
    margin-top: 1px;
    background: #fff;
  }
  .q.done .q-check {
    background: var(--gold); border-color: var(--gold);
  }
  .q-check::after {
    content: ""; width: 6px; height: 11px;
    border: solid #fff; border-width: 0 2px 2px 0;
    transform: rotate(45deg) translate(-1px, -1px);
    opacity: 0;
  }
  .q.done .q-check::after { opacity: 1; }

  .q-body { flex: 1; min-width: 0; }
  .q-meta {
    display: flex; align-items: center; gap: 8px;
    margin-bottom: 6px; flex-wrap: wrap;
  }
  .q-num {
    background: var(--card2); color: var(--text);
    font-size: 11px; font-weight: 800;
    padding: 2px 8px; border-radius: 5px;
    font-variant-numeric: tabular-nums;
    border: 1px solid var(--border);
  }
  .q.done .q-num { background: var(--gold); color: #fff; border-color: var(--gold); }
  .q-tag {
    color: var(--mute); font-size: 12px; font-weight: 700;
    letter-spacing: -0.01em;
  }
  .q-text {
    font-size: 14px; line-height: 1.65;
    color: var(--text); word-break: keep-all;
    white-space: pre-wrap;
  }
  .q.done .q-text {
    text-decoration: line-through;
    text-decoration-color: var(--dim);
    color: var(--mute);
  }

  .q-text strong {
    color: var(--accent);
    font-weight: 800;
    background: #fef3c7;
    padding: 1px 5px;
    border-radius: 4px;
  }

  .q-hint {
    margin-top: 8px;
    padding: 8px 10px;
    background: #fafbfc;
    border-left: 2px solid #e5e7eb;
    border-radius: 0 4px 4px 0;
    font-size: 12.5px;
    line-height: 1.55;
    color: var(--hint);
    font-weight: 500;
    word-break: keep-all;
    white-space: pre-wrap;
  }
  .q-hint::before {
    content: "유도 답안 · ";
    font-size: 10px;
    font-weight: 700;
    color: #c1c7cd;
    letter-spacing: 0.02em;
  }
  .q.done .q-hint { opacity: 0.5; }

  .q.hidden { display: none; }
  .loc-group.empty { display: none; }

  .toast {
    position: fixed; left: 50%; bottom: 24px;
    transform: translateX(-50%) translateY(20px);
    background: #111827; color: #fff;
    padding: 10px 20px; border-radius: 999px;
    font-size: 13px; font-weight: 600;
    opacity: 0; transition: all 0.3s;
    pointer-events: none;
    box-shadow: 0 4px 20px rgba(0,0,0,0.15);
  }
  .toast.show {
    opacity: 1; transform: translateX(-50%) translateY(0);
  }

  @media (min-width: 768px) {
    body { font-size: 16px; }
    main { max-width: 760px; margin: 0 auto; padding: 18px 20px 60px; }
    .header { padding: 16px 20px 12px; }
    .header > div { max-width: 760px; margin: 0 auto; }
    .header h1 { font-size: 17px; }
  }
</style>
</head>

<div class="header">
  <div>
    <h1>사찍남 · 한희재 주도주 · PD 촬영 체크리스트</h1>
    <div class="sub">5개 장소 · 120개 질문 · 체크 자동 저장</div>

      <button class="filter-btn" data-filter="todo">미완료</button>
      <button class="filter-btn" data-filter="done">완료</button>
      <button class="filter-btn export" id="exportBtn">Export</button>
      <button class="filter-btn reset" id="resetBtn">초기화</button>

</div>

<main id="main"></main>

let state = { checks: {}, filter: 'all' };
function load() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) state.checks = JSON.parse(raw) || {};
  } catch (e) {}
}
function save() {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state.checks)); } catch (e) {}
}

const TOTAL = LOCATIONS.reduce((acc, l) => acc + l.questions.length, 0);

function escapeHTML(s) {
  return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}
function renderQuestionText(s) {
  return escapeHTML(s)
    .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
    .replace(/\n/g, '<br>');
}
function renderHint(s) {
  return escapeHTML(s).replace(/\n/g, '<br>');
}

function render() {
  const main = document.getElementById('main');
  main.innerHTML = '';
  let done = 0;

  for (const loc of LOCATIONS) {
    const group = document.createElement('section');
    group.className = 'loc-group';

    const locDone = loc.questions.filter(q => state.checks[loc.id + ':' + q.n]).length;
    const locTotal = loc.questions.length;
    done += locDone;

    const header = document.createElement('div');
    header.className = 'loc-header';
    header.innerHTML = `
      <div class="loc-title">${escapeHTML(loc.title)}<span class="loc-time"> · ${escapeHTML(loc.time)}</span></div>
      <div class="loc-count">${locDone}/${locTotal}</div>
    `;
    group.appendChild(header);

    let visibleInGroup = 0;
    for (const q of loc.questions) {
      const key = loc.id + ':' + q.n;
      const isDone = !!state.checks[key];

      if (state.filter === 'todo' && isDone) continue;
      if (state.filter === 'done' && !isDone) continue;

      visibleInGroup++;

      const card = document.createElement('div');
      card.className = 'q' + (isDone ? ' done' : '');

      const hintHTML = q.hint ? `<div class="q-hint">${renderHint(q.hint)}</div>` : '';

      card.innerHTML = `
        <div class="q-row" data-key="${key}">
          <div class="q-check"></div>
          <div class="q-body">
            <div class="q-meta">
              <span class="q-num">${q.n}</span>
              <span class="q-tag">${escapeHTML(q.tag)}</span>
            </div>
            <div class="q-text">${renderQuestionText(q.q)}</div>
            ${hintHTML}
          </div>
        </div>
      `;

      card.querySelector('.q-row').addEventListener('click', () => {
        state.checks[key] = !state.checks[key];
        save();
        render();
      });

      group.appendChild(card);
    }

    if (visibleInGroup === 0) group.classList.add('empty');
    main.appendChild(group);
  }

  const pct = TOTAL > 0 ? Math.round((done / TOTAL) * 100) : 0;
  document.getElementById('progressFill').style.width = pct + '%';
  document.getElementById('progressText').textContent = `${done}/${TOTAL} (${pct}%)`;
}

document.querySelectorAll('.filter-btn[data-filter]').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.filter-btn[data-filter]').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    state.filter = btn.dataset.filter;
    render();
  });
});

document.getElementById('resetBtn').addEventListener('click', () => {
  if (confirm('모든 체크를 초기화할까요?')) {
    state.checks = {};
    save();
    render();
    showToast('초기화 완료');
  }
});

document.getElementById('exportBtn').addEventListener('click', () => {
  const exportData = {
    schema_version: '1.0',
    performer: 'hanjae',
    episode: 'EP01',
    channel: 'sajjiknam',
    exported_at: new Date().toISOString(),
    storage_key: STORAGE_KEY,
    total_questions: 0,
    total_checked: 0,
    usage_rate_pct: 0,
    locations: [],
  };

  for (const loc of LOCATIONS) {
    const checkedQs = loc.questions.filter(q => state.checks[loc.id + ':' + q.n]);
    exportData.total_questions += loc.questions.length;
    exportData.total_checked += checkedQs.length;
    exportData.locations.push({
      id: loc.id,
      title: loc.title,
      time: loc.time,
      total: loc.questions.length,
      checked: checkedQs.length,
      rate_pct: loc.questions.length > 0 ? Math.round(checkedQs.length / loc.questions.length * 1000) / 10 : 0,
      checked_questions: checkedQs.map(q => ({
        n: q.n,
        tag: q.tag,
        q: q.q.replace(/\n+/g, ' ').replace(/\*\*/g, ''),
      })),
    });
  }
  exportData.usage_rate_pct = exportData.total_questions > 0
    ? Math.round(exportData.total_checked / exportData.total_questions * 1000) / 10
    : 0;

  const blob = new Blob([JSON.stringify(exportData, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  const dateStr = new Date().toISOString().slice(0, 10);
  a.href = url;
  a.download = `${exportData.performer}_${exportData.episode}_${dateStr}.json`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
  showToast(`Export 완료 (${exportData.total_checked}/${exportData.total_questions})`);
});

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 1500);
}

load();
render();
