<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>사찍남 캐스팅 보드</title>
<style>
:root {
  --bg: #0f0f0f;
  --surface: #1a1a2e;
  --surface2: #16213e;
  --card: #1e2a4a;
  --border: #2a3a5c;
  --text: #e4e4e4;
  --text2: #8892a8;
  --accent: #4fc3f7;
  --accent2: #81d4fa;
  --red: #ef5350;
  --orange: #ffa726;
  --green: #66bb6a;
  --yellow: #ffee58;
  --purple: #ab47bc;
  --pink: #ec407a;
  --grade-sp: linear-gradient(135deg, #ff6fd8, #3813c2);
  --grade-s: linear-gradient(135deg, #4fc3f7, #0277bd);
  --grade-a: linear-gradient(135deg, #66bb6a, #2e7d32);
  --grade-b: linear-gradient(135deg, #ffa726, #e65100);
  --grade-c: linear-gradient(135deg, #ef5350, #b71c1c);
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', sans-serif;
  background: var(--bg);
  color: var(--text);
  line-height: 1.6;
}

.container {
  max-width: 1400px;
  margin: 0 auto;
  padding: 20px;
}

/* ── 헤더 ── */
.header {
  text-align: center;
  padding: 40px 20px 30px;
  background: linear-gradient(135deg, var(--surface), var(--surface2));
  border-radius: 16px;
  margin-bottom: 24px;
  border: 1px solid var(--border);
}
.header h1 {
  font-size: 28px;
  font-weight: 800;
  background: linear-gradient(135deg, var(--accent), var(--purple));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  margin-bottom: 8px;
}
.header p {
  color: var(--text2);
  font-size: 14px;
}

/* ── 통계 카드 ── */
.stats-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 16px;
  margin-bottom: 24px;
}
.stat-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 20px;
  text-align: center;
}
.stat-card .number {
  font-size: 32px;
  font-weight: 800;
  color: var(--accent);
}
.stat-card .label {
  color: var(--text2);
  font-size: 13px;
  margin-top: 4px;
}

/* ── 필터 바 ── */
.filter-bar {
  display: flex;
  gap: 10px;
  margin-bottom: 24px;
  flex-wrap: wrap;
  align-items: center;
}
.filter-btn {
  padding: 8px 16px;
  border-radius: 20px;
  border: 1px solid var(--border);
  background: var(--surface);
  color: var(--text2);
  cursor: pointer;
  font-size: 13px;
  transition: all .2s;
}
.filter-btn:hover { border-color: var(--accent); color: var(--text); }
.filter-btn.active {
  background: var(--accent);
  color: #000;
  border-color: var(--accent);
  font-weight: 600;
}
.filter-section-label {
  color: var(--text2);
  font-size: 12px;
  font-weight: 600;
  margin-right: 4px;
}

/* ── 포화도 맵 ── */
.saturation-map {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 16px;
  padding: 24px;
  margin-bottom: 24px;
}
.saturation-map h2 {
  font-size: 18px;
  margin-bottom: 16px;
  color: var(--accent);
}
.sat-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
  gap: 12px;
}
.sat-row {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 12px 16px;
  background: var(--card);
  border-radius: 10px;
  cursor: pointer;
  transition: all .2s;
  border: 2px solid transparent;
}
.sat-row:hover { border-color: var(--accent); transform: translateY(-2px); }
.sat-row .icon { font-size: 24px; }
.sat-row .name { font-weight: 600; flex: 1; }
.sat-row .counts {
  display: flex;
  gap: 8px;
  font-size: 12px;
  color: var(--text2);
}
.sat-badge {
  padding: 3px 10px;
  border-radius: 10px;
  font-size: 11px;
  font-weight: 700;
}
.sat-VIRGIN { background: rgba(255,238,88,.15); color: #ffee58; }
.sat-BLUE { background: rgba(79,195,247,.15); color: #4fc3f7; }
.sat-OK { background: rgba(102,187,106,.15); color: #66bb6a; }
.sat-SATURATED { background: rgba(239,83,80,.15); color: #ef5350; }
.diff-stars { color: var(--orange); font-size: 12px; letter-spacing: 1px; }

/* ── 섭외 카드 ── */
.cards-section {
  margin-bottom: 24px;
}
.cards-section h2 {
  font-size: 18px;
  margin-bottom: 16px;
  color: var(--accent);
}
.casting-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(380px, 1fr));
  gap: 16px;
}
.casting-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 14px;
  overflow: hidden;
  transition: all .3s;
}
.casting-card:hover {
  border-color: var(--accent);
  transform: translateY(-3px);
  box-shadow: 0 8px 32px rgba(79,195,247,.1);
}
.card-header {
  padding: 16px 20px;
  display: flex;
  align-items: center;
  gap: 12px;
  border-bottom: 1px solid var(--border);
}
.grade-badge {
  width: 48px;
  height: 48px;
  border-radius: 12px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: 900;
  font-size: 18px;
  color: #fff;
  flex-shrink: 0;
}
.grade-SP { background: var(--grade-sp); }
.grade-S { background: var(--grade-s); }
.grade-A { background: var(--grade-a); }
.grade-B { background: var(--grade-b); }
.grade-C { background: var(--grade-c); }
.card-header-info { flex: 1; }
.card-header-info .views {
  font-size: 20px;
  font-weight: 800;
}
.card-header-info .combo {
  font-size: 12px;
  color: var(--text2);
}
.industry-tag {
  padding: 4px 10px;
  border-radius: 8px;
  font-size: 11px;
  font-weight: 700;
  color: #fff;
}

.card-body { padding: 16px 20px; }
.card-title {
  font-size: 15px;
  font-weight: 700;
  margin-bottom: 12px;
  line-height: 1.4;
  color: var(--text);
}
.card-meta {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
  margin-bottom: 12px;
}
.meta-item {
  font-size: 12px;
  color: var(--text2);
}
.meta-item strong {
  color: var(--text);
}

.card-insta {
  background: var(--card);
  border-radius: 10px;
  padding: 12px;
  margin-top: 12px;
}
.card-insta-title {
  font-size: 11px;
  font-weight: 700;
  color: var(--pink);
  margin-bottom: 8px;
  text-transform: uppercase;
  letter-spacing: 1px;
}
.tag-list {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  margin-bottom: 8px;
}
.tag {
  padding: 3px 8px;
  border-radius: 6px;
  font-size: 11px;
  background: rgba(236,64,122,.1);
  color: var(--pink);
}
.kw-tag {
  background: rgba(79,195,247,.1);
  color: var(--accent);
}
.follower-info {
  font-size: 12px;
  color: var(--text2);
  margin-top: 6px;
}

.dm-template {
  background: var(--card);
  border-radius: 10px;
  padding: 12px;
  margin-top: 8px;
  font-size: 12px;
  color: var(--text2);
  line-height: 1.8;
  position: relative;
}
.dm-template .copy-btn {
  position: absolute;
  top: 8px;
  right: 8px;
  padding: 4px 10px;
  border-radius: 6px;
  border: 1px solid var(--border);
  background: var(--surface);
  color: var(--accent);
  cursor: pointer;
  font-size: 11px;
}
.dm-template .copy-btn:hover { background: var(--accent); color: #000; }

/* ── 우선순위 요약 ── */
.priority-section {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 16px;
  padding: 24px;
  margin-bottom: 24px;
}
.priority-section h2 {
  font-size: 18px;
  margin-bottom: 16px;
  color: var(--accent);
}
.priority-list { list-style: none; }
.priority-list li {
  padding: 12px 16px;
  border-radius: 10px;
  margin-bottom: 8px;
  display: flex;
  align-items: center;
  gap: 12px;
}
.priority-list .p1 { background: rgba(79,195,247,.1); }
.priority-list .p2 { background: rgba(171,71,188,.1); }
.priority-list .p3 { background: rgba(255,167,38,.1); }
.priority-list .p4 { background: rgba(239,83,80,.1); }
.priority-label {
  font-weight: 700;
  font-size: 13px;
  min-width: 80px;
}
.p1 .priority-label { color: var(--accent); }
.p2 .priority-label { color: var(--purple); }
.p3 .priority-label { color: var(--orange); }
.p4 .priority-label { color: var(--red); }

/* ── 반응형 ── */
@media (max-width: 768px) {
  .stats-grid { grid-template-columns: repeat(2, 1fr); }
  .casting-grid { grid-template-columns: 1fr; }
  .sat-grid { grid-template-columns: 1fr; }
  .header h1 { font-size: 22px; }
  .filter-bar { gap: 6px; }
}

/* ── 스크롤바 ── */
::-webkit-scrollbar { width: 6px; }
::-webkit-scrollbar-track { background: var(--bg); }
::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

/* ── 토스트 ── */
.toast {
  position: fixed;
  bottom: 30px;
  left: 50%;
  transform: translateX(-50%) translateY(100px);
  background: var(--accent);
  color: #000;
  padding: 12px 24px;
  border-radius: 10px;
  font-size: 14px;
  font-weight: 600;
  opacity: 0;
  transition: all .3s;
  z-index: 9999;
}
.toast.show {
  transform: translateX(-50%) translateY(0);
  opacity: 1;
}
</style>
</head>

<div class="container">
  <!-- 헤더 -->
  <div class="header">

  <div class="stats-grid" id="statsGrid"></div>

  <div class="priority-section" id="prioritySection"></div>

</div>

  setTimeout(() => t.classList.remove('show'), 2000);
}

function copyText(text) {
  navigator.clipboard.writeText(text).then(() => showToast('DM 문구 복사됨!'));
}

// ── 통계 ──
function renderStats() {
  const total = RAW_DATA.length;
  const grades = {};
  RAW_DATA.forEach(d => { grades[d.grade] = (grades[d.grade]||0) + 1; });
  const blueOcean = new Set(RAW_DATA.filter(d => ['VIRGIN','BLUE'].includes(d.saturation_code)).map(d => d.industry)).size;
  const avgViews = Math.round(RAW_DATA.reduce((s,d) => s + d.estimated_views, 0) / total);

  document.getElementById('statsGrid').innerHTML = `
    <div class="stat-card"><div class="number">${total}</div><div class="label">전체 조합 수</div></div>
    <div class="stat-card"><div class="number" style="color:var(--purple)">${grades['S+']||0}</div><div class="label">S+ 등급</div></div>
    <div class="stat-card"><div class="number" style="color:var(--green)">${blueOcean}</div><div class="label">블루오션 업종</div></div>
    <div class="stat-card"><div class="number" style="color:var(--orange)">${formatViews(avgViews)}</div><div class="label">평균 예상 조회수</div></div>
  `;
}

// ── 우선순위 ──
function renderPriority() {
  const p1 = [], p2 = [], p3 = [], p4 = [];
  Object.entries(INDUSTRIES).forEach(([name, meta]) => {
    const sat = meta.sajjiknam <= 2;
    if (sat && meta.difficulty <= 2) p1.push(name);
    else if (sat && meta.difficulty === 3) p2.push(name);
    else if (sat && meta.difficulty >= 4) p3.push(name);
    else if (meta.sajjiknam >= 6) p4.push(name);
  });

  document.getElementById('prioritySection').innerHTML = `
    <h2>섭외 우선순위</h2>
    <ul class="priority-list">
      <li class="p1"><span class="priority-label">1순위</span><span>블루오션 + 섭외 쉬움: ${p1.join(', ')}</span></li>
      <li class="p2"><span class="priority-label">2순위</span><span>블루오션 + 섭외 보통: ${p2.join(', ')}</span></li>
      <li class="p3"><span class="priority-label">3순위</span><span>블루오션 + 섭외 어려움: ${p3.join(', ')}</span></li>
      <li class="p4"><span class="priority-label">비추천</span><span>포화: ${p4.join(', ') || '없음'}</span></li>
    </ul>
  `;
}

// ── 포화도 맵 ──
function renderSatMap() {
  const grid = document.getElementById('satGrid');
  const sorted = Object.entries(INDUSTRIES).sort((a,b) => a[1].sajjiknam - b[1].sajjiknam);

  grid.innerHTML = sorted.map(([name, meta]) => {
    let satCode, satLabel;
    if (meta.sajjiknam === 0) { satCode = 'VIRGIN'; satLabel = '미개척'; }
    else if (meta.sajjiknam <= 2) { satCode = 'BLUE'; satLabel = '블루오션'; }
    else if (meta.sajjiknam <= 5) { satCode = 'OK'; satLabel = '적정'; }
    else { satCode = 'SATURATED'; satLabel = '포화'; }

    return `
      <div class="sat-row" onclick="filterByIndustry('${name}')">
        <span class="icon">${meta.icon}</span>
        <span class="name">${name}</span>
        <span class="counts">
          <span>사찍남 ${meta.sajjiknam}</span>
          <span>경쟁 ${meta.competitor}</span>
        </span>
        <span class="sat-badge sat-${satCode}">${satLabel}</span>
        <span class="diff-stars">${diffStars(meta.difficulty)}</span>
      </div>
    `;
  }).join('');
}

// ── 필터 바 ──
function renderFilters() {
  const bar = document.getElementById('filterBar');

  const satOptions = [
    ['all', '전체'],
    ['VIRGIN', '미개척'],
    ['BLUE', '블루오션'],
    ['OK', '적정'],
    ['SATURATED', '포화'],
  ];
  const gradeOptions = [
    ['all', '전체'],
    ['S+', 'S+'],
    ['S', 'S'],
    ['A', 'A'],
    ['B', 'B+이하'],
  ];

  bar.innerHTML = `
    <span class="filter-section-label">포화도:</span>
    ${satOptions.map(([v,l]) => `<button class="filter-btn ${activeFilters.saturation===v?'active':''}" onclick="setSatFilter('${v}')">${l}</button>`).join('')}
    <span class="filter-section-label" style="margin-left:12px">등급:</span>
    ${gradeOptions.map(([v,l]) => `<button class="filter-btn ${activeFilters.grade===v?'active':''}" onclick="setGradeFilter('${v}')">${l}</button>`).join('')}
    ${activeFilters.industry !== 'all' ? `<button class="filter-btn active" onclick="filterByIndustry('all')" style="margin-left:12px">✕ ${activeFilters.industry}</button>` : ''}
  `;
}

function setSatFilter(v) {
  activeFilters.saturation = v;
  renderFilters();
  renderCards();
}

function setGradeFilter(v) {
  activeFilters.grade = v;
  renderFilters();
  renderCards();
}

function filterByIndustry(name) {
  activeFilters.industry = name === activeFilters.industry ? 'all' : name;
  renderFilters();
  renderCards();
}

// ── 필터 적용 ──
function getFilteredData() {
  return RAW_DATA.filter(d => {
    if (activeFilters.saturation !== 'all' && d.saturation_code !== activeFilters.saturation) return false;
    if (activeFilters.grade !== 'all') {
      if (activeFilters.grade === 'B') {
        if (!['B','C'].includes(d.grade)) return false;
      } else {
        if (d.grade !== activeFilters.grade) return false;
      }
    }
    if (activeFilters.industry !== 'all' && d.industry !== activeFilters.industry) return false;
    return true;
  });
}

// ── 섭외 카드 ──
function renderCards() {
  const filtered = getFilteredData();
  const grid = document.getElementById('castingGrid');
  const title = document.getElementById('cardsTitle');

  title.textContent = activeFilters.industry !== 'all'
    ? `${activeFilters.industry} 섭외 카드 (${filtered.length}개)`
    : `전체 섭외 카드 (${filtered.length}개)`;

  if (filtered.length === 0) {
    grid.innerHTML = '<p style="color:var(--text2);padding:40px;text-align:center">해당 조건에 맞는 조합이 없습니다.</p>';
    return;
  }

  grid.innerHTML = filtered.map((d, i) => {
    const meta = INDUSTRIES[d.industry] || {};
    const gradeClass = d.grade === 'S+' ? 'SP' : d.grade;
    const gradeText = d.grade;
    const dmText = `안녕하세요, 유튜브 사찍남 제작팀입니다.\n${d.industry} 사장님의 이야기를 영상으로 만들고 싶어 연락드립니다.\n예상 조회수 ${d.estimated_views.toLocaleString()}회 규모의 콘텐츠입니다.\n간단한 통화 가능하실까요?`;

    return `
      <div class="casting-card">
        <div class="card-header">
          <div class="grade-badge grade-${gradeClass}">${gradeText}</div>
          <div class="card-header-info">
            <div class="views">${formatViews(d.estimated_views)}회</div>
            <div class="combo">${d.age} · ${d.story} · ${d.revenue}</div>
          </div>
          <span class="industry-tag" style="background:${meta.color||'#666'}">${meta.icon||''} ${d.industry}</span>
        </div>
        <div class="card-body">
          <div class="card-title">${d.title}</div>
          <div class="card-meta">
            <div class="meta-item"><strong>훅:</strong> ${d.story_hook}</div>
            <div class="meta-item"><strong>포화도:</strong> <span class="sat-badge sat-${d.saturation_code}" style="font-size:10px">${d.saturation}</span></div>
            <div class="meta-item"><strong>갭:</strong> 사찍남 ${d.sajjiknam_count} vs 경쟁 ${d.competitor_count}</div>
            <div class="meta-item"><strong>섭외:</strong> <span class="diff-stars">${diffStars(d.recruit_difficulty)}</span></div>
          </div>

          <div class="card-insta">
            <div class="card-insta-title">Instagram 섭외 가이드</div>
            <div class="tag-list">
              ${(d.hashtags||[]).slice(0,5).map(h => `<span class="tag">${h}</span>`).join('')}
            </div>
            <div class="tag-list">
              ${(d.insta_keywords||[]).slice(0,5).map(k => `<span class="tag kw-tag">${k}</span>`).join('')}
            </div>
            <div class="follower-info">타겟 팔로워: ${d.follower_range} · ${d.recruit_note}</div>
            ${(d.sub_jobs||[]).length ? `<div class="follower-info" style="margin-top:4px">찾을 직종: ${d.sub_jobs.join(' / ')}</div>` : ''}
          </div>

          <div class="dm-template">
            <button class="copy-btn" onclick="copyText(\`${dmText.replace(/`/g,"'")}\`)">복사</button>
            <div style="white-space:pre-line">${dmText}</div>
          </div>
        </div>
      </div>
    `;
  }).join('');
}

// ── 초기화 ──
renderStats();
renderPriority();
renderSatMap();
renderFilters();
renderCards();
</script>
</body>
</html>
