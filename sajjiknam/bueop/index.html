<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>부업소개하는남자 데이터 분석 대시보드</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',-apple-system,sans-serif;background:#f5f6fa;color:#2d3436;line-height:1.6}
.header{background:linear-gradient(135deg,#1a1a2e 0%,#16213e 50%,#0f3460 100%);color:#fff;padding:36px 24px;text-align:center}
.header h1{font-size:26px;font-weight:800;margin-bottom:6px;letter-spacing:-0.5px}
.header p{font-size:14px;color:#a0aec0;margin-bottom:4px}
.header .date{font-size:12px;color:#718096}
.container{max-width:1400px;margin:0 auto;padding:24px 16px}
.section-title{font-size:18px;font-weight:700;margin:28px 0 14px;padding-bottom:8px;border-bottom:2px solid #2d3436}
/* Cards */
.cards-row{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-bottom:24px}
@media(max-width:900px){.cards-row{grid-template-columns:1fr}}
.card{background:#fff;border-radius:12px;box-shadow:0 2px 8px rgba(0,0,0,.08);padding:20px;border:1px solid #eee}
.card h3{font-size:16px;font-weight:700;margin-bottom:12px;display:flex;align-items:center;gap:8px}
.ch-dot{width:10px;height:10px;border-radius:50%;display:inline-block}
.metric-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.metric{padding:10px;background:#f8f9fa;border-radius:8px}
.metric-label{font-size:11px;color:#636e72;margin-bottom:2px}
.metric-value{font-size:18px;font-weight:700}
/* Charts */
.charts-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:24px}
@media(max-width:900px){.charts-grid{grid-template-columns:1fr}}
.chart-card{background:#fff;border-radius:12px;box-shadow:0 2px 8px rgba(0,0,0,.08);padding:20px;border:1px solid #eee}
.chart-card h4{font-size:14px;font-weight:600;margin-bottom:12px}
.chart-container{position:relative;height:280px}
/* Laws */
.law-card{background:#fff;border-radius:12px;box-shadow:0 2px 8px rgba(0,0,0,.08);padding:20px;border-left:4px solid #F08F00;margin-bottom:12px}
.law-card h4{font-size:15px;font-weight:700;margin-bottom:6px}
.law-card p{font-size:13px;color:#636e72}
.law-card .apply{font-size:13px;color:#2d3436;font-weight:600;margin-top:4px}
/* Heatmap rows */
.hm-row{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid #f0f0f0}
.hm-row:last-child{border-bottom:none}
.hm-rank{font-weight:700;font-size:14px;color:#636e72;min-width:28px;text-align:center}
.hm-info{min-width:180px;max-width:200px}
.hm-title{font-size:12px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hm-title a{color:#2d3436;text-decoration:none}.hm-title a:hover{color:#3498db;text-decoration:underline}
.hm-meta{font-size:11px;color:#636e72}
.hm-bar-wrap{flex:1;height:28px;border-radius:4px;overflow:hidden;cursor:pointer}
.hm-bar{width:100%;height:100%;border-radius:4px}
.hm-stats{min-width:90px;text-align:right;font-size:11px;color:#636e72}
.hm-stats strong{color:#2d3436}
/* Timeline plan */
.plan-row{display:flex;gap:0;margin-bottom:24px;border-radius:12px;overflow:hidden;box-shadow:0 2px 8px rgba(0,0,0,.08)}
.plan-seg{padding:12px 8px;text-align:center;color:#fff;font-size:11px;font-weight:600;position:relative}
.plan-seg .time{font-size:10px;opacity:.8}
.plan-seg .label{font-size:12px;margin-top:2px}
/* Titles */
.title-row{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid #f0f0f0}
.title-rank{font-size:24px;font-weight:800;color:#F08F00;min-width:32px}
.title-text{font-size:14px;font-weight:600;flex:1}
.title-formula{font-size:12px;color:#636e72}
/* Tabs */
.tab-bar{display:flex;gap:0;border-bottom:2px solid #eee;margin-bottom:0}
.tab-btn{padding:10px 20px;border:none;background:transparent;font-family:inherit;font-size:13px;font-weight:600;color:#636e72;cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-2px}
.tab-btn:hover{color:#2d3436;background:#f8f9fa}.tab-btn.active{color:#2d3436;border-bottom-color:#F08F00}
.tab-content{display:none}.tab-content.active{display:block}
</style>
</head>

function fmt(n) { return n ? n.toLocaleString() : '0'; }
function pct(n) { return n ? (n*100).toFixed(1)+'%' : '-'; }
function dur(s) { const m=Math.floor(s/60),ss=Math.floor(s%60); return m+':'+String(ss).padStart(2,'0'); }

function renderChannelCards() {
  return D.channels.map(ch => `
    <div class="card">
      <h3><span class="ch-dot" style="background:${ch.color}"></span>${ch.name}</h3>
      <div class="metric-grid">
        <div class="metric"><div class="metric-label">전체 영상</div><div class="metric-value">${fmt(ch.total_videos)}개</div></div>
        <div class="metric"><div class="metric-label">히트맵 분석</div><div class="metric-value">${ch.analyzed}개</div></div>
        <div class="metric"><div class="metric-label">평균 조회수</div><div class="metric-value">${fmt(ch.avg_views)}</div></div>
        <div class="metric"><div class="metric-label">평균 길이</div><div class="metric-value">${ch.avg_duration}분</div></div>
      </div>
    </div>
  `).join('');
}

function renderLaws() {
  return D.laws.map((law,i) => `
    <div class="law-card">
      <h4>${i+1}. ${law['법칙'] || law.law || ''}</h4>
      <p>${law['근거'] || law.evidence || ''}</p>
      <div class="apply">적용: ${law['적용'] || law.apply || ''}</div>
    </div>
  `).join('');
}

function renderHeatmapRows(ch_name) {
  const vids = D.videos.filter(v => v.channel === ch_name).sort((a,b) => b.view_count - a.view_count);
  if (!vids.length) return '<p style="padding:16px;color:#636e72">히트맵 데이터 없음</p>';

  return vids.map((v,i) => {
    const tl = v.timeline || [];
    let gradient = '#e9ecef';
    if (tl.length > 1) {
      const maxT = tl[tl.length-1][0] || 1;
      const stops = tl.map(p => {
        const pctPos = (p[0]/maxT*100).toFixed(1);
        const score = p[1];
        let color;
        if (score >= 0.8) color = 'rgba(0,184,148,0.9)';
        else if (score >= 0.5) color = 'rgba(0,184,148,0.5)';
        else if (score >= 0.2) color = 'rgba(253,203,110,0.6)';
        else color = 'rgba(231,76,60,0.4)';
        return `${color} ${pctPos}%`;
      });
      gradient = `linear-gradient(to right, ${stops.join(', ')})`;
    }

    const killer = v.top_killer;
    const killerHtml = killer ? `<div style="font-size:10px;color:#00b894">Peak ${killer.start_str}: "${(killer.text||'').substring(0,30)}"</div>` : '';

    return `
    <div class="hm-row">
      <div class="hm-rank">${i+1}</div>
      <div class="hm-info">
        <div class="hm-title"><a href="${v.url}" target="_blank">${v.title}</a></div>
        <div class="hm-meta">${fmt(v.view_count)}뷰 · ${dur(v.duration_sec)}</div>
        ${killerHtml}
      </div>
      <div class="hm-bar-wrap" onclick="window.open('${v.url}','_blank')">
        <div class="hm-bar" style="background:${gradient}"></div>
      </div>
      <div class="hm-stats">
        <div>킬러 <strong>${v.killer_count}</strong></div>
        <div>이탈 <strong>${v.drop_count}</strong></div>
        <div>평균 <strong>${(v.avg_score||0).toFixed(2)}</strong></div>
      </div>
    </div>`;
  }).join('');
}

function renderTimelinePlan() {
  const plan = D.timeline_plan;
  if (!plan || !plan['구간']) return '';

  const colors = ['#e74c3c','#e67e22','#f39c12','#2ecc71','#00b894','#3498db','#9b59b6','#636e72'];
  return plan['구간'].map((seg,i) => {
    const w = i < 7 ? '14%' : '2%';
    return `<div class="plan-seg" style="background:${colors[i%8]};flex:${i===4?2:i===7?0.5:1}">
      <div class="time">${seg['시간'] || ''}</div>
      <div class="label">${seg['내용'] ? seg['내용'].substring(0,15) : ''}</div>
    </div>`;
  }).join('');
}

function renderTitles() {
  return D.titles.map(t => `
    <div class="title-row">
      <div class="title-rank">${t['순위'] || t.rank}</div>
      <div>
        <div class="title-text">${t['제목'] || t.title}</div>
        <div class="title-formula">${t['공식'] || t.formula || ''}</div>
      </div>
    </div>
  `).join('');
}

function renderRetentionChart() {
  const channels = D.channels.filter(c => c.analyzed > 0);
  const datasets = [];

  channels.forEach(ch => {
    const vids = D.videos.filter(v => v.channel === ch.name && v.timeline && v.timeline.length > 0);
    if (!vids.length) return;

    // 평균 리텐션 커브 (10분위)
    const buckets = Array(10).fill(null).map(() => []);
    vids.forEach(v => {
      const maxT = v.timeline[v.timeline.length-1][0] || 1;
      v.timeline.forEach(([t, s]) => {
        const idx = Math.min(9, Math.floor(t / maxT * 10));
        buckets[idx].push(s);
      });
    });

    const avgCurve = buckets.map(b => b.length ? (b.reduce((a,c)=>a+c,0)/b.length) : null);
    datasets.push({
      label: ch.name,
      data: avgCurve,
      borderColor: ch.color,
      backgroundColor: ch.color + '20',
      fill: true,
      tension: 0.4,
      pointRadius: 4,
    });
  });

  return datasets;
}

      }

  // Killer chart

    const avgDrop = vids.length ? vids.reduce((a,v) => a + (v.drop_count||0), 0) / vids.length : 0;
    return { name: ch.name, color: ch.color, killer: avgKiller, drop: avgDrop };
  });

  if (killerData.length) {
    new Chart(document.getElementById('killerChart'), {
      type: 'bar',

        ]
      },
      options: {
        responsive: true, maintainAspectRatio: false,
        plugins: { legend: { position: 'bottom' } },
      }
    });
  }

  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
  btn.classList.add('active');
  document.getElementById('tab'+idx).classList.add('active');
}

document.addEventListener('DOMContentLoaded', init);
</script>
</body>
