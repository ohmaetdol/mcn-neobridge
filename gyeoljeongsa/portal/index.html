<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>아는언니 세령 — 기획 포털</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<style>
:root {
  --bg: #ffffff;
  --card: #f7f7f8;
  --card-hover: #efefef;
  --border: #e2e2e5;
  --text: #1a1a1a;
  --text-dim: #6b6b6b;
  --accent: #6366f1;
  --accent-light: #4f46e5;
  --green: #16a34a;
  --yellow: #ca8a04;
  --red: #dc2626;
  --orange: #ea580c;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: -apple-system, BlinkMacSystemFont, 'Pretendard', sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
}

/* Auth Screen */
.auth-screen {
  display: flex;
  align-items: center;
  justify-content: center;
  min-height: 100vh;
  padding: 20px;
}

.auth-box {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 16px;
  padding: 48px;
  width: 100%;
  max-width: 400px;
  text-align: center;
}

.auth-box h1 { font-size: 24px; margin-bottom: 8px; }
.auth-box p { color: var(--text-dim); margin-bottom: 32px; font-size: 14px; }

.auth-input {
  width: 100%;
  padding: 14px 16px;
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: 10px;
  color: var(--text);
  font-size: 16px;
  outline: none;
  margin-bottom: 16px;
}

.auth-input:focus { border-color: var(--accent); }

.auth-btn {
  width: 100%;
  padding: 14px;
  background: var(--accent);
  border: none;
  border-radius: 10px;
  color: white;
  font-size: 16px;
  font-weight: 600;
  cursor: pointer;
  transition: background 0.2s;
}

.auth-btn:hover { background: var(--accent-light); }
.auth-error { color: var(--red); font-size: 13px; margin-top: 12px; display: none; }

/* Main Layout */
.app { display: none; }

.header {
  padding: 20px 32px;
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.header-left { display: flex; align-items: center; gap: 16px; }
.header-left h1 { font-size: 20px; font-weight: 700; }
.channel-badge {
  background: var(--accent);
  color: white;
  padding: 4px 12px;
  border-radius: 20px;
  font-size: 12px;
  font-weight: 600;
}

.header-right { display: flex; align-items: center; gap: 12px; }

.view-toggle {
  display: flex;
  background: var(--bg);
  border-radius: 8px;
  overflow: hidden;
  border: 1px solid var(--border);
}

.view-btn {
  padding: 8px 16px;
  background: none;
  border: none;
  color: var(--text-dim);
  font-size: 13px;
  cursor: pointer;
  transition: all 0.2s;
}

.view-btn.active {
  background: var(--accent);
  color: white;
}

/* Calendar */
.main { padding: 32px; }

.calendar-grid {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  gap: 2px;
}

.cal-header {
  text-align: center;
  padding: 12px;
  color: var(--text-dim);
  font-size: 13px;
  font-weight: 600;
}

.cal-day {
  background: var(--card);
  min-height: 120px;
  padding: 8px;
  border: 1px solid transparent;
  border-radius: 8px;
  cursor: pointer;
  transition: all 0.2s;
}

.cal-day:hover { border-color: var(--border); background: var(--card-hover); }
.cal-day.today { border-color: var(--accent); }
.cal-day.empty { background: transparent; cursor: default; }
.cal-day.empty:hover { border-color: transparent; }

.cal-date {
  font-size: 13px;
  color: var(--text-dim);
  margin-bottom: 4px;
}

.cal-date.today-num { color: var(--accent); font-weight: 700; }

.cal-event {
  padding: 4px 8px;
  border-radius: 6px;
  font-size: 11px;
  margin-bottom: 3px;
  cursor: pointer;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.cal-event.shoot { background: rgba(249, 115, 22, 0.08); color: var(--orange); border-left: 3px solid var(--orange); }
.cal-event.upload { background: rgba(34, 197, 94, 0.08); color: var(--green); border-left: 3px solid var(--green); }
.cal-event.draft { background: rgba(99, 102, 241, 0.08); color: var(--accent-light); border-left: 3px solid var(--accent); }

.cal-nav {
  display: flex;
  align-items: center;
  gap: 16px;
  margin-bottom: 24px;
}

.cal-nav h2 { font-size: 22px; font-weight: 700; }

.cal-nav-btn {
  width: 36px; height: 36px;
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 8px;
  color: var(--text);
  font-size: 18px;
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
}

.cal-nav-btn:hover { background: var(--card-hover); }

/* List View */
.proposal-list { display: flex; flex-direction: column; gap: 12px; }

.proposal-card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 20px 24px;
  cursor: pointer;
  transition: all 0.2s;
  display: flex;
  align-items: center;
  gap: 20px;
}

.proposal-card:hover { border-color: var(--accent); transform: translateY(-1px); }

.ep-badge {
  background: var(--accent);
  color: white;
  width: 52px; height: 52px;
  border-radius: 12px;
  display: flex; align-items: center; justify-content: center;
  font-weight: 800;
  font-size: 15px;
  flex-shrink: 0;
}

.proposal-info { flex: 1; }
.proposal-info h3 { font-size: 16px; margin-bottom: 4px; }
.proposal-meta { display: flex; gap: 16px; color: var(--text-dim); font-size: 13px; }

.status-badge {
  padding: 4px 10px;
  border-radius: 20px;
  font-size: 12px;
  font-weight: 600;
}

.status-badge.draft { background: rgba(136,136,136,0.1); color: var(--text-dim); }
.status-badge.review { background: rgba(234,179,8,0.1); color: var(--yellow); }
.status-badge.approved { background: rgba(34,197,94,0.1); color: var(--green); }
.status-badge.shooting { background: rgba(249,115,22,0.1); color: var(--orange); }

/* Detail Panel */
.detail-overlay {
  position: fixed;
  top: 0; left: 0; right: 0; bottom: 0;
  background: rgba(0,0,0,0.3);
  z-index: 100;
  display: none;
  justify-content: flex-end;
}

.detail-overlay.open { display: flex; }

.detail-panel {
  width: 720px;
  max-width: 90vw;
  background: var(--bg);
  height: 100vh;
  overflow-y: auto;
  border-left: 1px solid var(--border);
  animation: slideIn 0.25s ease;
}

@keyframes slideIn {
  from { transform: translateX(100%); }
  to { transform: translateX(0); }
}

.detail-header {
  padding: 24px 32px;
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: space-between;
  position: sticky;
  top: 0;
  background: var(--bg);
  z-index: 10;
}

.detail-close {
  width: 36px; height: 36px;
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 8px;
  color: var(--text);
  font-size: 20px;
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
}

.detail-body { padding: 32px; }

.detail-meta {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
  gap: 16px;
  margin-bottom: 32px;
}

.meta-item {
  background: var(--card);
  border-radius: 10px;
  padding: 16px;
}

.meta-label { font-size: 12px; color: var(--text-dim); margin-bottom: 4px; }
.meta-value { font-size: 15px; font-weight: 600; }

/* Data Evidence */
.evidence-section {
  background: var(--card);
  border-radius: 12px;
  padding: 20px;
  margin-bottom: 24px;
  border: 1px solid var(--border);
}

.evidence-section h3 {
  font-size: 14px;
  color: var(--accent-light);
  margin-bottom: 12px;
  display: flex;
  align-items: center;
  gap: 8px;
}

.evidence-item {
  display: flex;
  justify-content: space-between;
  padding: 8px 0;
  border-bottom: 1px solid var(--border);
  font-size: 13px;
}

.evidence-item:last-child { border-bottom: none; }
.evidence-signal { color: var(--text-dim); }
.evidence-value { font-weight: 600; color: var(--green); }

/* Content Sections */
.content-section {
  margin-bottom: 24px;
  position: relative;
}

.content-section-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 12px;
}

.content-section h3 {
  font-size: 16px;
  font-weight: 700;
}

.section-actions { display: flex; gap: 8px; }

.action-btn {
  padding: 6px 12px;
  border-radius: 8px;
  border: 1px solid var(--border);
  background: var(--card);
  color: var(--text-dim);
  font-size: 12px;
  cursor: pointer;
  transition: all 0.2s;
}

.action-btn:hover { border-color: var(--accent); color: var(--accent-light); }
.action-btn.revision { border-color: var(--yellow); color: var(--yellow); }
.action-btn.revision:hover { background: rgba(234,179,8,0.06); }

.content-md {
  background: var(--card);
  border-radius: 12px;
  padding: 24px;
  font-size: 14px;
  line-height: 1.8;
  border: 1px solid var(--border);
}

.content-md h1, .content-md h2, .content-md h3 { margin: 16px 0 8px; }
.content-md table { width: 100%; border-collapse: collapse; margin: 12px 0; }
.content-md th, .content-md td {
  padding: 8px 12px;
  border: 1px solid var(--border);
  text-align: left;
  font-size: 13px;
}
.content-md th { background: rgba(99,102,241,0.06); font-weight: 600; }
.content-md code { background: rgba(99,102,241,0.08); padding: 2px 6px; border-radius: 4px; font-size: 13px; }
.content-md pre { background: var(--bg); padding: 16px; border-radius: 8px; overflow-x: auto; margin: 12px 0; }
.content-md blockquote { border-left: 3px solid var(--accent); padding-left: 16px; color: var(--text-dim); margin: 12px 0; }

/* Comment / Revision Modal */
.modal-overlay {
  position: fixed;
  top: 0; left: 0; right: 0; bottom: 0;
  background: rgba(0,0,0,0.3);
  z-index: 200;
  display: none;
  align-items: center;
  justify-content: center;
}

.modal-overlay.open { display: flex; }

.modal {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 16px;
  padding: 32px;
  width: 90%;
  max-width: 500px;
}

.modal h3 { margin-bottom: 16px; }

.modal textarea {
  width: 100%;
  min-height: 120px;
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: 10px;
  color: var(--text);
  padding: 14px;
  font-size: 14px;
  font-family: inherit;
  resize: vertical;
  outline: none;
}

.modal textarea:focus { border-color: var(--accent); }

.modal-actions {
  display: flex;
  gap: 8px;
  justify-content: flex-end;
  margin-top: 16px;
}

.modal-btn {
  padding: 10px 20px;
  border-radius: 8px;
  border: none;
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
}

.modal-btn.cancel { background: var(--bg); color: var(--text-dim); border: 1px solid var(--border); }
.modal-btn.submit { background: var(--accent); color: white; }
.modal-btn.submit:hover { background: var(--accent-light); }

/* Comments list */
.comments-list { margin-top: 16px; }

.comment-item {
  background: var(--bg);
  border-radius: 10px;
  padding: 14px;
  margin-bottom: 8px;
  border: 1px solid var(--border);
}

.comment-header {
  display: flex;
  justify-content: space-between;
  margin-bottom: 6px;
  font-size: 12px;
  color: var(--text-dim);
}

.comment-author { font-weight: 600; color: var(--accent-light); }
.comment-content { font-size: 14px; line-height: 1.6; }

.resolve-btn {
  background: none;
  border: 1px solid var(--green);
  color: var(--green);
  padding: 3px 10px;
  border-radius: 6px;
  font-size: 11px;
  cursor: pointer;
}

/* Revision requests panel */
.revisions-panel {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 20px;
  margin-bottom: 24px;
}

.revision-item {
  padding: 12px;
  background: var(--bg);
  border-radius: 8px;
  margin-bottom: 8px;
  border-left: 3px solid var(--yellow);
}

.revision-item.resolved { border-left-color: var(--green); opacity: 0.6; }
.revision-section-tag { font-size: 11px; color: var(--accent-light); font-weight: 600; }
.revision-content { font-size: 14px; margin-top: 4px; }
.revision-status { font-size: 12px; color: var(--text-dim); margin-top: 4px; }

/* Legend */
.legend {
  display: flex;
  gap: 20px;
  margin-bottom: 20px;
}

.legend-item {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 13px;
  color: var(--text-dim);
}

.legend-dot {
  width: 10px; height: 10px;
  border-radius: 3px;
}

.legend-dot.shoot { background: var(--orange); }
.legend-dot.upload { background: var(--green); }
.legend-dot.draft { background: var(--accent); }

/* Toast */
.toast {
  position: fixed;
  bottom: 32px;
  right: 32px;
  background: var(--green);
  color: white;
  padding: 14px 24px;
  border-radius: 10px;
  font-size: 14px;
  font-weight: 600;
  z-index: 300;
  transform: translateY(100px);
  opacity: 0;
  transition: all 0.3s;
}

.toast.show { transform: translateY(0); opacity: 1; }

/* Responsive */
@media (max-width: 768px) {
  .header { padding: 16px; flex-direction: column; gap: 12px; }
  .main { padding: 16px; }
  .cal-day { min-height: 80px; padding: 4px; }
  .cal-event { font-size: 10px; padding: 2px 4px; }
  .detail-panel { width: 100%; }
  .detail-body { padding: 16px; }
  .proposal-card { padding: 16px; }
}
</style>
</head>
<body>

<!-- Auth Screen -->
<div class="auth-screen" id="authScreen">
  <div class="auth-box">
    <h1>아는언니 세령</h1>
    <p>기획 포털에 접속합니다</p>
    <input type="password" class="auth-input" id="authPassword" placeholder="접속 코드 입력" onkeyup="if(event.key==='Enter')doAuth()">
    <button class="auth-btn" onclick="doAuth()">접속</button>
    <p class="auth-error" id="authError">접속 코드가 올바르지 않습니다</p>
  </div>
</div>

<!-- Main App -->
<div class="app" id="app">
  <div class="header">
    <div class="header-left">
      <h1>아는언니 세령</h1>
      <span class="channel-badge">기획 포털</span>
    </div>
    <div class="header-right">
      <a href="./strategy.html" style="padding:8px 16px;background:var(--accent);color:white;border-radius:8px;text-decoration:none;font-size:13px;font-weight:600;margin-right:12px">전략 보고서</a>
      <div class="view-toggle">
        <button class="view-btn active" onclick="switchView('calendar')" id="btnCal">달력</button>
        <button class="view-btn" onclick="switchView('list')" id="btnList">목록</button>
      </div>
    </div>
  </div>

  <div class="main">
    <!-- Calendar View -->
    <div id="calendarView">
      <div class="cal-nav">
        <button class="cal-nav-btn" onclick="navMonth(-1)">&lt;</button>
        <h2 id="calTitle">2026년 4월</h2>
        <button class="cal-nav-btn" onclick="navMonth(1)">&gt;</button>
      </div>
      <div class="legend">
        <div class="legend-item"><div class="legend-dot shoot"></div> 촬영일</div>
        <div class="legend-item"><div class="legend-dot upload"></div> 업로드일</div>
        <div class="legend-item"><div class="legend-dot draft"></div> 기획서</div>
      </div>
      <div class="calendar-grid" id="calGrid"></div>
    </div>

    <!-- List View -->
    <div id="listView" style="display:none">
      <div class="proposal-list" id="proposalList"></div>
    </div>
  </div>
</div>

<!-- Detail Panel -->
<div class="detail-overlay" id="detailOverlay" onclick="if(event.target===this)closeDetail()">
  <div class="detail-panel" id="detailPanel"></div>
</div>

<!-- Comment Modal -->
<div class="modal-overlay" id="commentModal">
  <div class="modal">
    <h3 id="modalTitle">코멘트 작성</h3>
    <p style="font-size:13px;color:var(--text-dim);margin-bottom:12px" id="modalSection"></p>
    <textarea id="modalText" placeholder="의견을 작성해주세요..."></textarea>
    <div class="modal-actions">
      <button class="modal-btn cancel" onclick="closeModal()">취소</button>
      <button class="modal-btn submit" onclick="submitModal()">전송</button>
    </div>
  </div>
</div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<script>
// === CONFIG ===
const SUPABASE_URL = 'https://jiaezaanwjbbymeipkyt.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImppYWV6YWFud2piYnltZWlwa3l0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzQzMzQyODksImV4cCI6MjA4OTkxMDI4OX0.w04i6VWoacf5Ok3NMCyCuk-TaPrYkYZHLAcKs_asxGc';
const ACCESS_CODE = 'selyeong2026';

const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

let proposals = [];
let currentMonth = new Date(2026, 3, 1); // April 2026
let currentProposal = null;
let modalMode = null; // 'comment' or 'revision'
let modalSection = null;

// === AUTH ===
function doAuth() {
  const pw = document.getElementById('authPassword').value;
  if (pw === ACCESS_CODE) {
    document.getElementById('authScreen').style.display = 'none';
    document.getElementById('app').style.display = 'block';
    sessionStorage.setItem('portal_auth', '1');
    loadData();
  } else {
    document.getElementById('authError').style.display = 'block';
  }
}

if (sessionStorage.getItem('portal_auth') === '1') {
  document.getElementById('authScreen').style.display = 'none';
  document.getElementById('app').style.display = 'block';
  loadData();
}

// === DATA ===
async function loadData() {
  const { data, error } = await sb.from('proposals')
    .select('*')
    .eq('channel_name', '아는언니세령')
    .order('episode_number', { ascending: true });

  if (data) proposals = data;
  renderCalendar();
  renderList();
}

// === VIEWS ===
function switchView(v) {
  document.getElementById('calendarView').style.display = v === 'calendar' ? 'block' : 'none';
  document.getElementById('listView').style.display = v === 'list' ? 'block' : 'none';
  document.getElementById('btnCal').classList.toggle('active', v === 'calendar');
  document.getElementById('btnList').classList.toggle('active', v === 'list');
}

// === CALENDAR ===
function navMonth(d) {
  currentMonth = new Date(currentMonth.getFullYear(), currentMonth.getMonth() + d, 1);
  renderCalendar();
}

function renderCalendar() {
  const year = currentMonth.getFullYear();
  const month = currentMonth.getMonth();
  document.getElementById('calTitle').textContent = `${year}년 ${month + 1}월`;

  const firstDay = new Date(year, month, 1).getDay();
  const daysInMonth = new Date(year, month + 1, 0).getDate();
  const today = new Date();

  let html = '';
  ['일','월','화','수','목','금','토'].forEach(d => {
    html += `<div class="cal-header">${d}</div>`;
  });

  for (let i = 0; i < firstDay; i++) html += '<div class="cal-day empty"></div>';

  for (let d = 1; d <= daysInMonth; d++) {
    const dateStr = `${year}-${String(month+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const isToday = today.getFullYear() === year && today.getMonth() === month && today.getDate() === d;

    let events = '';
    proposals.forEach(p => {
      if (p.shooting_date === dateStr) {
        events += `<div class="cal-event shoot" onclick="openDetail('${p.id}')">EP${String(p.episode_number).padStart(2,'0')} 촬영</div>`;
      }
      if (p.upload_date === dateStr) {
        events += `<div class="cal-event upload" onclick="openDetail('${p.id}')">EP${String(p.episode_number).padStart(2,'0')} 업로드</div>`;
      }
    });

    html += `<div class="cal-day${isToday ? ' today' : ''}">
      <div class="cal-date${isToday ? ' today-num' : ''}">${d}</div>
      ${events}
    </div>`;
  }

  document.getElementById('calGrid').innerHTML = html;
}

// === LIST ===
function renderList() {
  const list = document.getElementById('proposalList');
  if (proposals.length === 0) {
    list.innerHTML = '<p style="text-align:center;color:var(--text-dim);padding:60px">아직 등록된 기획서가 없습니다</p>';
    return;
  }

  list.innerHTML = proposals.map(p => {
    const statusMap = {
      draft: ['초안', 'draft'],
      review: ['검토중', 'review'],
      approved: ['승인', 'approved'],
      shooting: ['촬영예정', 'shooting']
    };
    const [label, cls] = statusMap[p.status] || ['초안', 'draft'];

    return `<div class="proposal-card" onclick="openDetail('${p.id}')">
      <div class="ep-badge">EP${String(p.episode_number).padStart(2,'0')}</div>
      <div class="proposal-info">
        <h3>${p.title}</h3>
        <div class="proposal-meta">
          <span>v${p.version}</span>
          ${p.shooting_date ? `<span>${p.shooting_date} 촬영</span>` : ''}
          ${p.upload_date ? `<span>${p.upload_date} 업로드</span>` : ''}
          ${p.verification_score ? `<span>검증 ${p.verification_score}점</span>` : ''}
          <span>${p.target_duration || ''}</span>
        </div>
      </div>
      <span class="status-badge ${cls}">${label}</span>
    </div>`;
  }).join('');
}

// === DETAIL ===
async function openDetail(id) {
  currentProposal = proposals.find(p => p.id === id);
  if (!currentProposal) return;

  // Load comments & revisions
  const [commentsRes, revisionsRes] = await Promise.all([
    sb.from('proposal_comments').select('*').eq('proposal_id', id).order('created_at', { ascending: true }),
    sb.from('revision_requests').select('*').eq('proposal_id', id).order('created_at', { ascending: true })
  ]);

  const comments = commentsRes.data || [];
  const revisions = revisionsRes.data || [];
  const p = currentProposal;

  // Parse content into sections
  const sections = parseContentSections(p.content_md);
  const evidence = p.data_evidence || {};

  let html = `
    <div class="detail-header">
      <div>
        <span class="ep-badge" style="display:inline-flex;width:auto;padding:6px 14px;font-size:13px">EP${String(p.episode_number).padStart(2,'0')}</span>
        <span style="font-size:18px;font-weight:700;margin-left:12px">${p.title}</span>
      </div>
      <button class="detail-close" onclick="closeDetail()">&times;</button>
    </div>
    <div class="detail-body">
      <div class="detail-meta">
        <div class="meta-item"><div class="meta-label">상태</div><div class="meta-value">${{draft:'초안',review:'검토중',approved:'승인완료',shooting:'촬영예정'}[p.status] || p.status}</div></div>
        <div class="meta-item"><div class="meta-label">버전</div><div class="meta-value">v${p.version}</div></div>
        <div class="meta-item"><div class="meta-label">촬영일</div><div class="meta-value">${p.shooting_date || '미정'}</div></div>
        <div class="meta-item"><div class="meta-label">업로드일</div><div class="meta-value">${p.upload_date || '미정'}</div></div>
        <div class="meta-item"><div class="meta-label">러닝타임</div><div class="meta-value">${p.target_duration || '미정'}</div></div>
        ${p.verification_score ? `<div class="meta-item"><div class="meta-label">검증 점수</div><div class="meta-value">${p.verification_score}/100 ${p.verification_status || ''}</div></div>` : ''}
      </div>`;

  // Data Evidence
  if (evidence.trends && evidence.trends.length > 0) {
    html += `<div class="evidence-section">
      <h3>데이터 근거</h3>
      ${evidence.trends.map(t => `
        <div class="evidence-item">
          <span class="evidence-signal">${t.signal}</span>
          <span class="evidence-value">${t.value}</span>
        </div>
      `).join('')}
    </div>`;
  }

  // Revision Requests
  if (revisions.length > 0) {
    html += `<div class="revisions-panel">
      <h3 style="font-size:14px;margin-bottom:12px">수정 요청 (${revisions.filter(r => r.status === 'pending').length}건 대기)</h3>
      ${revisions.map(r => `
        <div class="revision-item ${r.status === 'resolved' ? 'resolved' : ''}">
          <div class="revision-section-tag">${r.section || '전체'}</div>
          <div class="revision-content">${r.request_content}</div>
          <div class="revision-status">${r.status === 'pending' ? '대기중' : '반영완료'} · ${timeAgo(r.created_at)}</div>
        </div>
      `).join('')}
    </div>`;
  }

  // Content Sections
  sections.forEach((sec, i) => {
    const secComments = comments.filter(c => c.section === sec.title);
    html += `
      <div class="content-section">
        <div class="content-section-header">
          <h3>${sec.title}</h3>
          <div class="section-actions">
            <button class="action-btn" onclick="openCommentModal('${sec.title}')">코멘트</button>
            <button class="action-btn revision" onclick="openRevisionModal('${sec.title}')">수정 요청</button>
          </div>
        </div>
        <div class="content-md">${marked.parse(sec.content)}</div>
        ${secComments.length > 0 ? `
          <div class="comments-list">
            ${secComments.map(c => `
              <div class="comment-item">
                <div class="comment-header">
                  <span class="comment-author">${c.author}</span>
                  <span>${timeAgo(c.created_at)}</span>
                </div>
                <div class="comment-content">${c.content}</div>
              </div>
            `).join('')}
          </div>
        ` : ''}
      </div>`;
  });

  html += '</div>';
  document.getElementById('detailPanel').innerHTML = html;
  document.getElementById('detailOverlay').classList.add('open');
}

function closeDetail() {
  document.getElementById('detailOverlay').classList.remove('open');
}

// === SECTIONS PARSER ===
function parseContentSections(md) {
  if (!md) return [{ title: '전체 내용', content: '(내용 없음)' }];

  const lines = md.split('\n');
  const sections = [];
  let current = null;

  lines.forEach(line => {
    if (line.startsWith('## ')) {
      if (current) sections.push(current);
      current = { title: line.replace('## ', '').trim(), content: '' };
    } else if (current) {
      current.content += line + '\n';
    }
  });

  if (current) sections.push(current);
  if (sections.length === 0) sections.push({ title: '전체 내용', content: md });

  return sections;
}

// === MODALS ===
function openCommentModal(section) {
  modalMode = 'comment';
  modalSection = section;
  document.getElementById('modalTitle').textContent = '코멘트 작성';
  document.getElementById('modalSection').textContent = `섹션: ${section}`;
  document.getElementById('modalText').value = '';
  document.getElementById('commentModal').classList.add('open');
}

function openRevisionModal(section) {
  modalMode = 'revision';
  modalSection = section;
  document.getElementById('modalTitle').textContent = '수정 요청';
  document.getElementById('modalSection').textContent = `섹션: ${section}`;
  document.getElementById('modalText').value = '';
  document.getElementById('commentModal').classList.add('open');
}

function closeModal() {
  document.getElementById('commentModal').classList.remove('open');
}

async function submitModal() {
  const text = document.getElementById('modalText').value.trim();
  if (!text || !currentProposal) return;

  if (modalMode === 'comment') {
    await sb.from('proposal_comments').insert({
      proposal_id: currentProposal.id,
      section: modalSection,
      author: 'client',
      content: text
    });
    showToast('코멘트가 등록되었습니다');
  } else {
    await sb.from('revision_requests').insert({
      proposal_id: currentProposal.id,
      section: modalSection,
      request_content: text,
      requested_by: 'client'
    });
    showToast('수정 요청이 전송되었습니다');
  }

  closeModal();
  openDetail(currentProposal.id);
}

// === UTILS ===
function timeAgo(dateStr) {
  const diff = Date.now() - new Date(dateStr).getTime();
  const mins = Math.floor(diff / 60000);
  if (mins < 60) return `${mins}분 전`;
  const hours = Math.floor(mins / 60);
  if (hours < 24) return `${hours}시간 전`;
  const days = Math.floor(hours / 24);
  return `${days}일 전`;
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 3000);
}

// Keyboard
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') {
    if (document.getElementById('commentModal').classList.contains('open')) closeModal();
    else closeDetail();
  }
});
</script>
