<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=5.0">
<meta name="theme-color" content="#0064ff">
<title>EP.05 촬영 질문지 — 조건 다 맞는 이상형이랑 결혼했습니다. 3년 후 이혼했습니다.</title>
<style>
:root{--bg:#f5f6f9;--card:#fff;--border:#e4e6ec;--border2:#eef0f5;--text:#111827;--text2:#6b7280;--accent:#0064ff;--accent-l:#e8f1ff;--done:#16a34a;--done-bg:#dcfce7;--memo:#fffbeb;--memo-b:#f59e0b;--ban:#fef2f2;--ban-b:#ef4444;--hh:58px;--th:50px}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans KR','Apple SD Gothic Neo',sans-serif;background:var(--bg);color:var(--text);line-height:1.6;padding-bottom:80px;font-size:15px}
.hd{position:fixed;top:0;left:0;right:0;height:var(--hh);background:var(--card);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 16px;gap:10px;z-index:100;box-shadow:0 1px 3px rgba(0,0,0,.04)}
.hd-l{flex:1;min-width:0}
.hd-ep{font-size:10px;font-weight:700;color:var(--accent);letter-spacing:.5px}
.hd-t{font-size:14px;font-weight:700;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hd-r{display:flex;align-items:center;gap:8px;flex-shrink:0}
.prog-lbl{font-size:11px;font-weight:700;color:var(--text2);padding:6px 10px;background:var(--accent-l);border-radius:8px;min-width:58px;text-align:center}
.prog-lbl strong{color:var(--accent);font-size:13px}
.btn{font-size:11px;font-weight:600;color:var(--text2);background:transparent;border:1px solid var(--border);border-radius:8px;padding:6px 10px;cursor:pointer;font-family:inherit}
.btn:active{background:var(--border2)}
.tabs{position:fixed;top:var(--hh);left:0;right:0;height:var(--th);background:var(--card);border-bottom:1px solid var(--border);display:flex;overflow-x:auto;z-index:99;scrollbar-width:none;padding:0 8px;gap:2px}
.tabs::-webkit-scrollbar{display:none}
.tab{display:flex;align-items:center;padding:0 14px;text-decoration:none;color:var(--text2);font-size:12px;font-weight:600;white-space:nowrap;border-bottom:3px solid transparent;flex-shrink:0;transition:.15s}
.tab.active{color:var(--accent);border-bottom-color:var(--accent)}
.main{margin-top:calc(var(--hh) + var(--th));padding:20px 14px 64px;max-width:780px;margin-left:auto;margin-right:auto}
.sec{margin-bottom:40px;scroll-margin-top:calc(var(--hh) + var(--th) + 10px)}
.sec-hd{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:8px}
.sec-hd-l{flex:1;min-width:0}
.sec-t{font-size:19px;font-weight:800;line-height:1.3;word-break:keep-all}
.sec-time{display:inline-block;font-size:11px;font-weight:700;color:var(--accent);background:var(--accent-l);padding:3px 9px;border-radius:6px;margin-top:5px}
.sec-stage{font-size:12px;color:var(--text2);margin-top:5px}
.sec-cnt{font-size:11px;font-weight:700;color:var(--text2);background:var(--border2);padding:5px 10px;border-radius:20px;flex-shrink:0;white-space:nowrap}
.sec-cnt.done{color:var(--done);background:var(--done-bg)}
.memo{background:var(--memo);border-left:4px solid var(--memo-b);border-radius:0 10px 10px 0;padding:13px 16px;margin:14px 0 18px;font-size:13px}
.memo-r{display:flex;gap:10px;margin:5px 0}
.memo-r:first-child{margin-top:0}
.memo-r:last-child{margin-bottom:0}
.memo-k{flex-shrink:0;font-weight:700;color:#92400e;min-width:42px;font-size:12px}
.memo-v{color:#451a03;line-height:1.55;word-break:keep-all}
.ban-box{background:var(--ban);border-left:4px solid var(--ban-b);border-radius:0 10px 10px 0;padding:13px 16px;margin:14px 0 18px;font-size:13px}
.ban-box .memo-k{color:#991b1b}
.ban-box .memo-v{color:#7f1d1d}
.q{display:flex;align-items:flex-start;gap:12px;padding:13px 14px;background:var(--card);border:1px solid var(--border);border-radius:12px;margin-bottom:8px;cursor:pointer;transition:.15s;user-select:none}
.q:active{transform:scale(.99)}
.q.on{background:var(--done-bg);border-color:var(--done)}
.q.on .q-q{color:var(--text2);text-decoration:line-through}
.q.on .q-n{color:var(--done);background:#fff}
.ck{width:26px;height:26px;border:2px solid var(--border);border-radius:7px;flex-shrink:0;position:relative;background:#fff;transition:.15s;margin-top:1px}
.q.on .ck{background:var(--done);border-color:var(--done)}
.q.on .ck::after{content:'';position:absolute;left:7px;top:3px;width:7px;height:13px;border:solid #fff;border-width:0 3px 3px 0;transform:rotate(45deg)}
.q-body{flex:1;min-width:0}
.q-top{display:flex;align-items:center;gap:6px;margin-bottom:4px;flex-wrap:wrap}
.q-n{font-size:11px;font-weight:800;color:var(--text2);background:var(--border2);padding:2px 8px;border-radius:6px;flex-shrink:0}
.q-tag{font-size:10px;font-weight:700;padding:2px 8px;border-radius:5px;flex-shrink:0;letter-spacing:.3px;color:#fff}
.tg-PEAK{background:#ef4444}
.tg-PD{background:#06b6d4}
.tg-TREND{background:#7c3aed}
.q-q{font-size:15px;line-height:1.55;color:var(--text);word-break:keep-all}
.q-hint{font-size:12px;color:var(--text2);margin-top:4px;line-height:1.5;word-break:keep-all;font-style:italic}
@media(min-width:640px){body{font-size:16px}.hd{padding:0 24px}.hd-t{font-size:16px}.main{padding:28px 24px 64px}.sec-t{font-size:22px}.q{padding:16px 18px}.q-q{font-size:15.5px}}
@media(max-width:400px){.hd{padding:0 12px;gap:8px}.hd-t{font-size:12px}.prog-lbl{padding:5px 8px;min-width:52px}.prog-lbl strong{font-size:12px}.btn{padding:5px 7px}.tab{padding:0 10px;font-size:11px}.main{padding:16px 12px 48px}.sec-t{font-size:17px}.q{padding:12px 12px;gap:10px}.q-q{font-size:14px}.memo{padding:12px 14px;font-size:12px}}
@media print{.hd,.tabs{display:none!important}.main{margin:0;padding:20px;max-width:100%}.q{break-inside:avoid;background:#fff!important}.sec{break-inside:auto}.ck{display:none}}
</style>
</head>
<body>
<header class="hd">
<div class="hd-l">
<div class="hd-ep">EP.05 · 촬영 질문지 v2</div>
<div class="hd-t">이상형이랑 결혼했습니다. 3년 후 이혼했습니다.</div>
</div>
<div class="hd-r">
<div class="prog-lbl"><strong id="pn">0</strong> / <span id="pt">0</span></div>
<button class="btn" id="reset">리셋</button>
</div>
</header>
<nav class="tabs" id="tabs"></nav>
<main class="main" id="main"></main>
<script>
const D=[
{id:1,title:"킥",time:"0:00~0:30",stage:"오프닝",
memo:[
{k:"설정",v:"스튜디오. 인사 없이 바로 시작."},
{k:"톤",v:"또박또박. 카메라 정면."},
{k:"주의",v:"인사 절대 금지."}
],
qs:[
{n:1,tag:"PEAK",q:"오프닝 (인사 없이 바로 시작)"},
{n:2,tag:"PD",q:"진짜요? 조건 다 맞았는데 이혼이요?"}
]},

{id:2,title:"해부",time:"0:30~5:30",stage:"결정사 안에서 보면요",
memo:[
{k:"촬영",v:"이세령 정면 위주. 숫자마다 컷."},
{k:"PD패턴",v:"\"진짜요?\" + \"불공평하지 않아요?\""}
],
qs:[
{n:3,tag:null,q:"이혼 사유 1위가 뭐예요? 왜 이혼하는 거예요?"},
{n:4,tag:"TREND",q:"결정사는 매칭할 때 뭘 보는 거예요?"},
{n:5,tag:"PEAK",q:"그러면 이혼 사유랑 매칭 기준이 겹치는 게 있어요?"},
{n:6,tag:"PD",q:"그건 좀 불공평하지 않아요? 결정사가 어떻게 성격까지 봐요?"},
{n:7,tag:null,q:"성혼율은 어떻게 되는 거예요?"},
{n:8,tag:"PEAK",q:"그러면 성혼 후 이혼율은요?"}
]},

{id:3,title:"본인",time:"5:30~9:00",stage:"겪어봐야 아는 거예요",
memo:[
{k:"촬영",v:"감정 구간 클로즈업. 리테이크 최소화."},
{k:"PD패턴",v:"\"대표님은요?\""},
{k:"주의",v:"실제 사례 기반이면 가명 철저."}
],
qs:[
{n:9,tag:"PD",q:"대표님은요? 성혼시킨 분 중에 이혼하신 분이 있어요?"},
{n:10,tag:null,q:"어떤 케이스였어요?"},
{n:11,tag:"PEAK",q:"그런데 이혼했다고요? 왜요?"},
{n:12,tag:"TREND",q:"프로필이랑 실제가 많이 달랐어요?"}
]},

{id:4,title:"반전",time:"9:00~12:30",stage:"조건이 다가 아니에요",
memo:[
{k:"촬영",v:"핵심 장면 리테이크 금지. 첫 반응이 가장 진실."},
{k:"PD패턴",v:"\"그러면 어떡해요?\""}
],
qs:[
{n:13,tag:"PD",q:"그러면 어떡해요?"},
{n:14,tag:null,q:"연구 같은 게 있어요?"},
{n:15,tag:"PEAK",q:"결정사 대표로서 이걸 어떻게 받아들이세요?"},
{n:16,tag:null,q:"조건이 아예 중요하지 않다는 건 아니죠?"}
]},

{id:5,title:"아웃",time:"12:30~14:00",stage:"마무리",
memo:[
{k:"촬영",v:"대본 X. 자유롭게. 리테이크 금지."}
],
qs:[
{n:17,tag:null,q:"마무리 한마디"}
]}
];

const SK='ep05_checks_v2';
let checks=(()=>{try{return JSON.parse(localStorage.getItem(SK)||'{}')}catch(e){return {}}})();
const save=()=>localStorage.setItem(SK,JSON.stringify(checks));
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');

const tabsEl=document.getElementById('tabs');
const mainEl=document.getElementById('main');

D.forEach(loc=>{
 const a=document.createElement('a');
 a.className='tab';a.href='#sec-'+loc.id;a.dataset.id=loc.id;
 a.textContent=loc.title;
 tabsEl.appendChild(a);
});

let totalQ=0;
D.forEach(loc=>totalQ+=loc.qs.length);
document.getElementById('pt').textContent=totalQ;

D.forEach(loc=>{
 const sec=document.createElement('section');
 sec.className='sec';sec.id='sec-'+loc.id;
 const total=loc.qs.length;
 let h='<div class="sec-hd"><div class="sec-hd-l">'
  +'<div class="sec-t">['+esc(loc.title)+']</div>'
  +'<div><span class="sec-time">'+esc(loc.time)+'</span></div>'
  +'<div class="sec-stage">'+esc(loc.stage)+'</div>'
  +'</div>'
  +'<div class="sec-cnt" data-loc="'+loc.id+'">0 / '+total+'</div>'
  +'</div>';

 h+='<div class="memo">';
 loc.memo.forEach(m=>{
  h+='<div class="memo-r"><div class="memo-k">'+esc(m.k)+'</div><div class="memo-v">'+esc(m.v)+'</div></div>';
 });
 h+='</div>';

 loc.qs.forEach(q=>{
  const on=checks[q.n]?' on':'';
  h+='<div class="q'+on+'" data-n="'+q.n+'">'
   +'<div class="ck"></div>'
   +'<div class="q-body">'
   +'<div class="q-top"><span class="q-n">#'+q.n+'</span>'
   +(q.tag?'<span class="q-tag tg-'+q.tag+'">['+q.tag+']</span>':'')
   +'</div>'
   +'<div class="q-q">'+esc(q.q)+'</div>'
   +(q.hint?'<div class="q-hint">'+esc(q.hint)+'</div>':'')
   +'</div></div>';
 });
 sec.innerHTML=h;
 mainEl.appendChild(sec);
});

const extras=document.createElement('div');
extras.innerHTML=`
<div class="ban-box" style="margin-top:32px">
<div class="memo-r"><div class="memo-k" style="min-width:60px">절대금지</div><div class="memo-v">"안녕하세요" 인사 — 인사 없이 바로 시작</div></div>
<div class="memo-r"><div class="memo-k" style="min-width:60px">절대금지</div><div class="memo-v">"구독/좋아요" 멘트 — 영상 내 0회</div></div>
<div class="memo-r"><div class="memo-k" style="min-width:60px">절대금지</div><div class="memo-v">경쟁사 실명 — "메이저 결정사" "업계"로만</div></div>
<div class="memo-r"><div class="memo-k" style="min-width:60px">절대금지</div><div class="memo-v">특정 회원 실명/정보 — 가명 + 익명 처리</div></div>
<div class="memo-r"><div class="memo-k" style="min-width:60px">절대금지</div><div class="memo-v">"결정사는 사기다" 류의 표현 — 한계 인정이지 전면 부정 아님</div></div>
</div>
<div class="memo" style="margin-top:12px">
<div class="memo-r"><div class="memo-k" style="min-width:42px">주의</div><div class="memo-v">외부 관계 언급 X → 순수 개인 채널</div></div>
<div class="memo-r"><div class="memo-k" style="min-width:42px">주의</div><div class="memo-v">워터밤 / 황정우·이나영 사건 → 절대 금지</div></div>
<div class="memo-r"><div class="memo-k" style="min-width:42px">주의</div><div class="memo-v">본인 결정사 가격 직접 공개 → "업계 평균"으로만</div></div>
<div class="memo-r"><div class="memo-k" style="min-width:42px">주의</div><div class="memo-v">특정 성별 비하 → 중립. "남자가 나빠" "여자가 문제" X</div></div>
<div class="memo-r"><div class="memo-k" style="min-width:42px">주의</div><div class="memo-v">이혼을 부정적으로만 프레이밍 → "잘못된 결합을 끝내는 용기"도 존중</div></div>
</div>`;
mainEl.appendChild(extras);

function updateCounts(){
 let total=0,done=0;
 D.forEach(loc=>{
  let ld=0,lt=loc.qs.length;
  loc.qs.forEach(q=>{
   total++;
   if(checks[q.n]){ld++;done++}
  });
  const el=document.querySelector('[data-loc="'+loc.id+'"]');
  if(el){el.textContent=ld+' / '+lt;el.classList.toggle('done',ld===lt&&lt>0)}
 });
 document.getElementById('pn').textContent=done;
}

mainEl.addEventListener('click',e=>{
 const q=e.target.closest('.q');
 if(!q)return;
 const n=q.dataset.n;
 if(checks[n]){delete checks[n];q.classList.remove('on')}
 else{checks[n]=1;q.classList.add('on')}
 save();updateCounts();
});

document.getElementById('reset').addEventListener('click',()=>{
 if(!confirm('체크 상태를 모두 리셋할까요?'))return;
 checks={};save();
 document.querySelectorAll('.q.on').forEach(q=>q.classList.remove('on'));
 updateCounts();
});

const tabEls=tabsEl.querySelectorAll('.tab');
const secEls=document.querySelectorAll('.sec');
function updActive(){
 const off=130;let c=0;
 secEls.forEach((s,i)=>{if(s.getBoundingClientRect().top<=off)c=i});
 tabEls.forEach((t,i)=>t.classList.toggle('active',i===c));
 const a=tabsEl.querySelector('.tab.active');
 if(a){const l=a.offsetLeft,w=a.offsetWidth,bw=tabsEl.offsetWidth;tabsEl.scrollTo({left:l-bw/2+w/2,behavior:'smooth'})}
}
window.addEventListener('scroll',updActive,{passive:true});
tabEls.forEach(t=>t.addEventListener('click',e=>{
 e.preventDefault();
 document.getElementById('sec-'+t.dataset.id).scrollIntoView({behavior:'smooth'});
}));

updateCounts();
updActive();
</script>
</body>
</html>
