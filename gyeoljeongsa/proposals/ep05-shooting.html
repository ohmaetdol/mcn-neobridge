<style>
:root{--bg:#f5f6f9;--card:#fff;--border:#e4e6ec;--border2:#eef0f5;--text:#111827;--text2:#6b7280;--accent:#0064ff;--accent-l:#e8f1ff;--done:#16a34a;--done-bg:#dcfce7;--memo:#fffbeb;--memo-b:#f59e0b;--ban:#fef2f2;--ban-b:#ef4444;--hh:58px;--th:50px}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans KR','Apple SD Gothic Neo',sans-serif;background:var(--bg);color:var(--text);line-height:1.6;padding-bottom:80px;font-size:15px}
.hd{position:fixed;top:0;left:0;right:0;height:var(--hh);background:var(--card);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 16px;gap:10px;z-index:100;box-shadow:0 1px 3px rgba(0,0,0,.04)}
.hd-l{flex:1;min-width:0}

.hd-r{display:flex;align-items:center;gap:8px;flex-shrink:0}
.prog-lbl{font-size:11px;font-weight:700;color:var(--text2);padding:6px 10px;background:var(--accent-l);border-radius:8px;min-width:58px;text-align:center}

.main{margin-top:calc(var(--hh) + var(--th));padding:20px 14px 64px;max-width:780px;margin-left:auto;margin-right:auto}

.memo-r:first-child{margin-top:0}
.memo-r:last-child{margin-bottom:0}

.ban-box{background:var(--ban);border-left:4px solid var(--ban-b);border-radius:0 10px 10px 0;padding:13px 16px;margin:14px 0 18px;font-size:13px}
.ban-box .memo-k{color:#991b1b}
.ban-box .memo-v{color:#7f1d1d}
.q{display:flex;align-items:flex-start;gap:12px;padding:13px 14px;background:var(--card);border:1px solid var(--border);border-radius:12px;margin-bottom:8px;cursor:pointer;transition:.15s;user-select:none}
.q:active{transform:scale(.99)}
.q.on{background:var(--done-bg);border-color:var(--done)}

.q.on .q-n{color:var(--done);background:#fff}
.ck{width:26px;height:26px;border:2px solid var(--border);border-radius:7px;flex-shrink:0;position:relative;background:#fff;transition:.15s;margin-top:1px}

.q.on .ck::after{content:'';position:absolute;left:7px;top:3px;width:7px;height:13px;border:solid #fff;border-width:0 3px 3px 0;transform:rotate(45deg)}

.q-top{display:flex;align-items:center;gap:6px;margin-bottom:4px;flex-wrap:wrap}

.q-tag{font-size:10px;font-weight:700;padding:2px 8px;border-radius:5px;flex-shrink:0;letter-spacing:.3px;color:#fff}
.tg-PEAK{background:#ef4444}
.tg-TONE{background:#06b6d4}
.tg-DATA{background:#7c3aed}
.tg-HOLD{background:#f59e0b}
.q-q{font-size:15px;line-height:1.55;color:var(--text);word-break:keep-all}
.q-hint{font-size:12px;color:var(--text2);margin-top:4px;line-height:1.5;word-break:keep-all;font-style:italic}
@media(min-width:640px){body{font-size:16px}.hd{padding:0 24px}.hd-t{font-size:16px}.main{padding:28px 24px 64px}.sec-t{font-size:22px}.q{padding:16px 18px}.q-q{font-size:15.5px}}
@media(max-width:400px){.hd{padding:0 12px;gap:8px}.hd-t{font-size:12px}.prog-lbl{padding:5px 8px;min-width:52px}.prog-lbl strong{font-size:12px}.btn{padding:5px 7px}.tab{padding:0 10px;font-size:11px}.main{padding:16px 12px 48px}.sec-t{font-size:17px}.q{padding:12px 12px;gap:10px}.q-q{font-size:14px}.memo{padding:12px 14px;font-size:12px}}
@media print{.hd,.tabs{display:none!important}.main{margin:0;padding:20px;max-width:100%}.q{break-inside:avoid;background:#fff!important}.sec{break-inside:auto}.ck{display:none}}

{id:1,title:"1막 킥",time:"0:00~2:30",loc:"스튜디오",stage:"숫자 나열 + '이혼했습니다' 반전",
memo:[
{k:"설정",v:"스튜디오 정면 좌석. 인사 없이 '연봉 1억 2천'부터 시작."},
{k:"톤",v:"또박또박, 카메라 정면, 담담. 숫자 하나마다 끊어서. '이혼했습니다'에서 톤 살짝 낮추기."},
{k:"촬영",v:"숫자마다 컷 전환 가능하도록 여유 있게. '한 박자 쉬기' 구간 편집 자막 삽입점."},
{k:"주의",v:"인사 절대 금지. '연봉 1억 2천'이 첫 마디."}
],
qs:[
{n:1,tag:"PEAK",q:"\"연봉 1억 2천. 키 182. 서울대 졸업. 대기업 과장. 이 남자랑 결혼했습니다.\"",hint:"숫자 하나마다 끊어서. 편집 자막으로 각 숫자 강조. 마지막 '결혼했습니다'까지 시청자가 '완벽하다'고 느끼게."},
{n:2,tag:"PEAK",q:"(한 박자 쉬고) \"3년 후 이혼했습니다.\"",hint:"반전. 톤 살짝 낮추기. 편집: 정적 1.5초 + 자막 '3년 후 이혼' 빨간색. 이 한 줄이 오프닝의 전부."},
{n:3,tag:null,q:"\"성혼 축하 문자는 보내는데, 이혼 위로 문자는 안 보냅니다.\"",hint:"캐치프레이즈. 편집 자막 강조. 이 문장이 영상 전체의 프레이밍."},
{n:4,tag:"TONE",q:"\"결정사 대표로서 이 이야기를 하는 게 맞는지 고민했어요. 그런데 안 하는 게 더 무책임하다고 생각했습니다.\"",hint:"진지하지만 무겁지 않게. '최초 공개' 느낌. 결의 표현."}
]},

{id:2,title:"2막 해부",time:"2:30~7:00",loc:"스튜디오",stage:"이혼 사유 vs 매칭 기준 비교 + 성혼율 + 이혼율 미추적",
memo:[
{k:"목표",v:"데이터 3연타: (1) 이혼 사유 vs 매칭 기준 비교표 (2) 성혼율 41.7% vs 5% (3) 이혼율 추적 0곳"},
{k:"톤",v:"교수 톤. 데이터 읽을 때 또박또박. 핵심 숫자 앞 한 박자 쉬기."},
{k:"촬영",v:"비교표는 편집 그래픽으로 삽입. 이세령 정면 위주. 숫자마다 컷."},
{k:"편집",v:"'겹치는 게 하나도 없습니다' = 그래픽 비교표 풀스크린 2초. '5% 이하' = 빨간 숫자 자막."}
],
qs:[
{n:5,tag:"DATA",q:"\"이혼 사유 1위가 뭔지 아십니까? 통계청 데이터입니다. '성격차이.' 45.2%. 20년째 1위입니다.\"",hint:"'성격차이'와 '45.2%'에서 한 박자 쉬기. 편집 자막으로 통계청 출처 표시."},
{n:6,tag:"DATA",q:"\"결정사가 매칭할 때 보는 항목: 학벌, 연봉, 키, 나이, 집안, 직업, 외모 등급.\"",hint:"항목 나열. 편집: 왼쪽에 '매칭 기준', 오른쪽에 '이혼 사유' 비교 그래픽."},
{n:7,tag:"PEAK",q:"\"이 두 개를 나란히 놓으면요. (한 박자) 겹치는 게 하나도 없습니다.\"",hint:"위기장치 #1. 비교 그래픽 풀스크린. '0개' 강조. 이 장면이 2막의 핵심."},
{n:8,tag:null,q:"\"프로필에 '성격: 온화' 이렇게 적혀 있죠. 본인이 적는 겁니다. 검증? 없습니다.\"",hint:"쓴웃음 가능. '검증? 없습니다'에서 정면 응시."},
{n:9,tag:"DATA",q:"\"결정사 성혼율. 듀오 공식 발표: 41.7%. 블라인드 추산: 5% 이하.\"",hint:"'41.7%' vs '5%' 편집 자막으로 대비. 충격 효과."},
{n:10,tag:"PEAK",q:"\"성혼 후 이혼율. 이 숫자를 추적하는 결정사는요. (한 박자) 단 한 곳도 없습니다.\"",hint:"위기장치 #2. '단 한 곳도 없습니다' = 핵심 반전. 정면 응시. 편집: 정적 2초."},
{n:11,tag:"TONE",q:"\"왜냐면 추적하면 안 되거든요. 그 숫자가 나오면 이 사업을 못 합니다.\"",hint:"쓴웃음. 업계 금기 폭로 순간. 톤: 담담하지만 무게감."},
{n:12,tag:null,q:"\"저도 추적 안 했어요. 솔직히. 그런데 연락이 옵니다. '대표님, 이혼합니다.'\"",hint:"'이혼합니다' 연락 받는 순간. 표정 -- 담담하지만 무거움. 리테이크 가능하나 첫 테이크 우선."}
]},

{id:3,title:"3막 실화",time:"7:00~10:00",loc:"스튜디오",stage:"민지/준혁 A등급 커플 이혼 사례",
memo:[
{k:"목표",v:"A등급 완벽 커플의 결혼 → 이혼 실화. 프로필 vs 실제 생활의 갭."},
{k:"톤",v:"스토리텔링. 안타까운 표정. '혼자인 느낌'에서 목소리 낮추기."},
{k:"촬영",v:"감정 구간 리테이크 최소화. 첫 테이크가 가장 진실. 클로즈업 위주."},
{k:"주의",v:"실제 회원 사례 기반이면 가명 철저. 아니면 대본대로 진행. '민지/준혁'은 가명임을 명시."}
],
qs:[
{n:13,tag:null,q:"\"민지 씨, 33살. 준혁 씨, 36살. 둘 다 A등급이었어요.\"",hint:"프로필 소개. 편집: A등급 프로필 카드 그래픽 삽입."},
{n:14,tag:null,q:"\"민지 씨 -- 약사, 외모 상위. 준혁 씨 -- 대기업, 연봉 1억 초반, 182, SKY. 프로필만 보면 완벽했어요.\"",hint:"조건 나열. 1막의 숫자 패턴 반복. '완벽했어요'에서 빌드업."},
{n:15,tag:null,q:"\"첫 만남에서 서로 호감. 6개월 만에 결혼. 저는 '역시 A등급은 다르다'고 생각했어요.\"",hint:"'축하 문자 보냈죠' -- 1막 캐치프레이즈 콜백. 가벼운 톤."},
{n:16,tag:"PEAK",q:"\"1년 반 후에 민지 씨한테 연락이 왔어요. '대표님, 이혼 절차 밟고 있어요.'\"",hint:"위기장치 #3. 반전. 편집: 정적 1.5초. 표정 클로즈업."},
{n:17,tag:null,q:"\"외도? 아니요. 폭력? 아니요. 경제적 문제? 아니요. '성격차이요.'\"",hint:"3연속 부정 후 '성격차이' -- 2막 데이터와 연결되는 순간."},
{n:18,tag:"TONE",q:"\"갈등이 생겼을 때 준혁 씨의 방식은 '침묵'. 하루, 이틀, 심하면 일주일. 말을 안 해요. 아예.\"",hint:"안타까운 표정. 천천히."},
{n:19,tag:null,q:"\"프로필에 '성격: 차분함'. 맞아요. 차분했어요. 너무 차분해서 대화가 없었던 거예요.\"",hint:"인지부조화. '차분함 = 침묵'이라는 반전. 쓴웃음 가능."},
{n:20,tag:"PEAK",q:"\"'프로필에 취미: 운동이라고 적혀 있었는데, 실제로는 매주 주말 혼자 골프장에 갔어요. 이 사람이 옆에 있는데 혼자인 느낌이었어요.'\"",hint:"민지 씨 인용. 캐치프레이즈. 목소리 낮추기. 편집: 자막 강조. 이 장면이 3막의 핵심."}
]},

{id:4,title:"4막 반전",time:"10:00~12:30",loc:"스튜디오",stage:"시스템 자기반성 + 하버드 연구",
memo:[
{k:"목표",v:"가장 진지한 구간. '사람이 아니라 조건을 매칭했다' 자기반성 + 학술 근거."},
{k:"톤",v:"4막 전체가 감정의 정점. '사람이 아니었습니다'에서 카메라 가까이, 목소리 낮추기."},
{k:"촬영",v:"핵심 장면(#24) 리테이크 금지. 첫 반응이 가장 진실. 클로즈업."},
{k:"편집",v:"Q01 등급표 장면 인서트 가능. '등급표에 없는 칸' 자막 그래픽."}
],
qs:[
{n:21,tag:"DATA",q:"\"2030세대 설문: 배우자 선택 기준 1위 '성격 및 가치관' 67%. 결정사에서 검증하는 방법은? 없습니다.\"",hint:"데이터 + 단정. '없습니다'에서 정면 응시."},
{n:22,tag:"DATA",q:"\"하버드 Eastwick 연구: 3년 반 추적. '이상형 조건을 높게 충족해도 이혼 확률은 낮아지지 않는다.'\"",hint:"학술 근거. 교수 톤. 편집: 논문 출처 자막."},
{n:23,tag:null,q:"\"키 크고, 돈 많고, 학벌 좋은 사람을 원했고, 실제로 그런 사람을 만났어요. 그래도 이혼합니다.\"",hint:"1막 숫자 나열 콜백. '그래도 이혼합니다' 단호하게."},

const SK='ep05_checks_v1';
let checks=(()=>{try{return JSON.parse(localStorage.getItem(SK)||'{}')}catch(e){return {}}})();
const save=()=>localStorage.setItem(SK,JSON.stringify(checks));
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');

const tabsEl=document.getElementById('tabs');
const mainEl=document.getElementById('main');

D.forEach(loc=>{
 const a=document.createElement('a');
 a.className='tab';a.href='#sec-'+loc.id;a.dataset.id=loc.id;
 a.textContent=loc.title;
 tabsEl.appendChild(a);
});

let totalQ=0;
D.forEach(loc=>totalQ+=loc.qs.length);
document.getElementById('pt').textContent=totalQ;

D.forEach(loc=>{
 const sec=document.createElement('section');
 sec.className='sec';sec.id='sec-'+loc.id;
 const total=loc.qs.length;
 let h='<div class="sec-hd"><div class="sec-hd-l">'
  +'<div class="sec-t">['+esc(loc.title)+']</div>'
  +'<div><span class="sec-time">'+esc(loc.time)+'</span>'
  +(loc.loc?'<span class="sec-loc">'+esc(loc.loc)+'</span>':'')
  +'</div>'
  +'<div class="sec-stage">'+esc(loc.stage)+'</div>'
  +'</div>'
  +'<div class="sec-cnt" data-loc="'+loc.id+'">0 / '+total+'</div>'
  +'</div>';

 h+='<div class="memo">';
 loc.memo.forEach(m=>{
  h+='<div class="memo-r"><div class="memo-k">'+esc(m.k)+'</div><div class="memo-v">'+esc(m.v)+'</div></div>';
 });
 h+='</div>';

 loc.qs.forEach(q=>{
  const on=checks[q.n]?' on':'';
  h+='<div class="q'+on+'" data-n="'+q.n+'">'
   +'<div class="ck"></div>'
   +'<div class="q-body">'
   +'<div class="q-top"><span class="q-n">#'+q.n+'</span>'
   +(q.tag?'<span class="q-tag tg-'+q.tag+'">['+q.tag+']</span>':'')
   +'</div>'
   +'<div class="q-q">'+esc(q.q)+'</div>'
   +(q.hint?'<div class="q-hint">'+esc(q.hint)+'</div>':'')
   +'</div></div>';
 });
 sec.innerHTML=h;
 mainEl.appendChild(sec);
});

const extras=document.createElement('div');
extras.innerHTML=`
<div class="ban-box" style="margin-top:32px">
<div class="memo-r"><div class="memo-k" style="min-width:60px">절대금지</div><div class="memo-v">"안녕하세요" 인사 -- "연봉 1억 2천"으로 바로 시작</div></div>
<div class="memo-r"><div class="memo-k" style="min-width:60px">절대금지</div><div class="memo-v">"구독/좋아요" 멘트 -- 영상 내 0회</div></div>
<div class="memo-r"><div class="memo-k" style="min-width:60px">절대금지</div><div class="memo-v">경쟁사 실명(듀오/가연/엔노블/제이노블) -- "메이저 결정사" "업계"로만</div></div>
<div class="memo-r"><div class="memo-k" style="min-width:60px">절대금지</div><div class="memo-v">특정 회원 실명/정보 -- 가명 + 익명 처리 철저</div></div>
<div class="memo-r"><div class="memo-k" style="min-width:60px">절대금지</div><div class="memo-v">"결정사는 사기다" 류 표현 -- 한계 인정이지 전면 부정 아님</div></div>
</div>
<div class="memo" style="margin-top:12px">
<div class="memo-r"><div class="memo-k" style="min-width:42px">주의</div><div class="memo-v">MCN/네오브릿지 관계 -- 순수 개인 채널</div></div>
<div class="memo-r"><div class="memo-k" style="min-width:42px">주의</div><div class="memo-v">본인 결정사 가격 직접 공개 -- "업계 평균"으로만</div></div>
<div class="memo-r"><div class="memo-k" style="min-width:42px">주의</div><div class="memo-v">특정 성별 비하 -- 중립. "남자가 나빠" "여자가 문제" X</div></div>
<div class="memo-r"><div class="memo-k" style="min-width:42px">주의</div><div class="memo-v">이혼을 부정적으로만 프레이밍 -- "잘못된 결합을 끝내는 용기"도 존중</div></div>
<div class="memo-r"><div class="memo-k" style="min-width:42px">주의</div><div class="memo-v">"우리 결정사는 다르다" 자기 홍보 -- 이 영상은 자기반성</div></div>
</div>`;
mainEl.appendChild(extras);

function updateCounts(){
 let total=0,done=0;
 D.forEach(loc=>{
  let ld=0,lt=loc.qs.length;
  loc.qs.forEach(q=>{
   total++;
   if(checks[q.n]){ld++;done++}
  });
  const el=document.querySelector('[data-loc="'+loc.id+'"]');
  if(el){el.textContent=ld+' / '+lt;el.classList.toggle('done',ld===lt&&lt>0)}
 });
 document.getElementById('pn').textContent=done;
}

mainEl.addEventListener('click',e=>{
 const q=e.target.closest('.q');
 if(!q)return;
 const n=q.dataset.n;
 if(checks[n]){delete checks[n];q.classList.remove('on')}
 else{checks[n]=1;q.classList.add('on')}
 save();updateCounts();
});

document.getElementById('reset').addEventListener('click',()=>{
 if(!confirm('체크 상태를 모두 리셋할까요?'))return;
 checks={};save();
 document.querySelectorAll('.q.on').forEach(q=>q.classList.remove('on'));
 updateCounts();
});

const tabEls=tabsEl.querySelectorAll('.tab');
const secEls=document.querySelectorAll('.sec');
function updActive(){
 const off=130;let c=0;
 secEls.forEach((s,i)=>{if(s.getBoundingClientRect().top<=off)c=i});
 tabEls.forEach((t,i)=>t.classList.toggle('active',i===c));
 const a=tabsEl.querySelector('.tab.active');
 if(a){const l=a.offsetLeft,w=a.offsetWidth,bw=tabsEl.offsetWidth;tabsEl.scrollTo({left:l-bw/2+w/2,behavior:'smooth'})}
}
window.addEventListener('scroll',updActive,{passive:true});
tabEls.forEach(t=>t.addEventListener('click',e=>{
 e.preventDefault();
 document.getElementById('sec-'+t.dataset.id).scrollIntoView({behavior:'smooth'});
}));

updateCounts();
updActive();
</script>
</body>
</html>
