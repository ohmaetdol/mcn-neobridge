## STEP 0. 제목 & 썸네일 설계

### 제목 공식 (3안)

| 안 | 제목 | 글자수 | 공식 | 컨셉 |
|---|------|-------|------|------|
| **A (메인)** | **결정사 대표가 본인 등급을 매겨봤습니다** | 18자 | 자학형 + 호기심갭 | question |
| B | 결정사 등급의 진실 [대표가 직접 공개] | 18자 | 폭로형 + 대괄호 | reveal |
| C | 탁재훈 1억, 이선민 24점… 결정사 등급 진짜 공개합니다 | 27자 | 트렌드형 + 숫자 | shock_number |

**A안 선택 근거:**
- "본인 등급을 매겨봤습니다" = **결정사 대표가 자기 등급을 공개한다** → 클릭 안 할 수가 없음
- "결정사 대표"인데 "본인 등급" = **위치의 아이러니** → 호기심갭 극대화
- 18자 = 모바일 최적 길이
- 벤치마크: 이선민 "결정사는 차갑다" 영상 화제 → 동일 포맷에 업계 인사이더 시각 추가

**제목 체크리스트:**
- [x] 30자 이내 (18자)
- [x] 호기심갭 (대표가 본인 등급?)
- [x] 결정사 키워드 포함
- [x] 제목-썸네일 상보성

### 썸네일 설계

| 요소 | 내용 |
|------|------|
| 주인공 | 이세령 — 등급표를 손에 들고 곤란한 표정 |

## STEP 1. 영상 개요

| 항목 | 내용 |
|------|------|
| 출연자 | 이세령 (30세, 연세대, 前 아나운서, 결정사 공동대표, 인스타 85K) |
| 포맷 | **스튜디오 Solo 토크** |
| 핵심 와우 포인트 | ① 등급 시스템 업계 인사이더 해부 ② **본인 등급 직접 공개** (자학) ③ 탁재훈 1억/이선민 24점 등 트렌드 정면 돌파 ④ "등급이 높다고 결혼 잘 되냐?" 반전 ⑤ 남녀 비대칭 기준 솔직 해설 |
| 러닝타임 | 13~15분 |
| 한 줄 요약 | 결정사 대표가 업계 등급 시스템을 처음부터 끝까지 해부하고, 본인 스펙으로 본인 등급까지 매겨보면서, "등급 너머에 진짜 중요한 것"을 말하는 스튜디오 토크 |
| 촬영 장비 | 카메라 1대 (4K) + 핀마이크 × 2 + 삼각대 + LED 조명 2개 |
| 촬영 시간 | 약 3~4시간 (세팅 포함) |

## STEP 2. 타겟 시청자

### 투트랙 타겟

| 트랙 | 타겟 | 작동 방식 |
|------|------|---------|
| **겉 (1차)** | "나는 몇 등급?" 궁금한 25~40세 미혼 전체 | 등급 시스템 호기심 → 본인 대입 → **댓글/공유 폭발** ("나는 몇 점이지?") |
| **속 (2차)** | 결정사 가입 고민 중인 30~45세 | 업계 인사이더 정보 → 신뢰 구축 → **무료 진단 폼 클릭** |

### 예상 댓글 반응

- "결정사 대표가 본인 등급 공개하는 건 처음이다"
- "52점 만점에 OO점?? 대표인데??"
- "남자는 돈, 여자는 외모라니 ㄷㄷ"
- "탁재훈 1억이 진짜였어??"
- "솔직한 거 인정. 다른 결정사 유튜버는 이런 말 못 함"
- "나도 등급 궁금하다... 무료 진단 어디서?"
- "등급 높아도 결혼 못 한다는 말 찔린다"
- "이 언니 진짜 업계를 아는 사람"

### 알고리즘 키워드

**제목용:** 결정사, 결정사 등급, 결혼정보회사, 등급표, 탁재훈, 이선민, 결정사 가격

**해시태그:** #결정사 #결정사등급 #결혼정보회사 #등급표 #30대결혼 #결정사가격 #탁재훈결정사

## STEP 3. ACT 구조 (3막)

### 전체 타임라인

| 시간 | 막 | 핵심 | 감정선 |
|------|-----|------|--------|
| **0:00~0:30** | 프리훅 | "결정사 대표인데 제 등급을 매겨봤어요" | 충격+호기심 |
| **0:30~5:00** | **1막: 등급 시스템 해부** | 어떻게 매기나 / 남녀 기준 차이 / 가격 구조 | 놀람→분노→"진짜?" |
| **5:00~10:00** | **2막: 본인 등급 + 트렌드** | 본인 채점 / 탁재훈 1억 / 이선민 24점 / 외모 논란 | 충격→자학→공감 |
| **10:00~13:30** | **3막: 등급 너머** | 등급 높아도 안 되는 이유 / 진짜 중요한 것 / 본인 결정사 차별점 | 반전→납득→신뢰 |
| **13:30~14:30** | 엔딩 | "등급은 시작점이지 결론이 아니에요" + CTA + 다음편 | 여운 |

---

### 1막 상세: 등급 시스템 해부 (0:30~5:00)

| 구간 | 내용 | 핵심 포인트 |
|------|------|-----------|
| 0:30~1:30 | 등급은 어떻게 매기나 | 52점 만점 체계 (나이/외모/재산/연봉/집안/학력) |
| 1:30~3:00 | **남녀 기준 차이** | 남자=돈/직업, 여자=외모/나이. "S등급 남자 = 의사/판사/검사" |
| 3:00~4:00 | 가격 구조 솔직 공개 | 듀오 270만~, 엔노블 ~1억. "여자가 더 비싸다" |
| 4:00~5:00 | 업계의 공식 입장 vs 현실 | "등급표 없다"고 하지만 → 암묵적 분류 불가피 |

> **1막의 목표**: 시청자가 "등급 시스템이 이렇게 작동하는 거구나" 이해. 정보 전달 + "진짜?" 놀람.

## STEP 6. 엔딩 설계

**마지막 질문:** *"지금 등급 때문에 결정사 고민하는 사람한테 한마디?"*

**톤 가이드:**
- 대본 X. 이세령 감정으로 자유롭게
- PD는 10초+ 침묵 버티기
- 건드릴 키워드: **등급은 시작점** / **태도** / **겪어본 사람**
- 리테이크 금지

### 화면 마무리

- 이세령 마지막 멘트 → 3초 정적 → 미소
- 페이드아웃 (5초)
- 엔딩 자막: **"겪어본 사람이 차린 결정사 · 아는언니 리지"**
- 암전 후 EP.03 프리뷰 5초

### CTA — 영상 내 0회

- **무료 등급 진단 폼** → 더보기란 + 고정 댓글만
- 영상 내 "구독/좋아요" 멘트 0회
- 댓글 유도: "본인 등급 궁금하면 댓글 남겨주세요" 엔드카드만

## STEP 10. Ban 리스트

| # | 금지 | 이유 |
|---|------|------|
| 1 | "안녕하세요" 인사 | 0초 후크 룰 |
| 2 | "구독 좋아요" 멘트 | 0회 |
| 3 | 대본 읽는 느낌 | 키워드만, 즉흥 |
| 4 | **경쟁사 실명** (듀오/가연/엔노블/제이노블 등) | "메이저 결정사" "노블 결정사" 등으로만 |
| 5 | 베스트클래스 구체적 회사명 | "매칭 서비스 경험"으로만 |
| 6 | **특정 회원 정보** | 가림 + 익명 처리 |
| 7 | MCN/Neobridge 관계 | 순수 개인 채널 |
| 8 | 워터밤 언급 | 결정사 이미지 충돌 |
| 9 | 황정우/이나영 사건 | 절대 금지 |
| 10 | 연세대 재적/퇴학 | EP01과도 무관, 언급 불필요 |
| 11 | 등급 시스템을 비하 | 시스템을 분석하되 "쓰레기 시스템"식 비하 X |
| 12 | 특정 성별 편들기 | 중립. 남녀 양쪽 다 솔직하게 |
| 13 | 가격 자기 결정사 직접 공개 | "업계 평균"으로만. 본인 결정사 가격은 아직 X |

### Drop 유발 Ban 키워드

- "잘하는" → "적성에 맞는" 대체
- "이게" → 구체적 주어로 대체
- "내년에" → "앞으로" 대체
- "없으면" → 긍정형 전환
