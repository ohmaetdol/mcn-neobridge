## STEP 0. 제목 & 썸네일 설계

| 안 | 제목 | 글자수 | 공식 | 컨셉 |
|---|------|-------|------|------|
| **A (메인)** | **90키로 대구 여고생이 결정사 대표가 되기까지 [실화]** | 25자 | 숫자갭 + 변신 + 대괄호 | contrast |
| B | 편입 7번 떨어진 여자가 결정사를 차린 이유 | 20자 | 숫자 + 역경 + 의문 | question |
| C | 아나운서 7년 했는데 결정사 차렸습니다 [90→56kg] | 26자 | 직업갭 + 숫자 변신 | shock_number |

**A안 선택 근거:**
- "90키로 → 결정사 대표" = 갭(낙차) 극대 → CTR 최강 공식
- 숫자 "90" = 0.5초 만에 시선 고정
- [실화] = 호기심 + 신뢰 동시 확보
- 벤치마크: 예보링 "23살에 7억 모은 썰" (735만뷰) 동일 구조

**제목 체크리스트:**
- [x] 30자 이내 (25자)
- [x] 숫자 포함 (90키로)
- [x] 믿기 어렵지만 사실
- [x] 제목과 썸네일이 같은 말 안 함
- [x] 결정사 키워드 포함

|------|------|
| 주인공 표정 | 담담한 미소 + 카메라 정면 (자신감) |

## STEP 3. ACT 구조 (3막)

> 스튜디오 토크는 장소 전환 없이 **이야기 전환**으로 구조를 만든다.
> 3막 = 3개의 감정 아크. 각 막마다 위기장치로 리텐션 유지.

### 전체 타임라인

| 시간 | 막 | 핵심 내용 | 감정선 |
|------|-----|---------|--------|
| **0:00~0:30** | 프리훅 | "결정사 대표인데, 고등학교 때 90키로였어요" | 충격 |
| **0:30~5:00** | **1막: 대구 여고생** | 초3 노현정→10년 자기확신→90kg→반지하→편입 7번→연세대 | 공감→응원 |
| **5:00~10:00** | **2막: 화려함과 추락** | 아나운서→tvN 천정명→미스코리아 탈락→트리플 슬럼프→부활 | 충격→안타까움→카타르시스 |
| **10:00~13:30** | **3막: 왜 결정사인가** | 사업 전환→결정사를 차린 진짜 이유→커뮤니티 이슈 정면 돌파→선언 | 납득→신뢰→동기부여 |

## STEP 6. 엔딩 설계

### 이세령이 자연스럽게 마무리

> 엔딩 = CTA가 아니라 이세령의 진짜 이야기.
> 마지막 질문만 던지고 **길게 말하게 놔둠**. 답변 가이드 없음.

**마지막 질문 (이것만):** *"마지막으로 지금 혼자인 사람들한테 한마디 한다면?"*

**톤 가이드:**
- 답변 구성 X, 대본 X
- 이세령 본인 감정으로 자유롭게
- PD는 추가 질문 하지 말고 **10초+ 침묵 버티기**
- 건드릴 주제: `긁지 않은 복권` / `겪어본 사람` / `아직 시작`
- 리테이크 금지 — 첫 테이크 그대로

### 화면 마무리

- 이세령 마지막 멘트 → 정적 + 미소 (3초)
- 페이드아웃 (5초)
- 엔딩 자막: **"겪어본 사람이 차린 결정사 · 아는언니 리지"**
- 암전 후 5초 EP.03 프리뷰 ("다음 편에 첫 회원을 만납니다...")

### CTA — 영상 내 0회

- 무료 등급 진단 폼 → **더보기란 + 고정 댓글만**
- 영상 내 "구독", "좋아요", "알림 설정" 0회
- 댓글 유도: "결정사 대표한테 물어보고 싶은 거 있으면 댓글 남겨주세요" 카드만
