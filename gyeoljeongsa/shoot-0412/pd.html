> 브이로그 = 동선이 곧 스토리 구조.
> **메이크업룸에서 시작 → 식당 외부에서 끝**. 변신과 일상의 완결.

| 단계 | 내용 | 장소 | 시간 (영상) | 감정 |
|------|------|------|------------|------|

## STEP 7. 엔딩 설계

### 이세령이 자연스럽게 마무리

> 엔딩 = CTA가 아니라 이세령의 진짜 이야기.
> 식당 외부에서 와이드샷, 마지막 질문만 던지고 길게 말하게 놔둠.

**마지막 질문:** *"근데 괜찮아요?"*

**이세령 마무리 (예상 멘트, 그대로 안 가도 됨):**
> *"오늘도 남의 인연 만들어주고 혼자 가요.
> 근데 괜찮아요. 저는 안 긁은 복권이니까.
> 그리고 사실, 결혼 못 한 사람이
> 결혼하고 싶은 사람의 마음을 가장 잘 알아요.
> 그래서 오늘 하루도 의미 있었어요."*

### 화면 마무리

- 이세령 마지막 멘트 → 정적 + 미소 (3초)
- 식당 외부 와이드샷 → 페이드아웃 (5초)
- 엔딩 자막: **"겪어본 사람이 차린 결정사 · 아는언니 리지"**
- (BGM 잔잔한 피아노 페이드아웃)

### CTA — 영상 내 0회

- 무료 등급 진단 폼 → **더보기란 + 고정 댓글만**
- 영상 내 "구독", "좋아요", "알림 설정" 0회
- 댓글 유도: "결정사 대표한테 물어보고 싶은 거 있으면 댓글 남겨주세요" 카드만 (영상 마지막)

## STEP 8. 노림수 (자연스러운 사업 연결)

> 직접 광고 0%. 상황 자체가 노림수.

| 시간 | 장면 | 노림수 | 멘트 (있는 것만) |
|------|------|-------|------|
| 0~2분 | 메이크업 + 후크 | 캐릭터 진입 | (인사 없음) |
| 5~7분 | 베스트클래스 시스템 설명 | 결정사 서비스 인지 | "이게 4:4 로테이션인데요" |
| 7~9분 | **가격 카드 공개** | 가치 전달 | "1000만 원" |
| 9~11분 | **매출 150만 원 폭로** | 진정성 = 신뢰 | "진짜로 그랬어요" |
| 13분 | 솔로 독백 | 사회적 증거 + 진정성 | "이런 문자 받으면 계속하게 돼요" |
| 14분 | 클로징 | 캐릭터 각인 | "겪어본 사람" |

**노림수 원칙:**
- 가격 직접 언급은 OK (이세령이 자발적으로 공개)
- "가입하세요" 멘트는 절대 금지
- **가격 + 매출 = 가장 강력한 노림수** (한방언니/모두의지인은 절대 못 함)

## STEP 9. USP — 상품 USP 매핑

> 본 EP는 **캐릭터 각인 + 가격 첫 노출** 단계.
> USP 12가지 중 **1, 2, 3, 4, 7, 8, 11, 12** 작동.
> FOMO(9), 한정(10)은 0회.

| USP # | 항목 | 본 EP 장면 | 작동 방식 |
|-------|------|----------|---------|
| 1 | 타겟 | 썸네일 "30살 노처녀" + 후크 5초 | 자기 대입 (28~35 미혼 여성) |
| 2 | 판매 목적 | 인생 스토리 + 회원 프로필 검토 | "겪어본 사람이 운영" |
| 3 | 해결 (최소 노력) | 베스트클래스 시스템 설명 (4:4 매칭) | "혼자 못 하는 일을 시각화" |
| 4 | 대의명분 | "한 달 매출 150만 원에도 계속하는 이유" | 진심 선언 |
| 7 | 경쟁 대비 강점 | "다른 결정사는 외모 안 본다고 거짓말" | 솔직성 차별화 |
| **8** | **가격 명시** | **1000만 / 165만 / 30만 / 200만** | **첫 가격 공개** |
| 11 | B&A | 90kg → 60kg / 영남대 → 연세대 / 추락 → 부활 | 회복탄력성 증명 |
| 12 | 리스크 방어 | "솔직히 무서워요" + 매출 150만 폭로 | "미혼 대표 사기?" 정면 돌파 |

**FLOW 검증:**
- **FLOW 1** (문제→해결→변화): 1 → 3 → 11 ✓
- **FLOW 2** (손해→FOMO): 8 (가격) 첫 등장, 9·10은 의도적 생략
- **FLOW 3** (B&A 근거): 11 + 7 + 12 ✓
