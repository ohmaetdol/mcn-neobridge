const md=String.raw`## 한 줄 컨셉

> **"남의 인연 만들어주고 혼자 집에 돌아가는 30살 결정사 대표의 진짜 하루"**

오늘 촬영의 단 하나의 미션:
**시청자가 "이 사람한테 맡기고 싶다"고 느끼게 만드는 것.**

가격, 시스템, 매출, 인생 스토리, 다 솔직하게 까는 게 포인트.
숨기는 거 없는 결정사 대표 캐릭터 = 우리의 무기.

---

## 촬영 D-DAY 시간표 (4/12 일)

| 시간 | 장소 | 대표님이 하실 일 |
|------|------|----------------|
| 11:00 | 자택 | **촬영 시작** — 기상, 아침 루틴, 출근 준비 |
| 12:00 | 메이크업 | 평소 촬영일처럼 풀세팅 (메이크업 받는 모습 B-roll 인서트) |
| 13:00 | 사무실 | **본 촬영 시작** — 책상에서 후크 멘트 |
| 14:00 | 사무실 | 인생 스토리 풀기 (PD 질문에 답) |
| 15:30 | 점심 | 평소처럼 (B-roll 인서트) |
| 16:30 | 베스트클래스 미팅룸 | 가격 카드 보여주며 시스템 설명 |
| 18:00 | 사무실 복귀 | **실제 회원 메시지/청첩장 리액션 + 솔로 독백** (카메라 정면, 책상에 앉아서) |
| 19:00 | 식당 외부 | 클로징 — "오늘도 남의 인연 만들었네" |
| 19:30 | 종료 | 정리 |

**총 8.5시간** (편집 후 13~15분 영상)

---

## 핵심 후크 멘트 (외울 필요 없음, 톤만 기억)

### 0초 후크 (사무실 책상, 풀세팅 정면)

> *"안녕하세요 안 합니다. 저요?
> 결정사 대표인데, 30살에 아직 결혼 못 한 노처녀예요.
> 그래서 오늘 저의 진짜 하루를 보여드릴게요."*

→ **"안녕하세요"는 0회**. 자기소개도 안 함.
→ 첫 5초에 "결정사 대표" + "30살" + "노처녀" 3 키워드 박힘.

### 가격 폭로 멘트 (15:00 베스트클래스 미팅룸)

> *"이 카드 한 장이 1000만 원이에요.
> 저희 회원분들이 결제하시는 거고요.
> 한 명이랑 만나실 때마다 30만 원이 차감되고,
> 데이트 수락하시면 150에서 200만 원 더 차감돼요."*

(다음 멘트가 진짜 핵심)

> *"근데 제가 솔직히 말씀드릴게요.
> 한 달에 4:4 미팅을 1번밖에 못 했을 때는,
> 정산하니까 진짜 150만 원 벌고 그랬어요."*

→ **이 한 마디가 영상 전체의 진정성을 잡음.** 빼지 말 것.

### 솔로 독백 멘트 (18:00 사무실 복귀 후)

> **씬 구성**:
> 1. 사무실 복귀 → 책상 앉음 → 핸드폰 울림
> 2. 실제 회원 문자/청첩장/감사카드 확인 (화면 가림 처리)
> 3. 잠깐 미소 → 핸드폰 내려놓음 → **3초 침묵** (카메라 정면 응시)
> 4. 혼잣말처럼 독백 (톤: 조용, 진심)

> *"이런 문자 받으면요…
> 한 달 150만 원 벌어도 그냥 하게 돼요.
> 진짜 이 맛에 하는 거예요.
> 내 인생은 못 찾았는데, 남의 인생은 찾아줬으니까."*

(여기서 본인이 자연스럽게 풀어주세요 — 실제 기억나는 회원 한 명 떠올리며)

### 클로징 멘트 (17:30 식당 외부, 살짝 미소)

> *"오늘도 남의 인연 만들어주고
> 혼자 집에 가요.
> 근데 괜찮아요. 저는 안 긁은 복권이니까."*

## 인생 스토리 — 5분 압축 가이드

PD가 "본인은 왜 결혼 못 했어요?" 또는 "이 일 어떻게 시작하게 됐어요?" 물어보면 **이 순서로** 풀어주세요.

### 1. 어린 시절 (대구, 초3, 노현정)

> *"저 대구 출신이에요. 초등학교 3학년 때 노현정 아나운서를 봤는데,
> 와, 세상에 완벽한 여자가 있구나. 저거 돼야지 했어요.
> 그때부터 한 번도 흔들린 적 없어요."*

### 2. 90kg 반지하 (자학 톤)

> *"고등학교 때 집안이 기울면서 반지하로 갔거든요.
> 스트레스로 폭식해서, 몸무게 앞자리에 9까지 봤어요.
> 진짜요. 90kg."*

### 3. 7번 편입 (간절함)

> *"수능 망해서 영남대 갔어요.
> 거기서 편입학원 다니면서 7번을 떨어졌어요.
> 그 시절은 지금도 신촌만 가면 눈물 나요."*

### 4. 연세대 합격 (연금술사)

> *"그러다가 8번째에 연세대, 이대, 경희대 다 붙었어요.
> 저 인생책이 파울로 코엘료 연금술사거든요.
> 꿈을 닮아간다고 하잖아요. 10년 동안 보름달에 빌었더니
> 우주가 감동해서 한 번에 문을 열어줬어요."*

### 5. 아나운서 추락 → 사업가 부활

> *"연세대 가서 아나운서 학원 가니까 바로 합격했어요.
> 스포티비 아나운서로 잡지에도 실리고.
> 근데 코로나 터지면서 다 무너졌어요.
> 그때 제가 깨달은 게,
> '아나운서로 성공 못 하면, 아나운서보다 더 멋진 여자가 되자'였어요."*

### 6. 지금 (회복탄력성 = 본인의 무기)

> *"제가 한 가지 잘하는 게 있다면,
> 진짜 좌절을 많이 겪었는데 그걸 밟고 일어나는 힘이 세요.
> 그래서 지금 결정사 대표로 앉아 있어요."*

---

## 오늘 꼭 풀어야 할 키 메시지 5개

### 1. "겪어본 사람이 차린 결정사"
- 이세령 = 90kg → 60kg / 7번 떨어짐 → 연대 / 추락 → 부활
- "그래서 저는 회원분들 마음 누구보다 잘 알아요"

### 2. "솔직한 결정사" — 가격/매출 공개
- 1000만 원 / 165만 원 / 600만 원 / 한 달 매출 150만 원
- "다른 결정사는 외모 안 본다고 거짓말해요. 저희는 봐요. 솔직하게."

### 3. "내가 커져야 세일즈를 안 뛴다" — 사업가 철학
- "사실 저 술 진짜 안 좋아해요. 근데 금토일 다 술자리 가요. 회원 따려고."
- "그래서 유튜브를 키우는 거예요. 영업 시간을 줄이고 싶어서."

### 4. "AI가 못 하는 3가지" — 시대 키워드
- "지금 사업 운영하면서 제가 직접 하는 건 딱 3가지예요.
- 콘텐츠 만들고, 사람 만나고, 촬영하고.
- 이건 AI가 못 하는 거잖아요."

### 5. "회복탄력성" (이 한 단어가 채널 정체성)
- "부잣집 애들은 멘탈이 약해요. 무너져본 적이 없어서."
- "저는 무너져봐서 다시 일어날 줄 알아요."

## 절대 하지 말 것 (Ban 리스트)

| # | 금지 | 이유 |
|---|------|------|
| 1 | "안녕하세요" 인사 | 첫 0.5초 이탈 방지 |
| 2 | "구독 좋아요" 멘트 | 채주부 룰 |
| 3 | 대본 읽는 느낌 | 키워드만 기억하고 자연스럽게 |
| 4 | **연세대 재적/퇴학/재입학 언급** | 이미지 리스크 (대표님 본인 의견 따름) |
| 5 | **1년 술/클럽 방황 시기** | 수위 조절 |
| 6 | **황정우/이나영 사건** | 절대 금지 (별도 동의 필요) |

## PD가 던질 핵심 질문 5개 (미리 보기)

대표님 답변할 때 너무 정리된 답변 X. **자연스럽게 길게** 풀어주세요.

1. *"본인은 왜 결혼 못 했어요?"* → 인생 스토리 5분 풀기
2. *"이 카드 한 장이 진짜 1000만 원이에요?"* → 가격/매출 솔직하게
3. *"결정사 대표가 술자리 매일 간다고요?"* → 사업가 철학

5. *"오늘 같은 하루가 매일 반복되는 거예요?"* → 클로징 ("괜찮아요")
