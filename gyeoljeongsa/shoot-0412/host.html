const md=String.raw`## 한 줄 컨셉

> **"남의 인연 만들어주고 혼자 집에 돌아가는 30살 결정사 대표의 진짜 하루"**

오늘 촬영의 단 하나의 미션:
**시청자가 "이 사람한테 맡기고 싶다"고 느끼게 만드는 것.**

가격, 시스템, 매출, 인생 스토리, 다 솔직하게 까는 게 포인트.
숨기는 거 없는 결정사 대표 캐릭터 = 우리의 무기.

### 이 영상이 노리는 3개의 와우 포인트

| # | 와우 포인트 | 어디서 터짐 |
|---|-----------|-----------|
| ① | **가격 솔직 공개** (1000만 / 165만 / 600만 / 매출 150만) | 17:00 베스트클래스 미팅룸 |
| ② | **회복탄력성 인생 서사** (90kg → 반지하 → 7번 편입 → 연대) | 14:30 사무실 인터뷰 |
| ③ | **실제 회원 메시지 리액션 + 솔로 독백** (사찍남식 진정성 컷) | 18:30 사무실 복귀 |

### 채널 첫 정체성 키워드

> **"겪어본 사람이 차린 결정사"**

아는언니 리지 채널이 평생 깔고 갈 포지셔닝입니다.
오늘 촬영은 이 문장을 시청자 머릿속에 박는 첫 번째 영상입니다.

### 촬영 한눈에

| 항목 | 값 |
|------|---|
| 콘텐츠명 | 30살 노처녀가 된 결정사 대표의 하루 |
| 포맷 | 하이브리드 브이로그 (이동 60% + 카메라 정면 40%) |
| 러닝타임 | **13~15분** (편집 후) |
| 로케이션 | 7곳 (자택 → 헬스장 PT → 메이크업샵 → 릴스 촬영장 → 사무실 → 베스트클래스 → 식당 외부) |
| 촬영 시간 | 09:00 ~ 20:30 (약 11.5시간) |
| 목표 CTR | **5% 이상** |
| 영상의 목적 | 1차: 무료 등급 진단 폼 클릭 / 2차: 캐릭터 각인 |

## 촬영 D-DAY 시간표 (4/12 일)

| 시간 | 장소 | 스토리 미션 |
|------|------|------------|
| 09:00 | **자택** | 옛날 사진 + 화장실 아나운서 연습 리인액트 (바닥 서사 시작) |
| 10:30 | **헬스장 PT** | 다이어트 과정 + 다이어트 식품 자연 노출 + 남자들 반응 변화 |
| 12:30 | **메이크업샵** | 풀세팅 + 뚱뚱했을 때 → 반전 캐릭터 각인 |
| 14:00 | **릴스 촬영장** | 직접 릴스 찍기 + 아나운서 되기까지 (7번 편입 → 연대) |
| 15:00 | **사무실** | 아나운서 슬럼프 + 서울 상경 + 0초 후크 + 회원 메시지 리액션 |
| 17:00 | **베스트클래스 미팅룸** | 가격 카드 폭로 + 매출 150만 원 솔직 공개 (감정 피크) |
| 19:30 | **식당 외부** | 해질녘 클로징 — "안 긁은 복권" 콜백 |
| 20:30 | 종료 | 정리 |

**총 약 11.5시간** (편집 후 13~15분 영상)

> **헬스장 PT**에서 드시는 다이어트 식품은 향후 채널에서 **건강식품 판매 라인 빌드업**을 위한 자연 노출입니다. 억지 PPL 톤 X, 본인이 평소 드시는 것처럼 편안하게.

<div class="sec-hdr">장소 1 — 자택 (09:00~10:00)</div>

**스토리 미션**

옛날 살졌던 시절 증거(사진) + 화장실 아나운서 연습 리인액트 = **바닥에서 시작한 사람** 첫 증명. "지금 이 풀세팅 대표가 예전엔 여기 반지하에서 90kg로 살았다"는 충격 오프닝.

**촬영 포인트**
- 옛날 앨범/핸드폰 사진 펼치는 클로즈업 (90kg 시절 사진 1~2장 미리 준비)
- 화장실 거울 앞에서 아나운서 발성 연습 리인액트 (지금 복장 그대로 OK, 한 소절만)
- 기상 / 세수 / 커피 내리는 아침 루틴 B-roll
- 책상에 펼쳐둔 회원 프로필 인서트 (가림 처리 전제)

## 스토리 요약 — 인생 서사 흐름 (참고용)

> **대본 없음.** 아래는 PD가 순서대로 물어볼 질문 + 꼭 건드려야 할 키워드.
> 답변은 전부 본인 실제 기억 + 본인 말. 외울 것 없음.

### 1. 어린 시절 — 아나운서의 꿈

## 오늘 꼭 풀어야 할 키 메시지 4개 (주제만)

> **대본 없음.** 아래 4개 주제는 PD가 질문으로 꺼낼 예정. 본인 말로 풀어주세요.

### 1. "겪어본 사람이 차린 결정사"
- **PD 질문**: "왜 결정사 시작하게 됐어요? 본인 경험이 이 일에 어떻게 연결돼요?"
- **연결 포인트**: 90kg → 60kg / 7번 편입 → 연대 / 추락 → 부활

### 2. "솔직한 결정사" — 가격/매출 공개
- **PD 질문**: "가격 솔직히 공개하시는 거 무섭지 않아요? 다른 결정사랑 뭐가 달라요?"
- **건드릴 주제**: 가격 구조 투명 / 외모 본다고 인정 / 다른 결정사 관행 비판

### 3. "다이어트 → 아나운서 → 결정사" — 인생 서사
- **PD 질문**: "90kg에서 60kg 뺀 그 과정, 어떻게 시작됐어요? 그게 지금 일에 어떻게 연결돼요?"
- **건드릴 주제**: 살 빼면서 남자 시선 바뀐 충격 / 7번 편입 집념 / 아나운서 슬럼프 → 결정사 전환

### 4. "회복탄력성" — 채널 정체성
- **PD 질문**: "대표님의 가장 큰 무기가 뭐라고 생각해요?"
- **건드릴 주제**: 무너져본 경험 / 다시 일어나는 힘 / 부잣집 애들과의 차이
