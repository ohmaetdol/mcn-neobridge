<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0064ff">
<title>0412 촬영 체크리스트 · 아는언니 세령</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
  :root {
    --bg: #0b0d12;
    --card: #141820;
    --card2: #1b2029;
    --border: #252b36;
    --text: #e5e7eb;
    --mute: #8b95a7;
    --dim: #5a6578;
    --blue: #0064ff;
    --red: #dc2626;
    --org: #d97706;
    --purple: #7c3aed;
    --grn: #16a34a;
    --dark: #1f2937;
    --done: #10b981;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0;
    background: var(--bg);
    color: var(--text);
    font-family: 'Pretendard Variable', Pretendard, -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
    font-size: 15px; line-height: 1.55;
    overscroll-behavior-y: none;
  }
  body { padding-bottom: 80px; }

  /* Sticky Header */
  .header {
    position: sticky; top: 0; z-index: 50;
    background: rgba(11,13,18,0.92);
    backdrop-filter: saturate(140%) blur(14px);
    -webkit-backdrop-filter: saturate(140%) blur(14px);
    border-bottom: 1px solid var(--border);
    padding: 14px 16px 10px;
  }
  .header h1 {
    font-size: 15px; font-weight: 800; margin: 0 0 4px;
    letter-spacing: -0.02em;
  }
  .header .sub {
    color: var(--mute); font-size: 12px; margin-bottom: 10px;
  }
  .progress-wrap {
    display: flex; align-items: center; gap: 10px; margin-bottom: 10px;
  }
  .progress-bar {
    flex: 1; height: 8px; background: var(--card2);
    border-radius: 999px; overflow: hidden;
  }
  .progress-fill {
    height: 100%; background: linear-gradient(90deg, var(--blue), var(--done));
    width: 0%; transition: width 0.3s ease;
    border-radius: 999px;
  }
  .progress-text {
    font-size: 13px; font-weight: 700; color: var(--text);
    min-width: 72px; text-align: right;
    font-variant-numeric: tabular-nums;
  }
  .filter-row {
    display: flex; gap: 6px; flex-wrap: wrap;
  }
  .filter-btn {
    flex: 1; min-width: 0;
    background: var(--card); border: 1px solid var(--border);
    color: var(--mute); padding: 8px 10px;
    border-radius: 8px; font-size: 12px; font-weight: 700;
    cursor: pointer; transition: all 0.15s;
    font-family: inherit;
  }
  .filter-btn.active {
    background: var(--blue); border-color: var(--blue); color: #fff;
  }
  .filter-btn.reset {
    flex: 0 0 auto; color: var(--dim);
  }
  .filter-btn.reset:hover { color: var(--red); border-color: var(--red); }

  /* Main */
  main { padding: 12px 14px 40px; }

  /* Location Group */
  .loc-group { margin-bottom: 18px; }
  .loc-header {
    display: flex; align-items: center; gap: 10px;
    padding: 10px 14px; border-radius: 10px;
    font-weight: 800; font-size: 14px;
    margin-bottom: 10px; color: #fff;
    letter-spacing: -0.01em;
  }
  .loc-header .loc-title { flex: 1; min-width: 0; }
  .loc-header .loc-time {
    font-size: 11px; font-weight: 600; opacity: 0.85;
    margin-left: 6px;
  }
  .loc-header .loc-count {
    font-size: 12px; font-weight: 700;
    background: rgba(255,255,255,0.2); padding: 3px 9px;
    border-radius: 999px; font-variant-numeric: tabular-nums;
  }
  .loc-header.L1 { background: var(--blue); }
  .loc-header.L2 { background: var(--red); }
  .loc-header.L3 { background: var(--org); }
  .loc-header.L4 { background: var(--purple); }
  .loc-header.L5 { background: var(--grn); }
  .loc-header.L6 { background: var(--red); }
  .loc-header.L7 { background: var(--dark); }

  /* Question Card */
  .q {
    background: var(--card); border: 1px solid var(--border);
    border-radius: 10px; margin-bottom: 8px;
    overflow: hidden; transition: all 0.15s;
  }
  .q.done {
    background: var(--card2); opacity: 0.55;
  }
  .q-row {
    display: flex; align-items: flex-start; gap: 12px;
    padding: 14px 14px 14px 14px;
    cursor: pointer; user-select: none;
    min-height: 52px;
  }
  .q-check {
    flex-shrink: 0;
    width: 24px; height: 24px;
    border: 2px solid var(--dim);
    border-radius: 6px;
    display: flex; align-items: center; justify-content: center;
    transition: all 0.15s;
    margin-top: 1px;
  }
  .q.done .q-check {
    background: var(--done); border-color: var(--done);
  }
  .q-check::after {
    content: ""; width: 6px; height: 11px;
    border: solid #fff; border-width: 0 2px 2px 0;
    transform: rotate(45deg) translate(-1px, -1px);
    opacity: 0;
  }
  .q.done .q-check::after { opacity: 1; }

  .q-body { flex: 1; min-width: 0; }
  .q-meta {
    display: flex; align-items: center; gap: 8px;
    margin-bottom: 5px; flex-wrap: wrap;
  }
  .q-num {
    background: var(--blue); color: #fff;
    font-size: 11px; font-weight: 800;
    padding: 2px 7px; border-radius: 5px;
    font-variant-numeric: tabular-nums;
  }
  .q.done .q-num { background: var(--done); }
  .q-tag {
    color: var(--mute); font-size: 12px; font-weight: 700;
    letter-spacing: -0.01em;
  }
  .q-text {
    font-size: 14px; line-height: 1.6;
    color: var(--text); word-break: keep-all;
    white-space: pre-wrap;
  }
  .q.done .q-text { text-decoration: line-through; text-decoration-color: var(--dim); }

  /* 다단계 MC 질문 강조 */
  .q-text strong { color: #fef3c7; font-weight: 700; }

  /* Hide when filtered */
  .q.hidden { display: none; }
  .loc-group.empty { display: none; }

  /* Footer / Reset confirmation */
  .toast {
    position: fixed; left: 50%; bottom: 24px;
    transform: translateX(-50%) translateY(20px);
    background: var(--card); color: var(--text);
    padding: 10px 18px; border-radius: 999px;
    border: 1px solid var(--border);
    font-size: 13px; font-weight: 600;
    opacity: 0; transition: all 0.3s;
    pointer-events: none;
  }
  .toast.show {
    opacity: 1; transform: translateX(-50%) translateY(0);
  }

  /* Desktop */
  @media (min-width: 768px) {
    body { font-size: 16px; }
    main { max-width: 720px; margin: 0 auto; padding: 16px 20px 60px; }
    .header { padding: 16px 20px 12px; }
    .header > div { max-width: 720px; margin: 0 auto; }
    .header h1 { font-size: 17px; }
  }
</style>
</head>

<div class="header">
  <div>
    <h1>아는언니 세령 · 0412 촬영 체크리스트</h1>
    <div class="sub">7곳 · 41질문 · 체크는 자동 저장됩니다</div>
    <div class="progress-wrap">

    <div class="filter-row">

      <button class="filter-btn" data-filter="done">완료</button>
      <button class="filter-btn reset" id="resetBtn">초기화</button>

</div>

<main id="main"></main>

      { n: 7, tag: '부잣집 남자 vs 멘탈 강한 남자 (공감)', q: '**단계 1 (통념 찌르기)**\n"여자들 다 부잣집 남자 만나고 싶어 하잖아요. 결정사에서 제일 인기 많은 타입도 그래요?"\n\n**단계 2 (반전)**\n"근데 부잣집 남자랑 결혼한 여자들 진짜 행복해요? 실제로요?"\n\n**단계 3 (인사이트)**\n"\'부잣집 남자는 의외로 멘탈이 약하다\'는 말 한 번 해주셨잖아요. 왜 그래요?"\n\n**단계 4 (시청자 대입)**\n"지금 30대 여자분들한테 — 어떤 남자를 만나야 진짜 행복해지는 건지 한 번만 정리해주세요"' },
    ]
  },
  {
    id: 'L7', color: 'L7',
    title: 'L7 식당 외부',
    time: '19:30~20:00 · 해질녘 클로징',
    questions: [
      { n: 1, tag: '오늘 하루', q: '"오늘 하루 어땠어요? 피곤하세요?"' },
      { n: 2, tag: '남의 인연 만들기', q: '"오늘도 남의 인연 만들어주고 혼자 집에 가시는 거잖아요. 그거 어때요?"' },
      { n: 3, tag: '본인한테 오는 문자', q: '"(혼잣말처럼) 본인한테는 언제 그런 문자가 올까요?"' },
      { n: 4, tag: '망설이는 시청자에게 직접 (CTA)', q: '**MC 프롬프트**\n"대표님, 지금 이 영상 보시면서 \'상담 한 번 받아볼까\' 망설이고 계신 분들이 분명히 있을 거예요. 그분들 카메라 보고 직접 한 마디 해주실 수 있어요?"\n\n→ 이세령 카메라 정면. 직설·진심 톤. 세일즈 X. "부담 없이 / 한 번만" 류 저장벽 단어. 3~8초.' },
      { n: 5, tag: '안 긁은 복권 — 채널 시그니처', q: '"본인 스스로 어떤 사람이라고 생각하세요?"' },
      { n: 6, tag: '클로징 한 마디', q: '"근데 괜찮아요? 이 일 계속할 수 있겠어요?"\n\n**추가 질문 절대 금지. 10초+ 침묵 그대로. 마지막 5초 카메라 정면 → 페이드아웃.**' },
    ]
  },
];

// ---- State ----
let state = { checks: {}, filter: 'all' };
function load() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) state.checks = JSON.parse(raw) || {};
  } catch (e) {}
}
function save() {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state.checks)); } catch (e) {}
}

// ---- Total count (exclude # = 0 separate production cuts) ----
const TOTAL = LOCATIONS.reduce((acc, l) => acc + l.questions.filter(q => q.n > 0).length, 0);

// ---- Render ----
function escapeHTML(s) {
  return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}
function renderQuestionText(s) {
  // preserve line breaks, apply **bold** → <strong>
  return escapeHTML(s)
    .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
    .replace(/\n/g, '<br>');
}

function render() {
  const main = document.getElementById('main');
  main.innerHTML = '';
  let done = 0;

  for (const loc of LOCATIONS) {
    const group = document.createElement('section');
    group.className = 'loc-group';

    const locDone = loc.questions.filter(q => q.n > 0 && state.checks[loc.id + ':' + q.n]).length;
    const locTotal = loc.questions.filter(q => q.n > 0).length;
    done += locDone;

    const header = document.createElement('div');
    header.className = 'loc-header ' + loc.color;
    header.innerHTML = `
      <div class="loc-title">${escapeHTML(loc.title)}<span class="loc-time"> · ${escapeHTML(loc.time)}</span></div>
      <div class="loc-count">${locDone}/${locTotal}</div>
    `;
    group.appendChild(header);

    let visibleInGroup = 0;
    for (const q of loc.questions) {
      const key = loc.id + ':' + q.n;
      const isDone = !!state.checks[key];
      const isProdCut = q.n === 0;

      if (state.filter === 'todo' && isDone) continue;
      if (state.filter === 'done' && !isDone && !isProdCut) continue;
      if (state.filter === 'done' && isProdCut) continue;

      visibleInGroup++;

      const card = document.createElement('div');
      card.className = 'q' + (isDone ? ' done' : '');
      if (isProdCut) card.style.borderStyle = 'dashed';

      const numLabel = isProdCut ? '別' : String(q.n);

      card.innerHTML = `
        <div class="q-row" data-key="${key}">
          <div class="q-check"></div>
          <div class="q-body">
            <div class="q-meta">
              <span class="q-num">${numLabel}</span>
              <span class="q-tag">${escapeHTML(q.tag)}</span>
            </div>
            <div class="q-text">${renderQuestionText(q.q)}</div>
          </div>
        </div>
      `;

      card.querySelector('.q-row').addEventListener('click', () => {
        state.checks[key] = !state.checks[key];
        save();
        render();
      });

      group.appendChild(card);
    }

    if (visibleInGroup === 0) group.classList.add('empty');
    main.appendChild(group);
  }

  // Progress
  const pct = TOTAL > 0 ? Math.round((done / TOTAL) * 100) : 0;
  document.getElementById('progressFill').style.width = pct + '%';
  document.getElementById('progressText').textContent = `${done}/${TOTAL} (${pct}%)`;
}

// ---- Filters ----
document.querySelectorAll('.filter-btn[data-filter]').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.filter-btn[data-filter]').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    state.filter = btn.dataset.filter;
    render();
  });
});

// ---- Reset ----
document.getElementById('resetBtn').addEventListener('click', () => {
  if (confirm('모든 체크를 초기화할까요?')) {
    state.checks = {};
    save();
    render();
    showToast('초기화 완료');
  }
});

// ---- Toast ----
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 1500);
}

// ---- Init ----
load();
render();
</script>
