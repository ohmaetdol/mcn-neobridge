<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#ffffff">
<title>0412 촬영 체크리스트 · 아는언니 세령</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
  :root {
    --bg: #ffffff;
    --card: #ffffff;
    --card2: #f8f9fb;
    --border: #e5e7eb;
    --border2: #f0f2f5;
    --text: #111827;
    --mute: #6b7280;
    --dim: #9ca3af;
    --hint: #adb5bd;
    --blue: #0064ff;
    --red: #dc2626;
    --org: #d97706;
    --purple: #7c3aed;
    --grn: #16a34a;
    --dark: #1f2937;
    --done: #10b981;
    --accent: #b45309;
    --shadow-sm: 0 1px 2px rgba(17,24,39,0.04);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0;
    background: var(--bg);
    color: var(--text);
    font-family: 'Pretendard Variable', Pretendard, -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
    font-size: 15px; line-height: 1.55;
    overscroll-behavior-y: none;
    -webkit-font-smoothing: antialiased;
  }
  body { padding-bottom: 80px; }

  .header {
    position: sticky; top: 0; z-index: 50;
    background: rgba(255,255,255,0.94);
    backdrop-filter: saturate(180%) blur(14px);
    -webkit-backdrop-filter: saturate(180%) blur(14px);
    border-bottom: 1px solid var(--border);
    padding: 14px 16px 10px;
  }
  .header h1 {
    font-size: 15px; font-weight: 800; margin: 0 0 4px;
    letter-spacing: -0.02em;
    color: var(--text);
  }
  .header .sub {
    color: var(--mute); font-size: 12px; margin-bottom: 10px;
  }
  .progress-wrap {
    display: flex; align-items: center; gap: 10px; margin-bottom: 10px;
  }
  .progress-bar {
    flex: 1; height: 8px; background: var(--card2);
    border-radius: 999px; overflow: hidden;
    border: 1px solid var(--border2);
  }
  .progress-fill {
    height: 100%; background: var(--done);
    width: 0%; transition: width 0.3s ease;
    border-radius: 999px;
  }
  .progress-text {
    font-size: 13px; font-weight: 700; color: var(--text);
    min-width: 84px; text-align: right;
    font-variant-numeric: tabular-nums;
  }
  .filter-row {
    display: flex; gap: 6px; flex-wrap: wrap;
  }
  .filter-btn {
    flex: 1; min-width: 0;
    background: var(--card); border: 1px solid var(--border);
    color: var(--mute); padding: 9px 10px;
    border-radius: 8px; font-size: 12px; font-weight: 700;
    cursor: pointer; transition: all 0.15s;
    font-family: inherit;
  }
  .filter-btn:active { transform: scale(0.97); }
  .filter-btn.active {
    background: var(--text); border-color: var(--text); color: #fff;
  }
  .filter-btn.reset {
    flex: 0 0 auto; color: var(--dim);
  }
  .filter-btn.reset:hover,
  .filter-btn.reset:active { color: var(--text); border-color: var(--text); }

  main { padding: 14px 14px 40px; }

  .loc-group { margin-bottom: 20px; }
  .loc-header {
    display: flex; align-items: center; gap: 10px;
    padding: 12px 14px;
    border-bottom: 1px solid var(--border);
    font-weight: 800; font-size: 14px;
    margin-bottom: 10px; color: var(--text);
    letter-spacing: -0.01em;
  }
  .loc-header .loc-title { flex: 1; min-width: 0; }
  .loc-header .loc-time {
    font-size: 11px; font-weight: 600; color: var(--mute);
    margin-left: 6px;
  }
  .loc-header .loc-count {
    font-size: 12px; font-weight: 700; color: var(--mute);
    background: var(--card2); padding: 3px 9px;
    border-radius: 999px; font-variant-numeric: tabular-nums;
    border: 1px solid var(--border);
  }

  .q {
    background: var(--card); border: 1px solid var(--border);
    border-radius: 10px; margin-bottom: 8px;
    overflow: hidden; transition: all 0.15s;
    box-shadow: var(--shadow-sm);
  }
  .q.done {
    background: var(--card2);
    opacity: 0.62;
  }
  .q-row {
    display: flex; align-items: flex-start; gap: 12px;
    padding: 14px;
    cursor: pointer; user-select: none;
    min-height: 52px;
  }
  .q-check {
    flex-shrink: 0;
    width: 24px; height: 24px;
    border: 2px solid var(--dim);
    border-radius: 6px;
    display: flex; align-items: center; justify-content: center;
    transition: all 0.15s;
    margin-top: 1px;
    background: #fff;
  }
  .q.done .q-check {
    background: var(--done); border-color: var(--done);
  }
  .q-check::after {
    content: ""; width: 6px; height: 11px;
    border: solid #fff; border-width: 0 2px 2px 0;
    transform: rotate(45deg) translate(-1px, -1px);
    opacity: 0;
  }
  .q.done .q-check::after { opacity: 1; }

  .q-body { flex: 1; min-width: 0; }
  .q-meta {
    display: flex; align-items: center; gap: 8px;
    margin-bottom: 6px; flex-wrap: wrap;
  }
  .q-num {
    background: var(--card2); color: var(--text);
    font-size: 11px; font-weight: 800;
    padding: 2px 8px; border-radius: 5px;
    font-variant-numeric: tabular-nums;
    border: 1px solid var(--border);
  }
  .q.done .q-num { background: var(--done); color: #fff; border-color: var(--done); }
  .q-tag {
    color: var(--mute); font-size: 12px; font-weight: 700;
    letter-spacing: -0.01em;
  }
  .q-text {
    font-size: 14px; line-height: 1.65;
    color: var(--text); word-break: keep-all;
    white-space: pre-wrap;
  }
  .q.done .q-text {
    text-decoration: line-through;
    text-decoration-color: var(--dim);
    color: var(--mute);
  }

  .q-text strong {
    color: var(--accent);
    font-weight: 800;
    background: #fef3c7;
    padding: 1px 5px;
    border-radius: 4px;
  }

  .q-hint {
    margin-top: 8px;
    padding: 8px 10px;
    background: #fafbfc;
    border-left: 2px solid #e5e7eb;
    border-radius: 0 4px 4px 0;
    font-size: 12.5px;
    line-height: 1.55;
    color: var(--hint);
    font-weight: 500;
    word-break: keep-all;
    white-space: pre-wrap;
  }
  .q-hint::before {
    content: "유도 답안 · ";
    font-size: 10px;
    font-weight: 700;
    color: #c1c7cd;
    letter-spacing: 0.02em;
  }
  .q.done .q-hint { opacity: 0.5; }

  .q.hidden { display: none; }
  .loc-group.empty { display: none; }

  .toast {
    position: fixed; left: 50%; bottom: 24px;
    transform: translateX(-50%) translateY(20px);
    background: #111827; color: #fff;
    padding: 10px 20px; border-radius: 999px;
    font-size: 13px; font-weight: 600;
    opacity: 0; transition: all 0.3s;
    pointer-events: none;
    box-shadow: 0 4px 20px rgba(0,0,0,0.15);
  }
  .toast.show {
    opacity: 1; transform: translateX(-50%) translateY(0);
  }

  @media (min-width: 768px) {
    body { font-size: 16px; }
    main { max-width: 760px; margin: 0 auto; padding: 18px 20px 60px; }
    .header { padding: 16px 20px 12px; }
    .header > div { max-width: 760px; margin: 0 auto; }
    .header h1 { font-size: 17px; }
  }
</style>
</head>
<body>

<div class="header">
  <div>
    <h1>아는언니 세령 · 0412 촬영 체크리스트</h1>
    <div class="sub">7곳 · 100+ 질문 · 체크 자동 저장</div>
    <div class="progress-wrap">
      <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
      <div class="progress-text" id="progressText">0/0 (0%)</div>
    </div>
    <div class="filter-row">
      <button class="filter-btn active" data-filter="all">전체</button>
      <button class="filter-btn" data-filter="todo">미완료</button>
      <button class="filter-btn" data-filter="done">완료</button>
      <button class="filter-btn reset" id="resetBtn">초기화</button>
    </div>
  </div>
</div>

<main id="main"></main>

<div class="toast" id="toast">저장됨</div>

<script>
const STORAGE_KEY = 'shoot-0412-checklist-v3';

const LOCATIONS = [
  {
    id: 'L1', color: 'L1',
    title: 'L1 자택',
    time: '09:00~10:00 · 바닥 서사 시작',
    questions: [
      { n: 1, tag: '옛날 사진', q: '"(사진 보여주며) 이 사진 속 본인 한 번 소개해 주세요. 언제예요?"', hint: '감량 전 90kg 시절 대학생/고등학생 사진. "이 때는 전혀 다른 사람이었다" 톤' },
      { n: 2, tag: '고향 / 어린 시절', q: '"어디서 태어나셨어요? 어린 시절 본인은 어떤 아이였어요?"', hint: '대구 출신. 공부 잘하는 모범생도, 인기 많은 애도 아니었다 → 평범+조용함' },
      { n: 3, tag: '별명', q: '"어릴 때 별명 있었어요? 친구들이 뭐라고 불렀어요?"', hint: '뚱뚱함 관련 놀림성 별명 or 순한/존재감 없던 별명. 트라우마성 기억' },
      { n: 4, tag: '아나운서 꿈의 시작', q: '"아나운서라는 직업을 처음 알게 된 게 언제예요? 누구 보고 꽂히신 거예요?"', hint: '초등 저학년 때 TV에서 본 아나운서 한 명. 그때 구체적 장면 묘사' },
      { n: 5, tag: '아나운서 연습 리인액트', q: '"집에서 아나운서 연습해 보신 적 있어요? 어떻게 했어요? 한 번 보여주실 수 있어요?"', hint: '거울 앞에서 뉴스 멘트 따라했던 장면 재현. 어릴 적 순수한 꿈의 증거' },
      { n: 6, tag: '어린 시절 몸 / 집', q: '"어릴 때 본인 모습은 어땠어요? 그때 집은 어떤 집이었어요?"', hint: '살집 있던 어린 세령 + 넉넉하지 않은 주거 환경. 두 가지 "바닥"을 연결' },
      { n: 7, tag: '부모님 / 경제적 환경', q: '"부모님은 어떤 일 하셨어요? 집 형편은 어땠어요?"', hint: '평범한 자영업/맞벌이. 아나운서 학원·과외 돈 걱정이 컸다는 맥락 유도' },
      { n: 8, tag: '예전 집 vs 지금 집', q: '"(현관/거실 와이드) 지금 이 집은 본인한테 어떤 의미예요? 예전 살던 집이랑 비교하면요?"', hint: '현재 공간은 본인이 스스로 만든 결과물. 예전 집과의 대비를 시각적으로' },
      { n: 9, tag: '아끼는 물건', q: '"(책상/화장대) 이 공간에서 제일 아끼는 물건 하나만 보여주세요. 왜 그게 중요해요?"', hint: '편입/아나운서 준비 시절 노트·책·일기장 등 서사 연결되는 오브제' },
      { n: 10, tag: '말투 / 사투리', q: '"가족이랑 통화할 때 말투 달라져요? 한 번 들려주세요"', hint: '방송용 서울말 → 대구 사투리 전환. 인간적 갭 확보' },
      { n: 11, tag: '아침 루틴', q: '"오늘 아침 몇 시에 일어나셨어요? 제일 먼저 뭐 하셨어요?"', hint: '대표의 빡빡한 아침 (운동·상담 준비·미팅). 바쁜 일상 자연 노출' },
      { n: 12, tag: '오늘 출발 멘트', q: '"오늘 어디 어디 가시는 거예요? 하루 일정 간단히 알려주세요"', hint: '7곳 촬영 일정을 본인 입으로 소개 → 시청자에게 "오늘의 여정" 예고' },
    ]
  },
  {
    id: 'L2', color: 'L2',
    title: 'L2 헬스장 PT',
    time: '10:30~12:00 · 다이어트 + PPL 빌드업',
    questions: [
      { n: 1, tag: '운동 시작 계기', q: '"운동 언제부터 시작하셨어요? 시작하게 된 계기가 뭐예요?"', hint: '90kg 정점에서 "이대로 못 산다" 결심의 구체 계기. 특정 사건 유도' },
      { n: 2, tag: '첫 운동의 기억', q: '"운동 처음 시작하던 날 어땠어요? 뭐가 제일 힘들었어요?"', hint: '걷기조차 힘들었던 체력. 거울 보는 게 두려웠던 감정' },
      { n: 3, tag: '다이어트 식품 자연 노출', q: '"PT 끝나고 보통 뭐 드세요? 요즘 챙기는 거 있어요?"', hint: 'PPL 연결 — 프로틴/보충제/식단 브랜드 자연스럽게 언급' },
      { n: 4, tag: '포기하고 싶었던 순간', q: '"다이어트 중에 제일 포기하고 싶었던 순간 한 번만 얘기해 주세요"', hint: '정체기 + 치팅 후 자기혐오. 구체적 날짜/상황' },
      { n: 5, tag: '제일 먹고 싶었던 음식', q: '"다이어트하면서 제일 많이 생각난 음식이 뭐예요?"', hint: '구체 음식명 — 라면·치킨·빵. 디테일이 있을수록 공감도 ↑' },
      { n: 6, tag: '양극단 체감 (공감)', q: '**단계 1**\n"예전 본인이랑 지금 본인, 주변 남자들 반응이 달라졌어요? 어떻게요?"\n\n**단계 2**\n"같은 사람인데 왜 그렇게 다른 것 같아요?"\n\n**단계 3 (깨달음)**\n"그때 처음 느끼신 거죠? 세상이 이렇게까지 얕은 줄 — 그 순간 어떠셨어요?"\n\n**단계 4 (시청자 공감)**\n"지금 이 얘기 들으면서 \'내 얘기네\' 하실 분들한테 — 뭐라고 말씀해주고 싶으세요?"', hint: '예전: 투명인간. 지금: 적극 접근. "세상은 생각보다 얕다"는 충격 → 그걸 받아들이고도 따뜻함 유지하는 메시지' },
      { n: 7, tag: '옷 쇼핑 첫 기억', q: '"살 빠지고 나서 옷 쇼핑 처음 갔던 날 기억나세요? 어떠셨어요?"', hint: '처음으로 M/S 사이즈가 맞던 순간. 탈의실에서 울었던 기억 유도' },
      { n: 8, tag: '가족 반응', q: '"가족들 반응은 어땠어요?"', hint: '엄마/아빠의 구체적 반응 — 울컥했다, 못 알아봤다 등 디테일' },
      { n: 9, tag: '유지 비결', q: '"유지하는 거 어떻게 하세요? 치팅데이 있어요?"', hint: '현재도 엄격 관리. 치팅 후 바로 다시 조임. 평생 관리 선언' },
      { n: 10, tag: '재발 공포', q: '"지금도 몸 관리 압박감 있으세요? 어떻게 버티세요?"', hint: '매일 체중계, 거울 체크. "다시 돌아갈까봐" 공포를 솔직히 인정' },
      { n: 11, tag: 'PT 선생님과 관계', q: '"여기 얼마나 다니셨어요? 선생님이랑 오래하시는 거예요?"', hint: '오래된 단골. 선생님이 지켜본 변화 + 인간적 에피소드' },
      { n: 12, tag: '대학생 시절', q: '"대학 다니실 때 본인은 어떤 학생이었어요?"', hint: '첫 대학 시절 — 조용하고 주눅든 학생. L4 편입 서사 포석' },
      { n: 13, tag: '아나운서 되기 전', q: '"아나운서 준비하시기 전에는 뭐 하셨어요?"', hint: '편입·자격증·알바 병행. 다양한 시도의 시작점' },
    ]
  },
  {
    id: 'L3', color: 'L3',
    title: 'L3 메이크업샵',
    time: '12:30~13:30 · 반전 캐릭터 각인',
    questions: [

      { n: 2, tag: '메이크업 직접?', q: '"본인 메이크업 평소에 직접 하세요, 받는 편이세요?"', hint: '평소 셀프, 방송·촬영 시에만 받음. 소박함 강조' },
      { n: 3, tag: '외모 투자 이유', q: '"외모에 신경 많이 쓰시는 편이세요? 왜요?"', hint: '직업적 필요 + 자존감 회복. "예전의 나를 위한 투자"' },

let state = { checks: {}, filter: 'all' };
function load() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) state.checks = JSON.parse(raw) || {};
  } catch (e) {}
}
function save() {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state.checks)); } catch (e) {}
}

const TOTAL = LOCATIONS.reduce((acc, l) => acc + l.questions.filter(q => q.n > 0).length, 0);

function escapeHTML(s) {
  return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}
function renderQuestionText(s) {
  return escapeHTML(s)
    .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
    .replace(/\n/g, '<br>');
}
function renderHint(s) {
  return escapeHTML(s).replace(/\n/g, '<br>');
}

function render() {
  const main = document.getElementById('main');
  main.innerHTML = '';
  let done = 0;

  for (const loc of LOCATIONS) {
    const group = document.createElement('section');
    group.className = 'loc-group';

    const locDone = loc.questions.filter(q => q.n > 0 && state.checks[loc.id + ':' + q.n]).length;
    const locTotal = loc.questions.filter(q => q.n > 0).length;
    done += locDone;

    const header = document.createElement('div');
    header.className = 'loc-header ' + loc.color;
    header.innerHTML = `
      <div class="loc-title">${escapeHTML(loc.title)}<span class="loc-time"> · ${escapeHTML(loc.time)}</span></div>
      <div class="loc-count">${locDone}/${locTotal}</div>
    `;
    group.appendChild(header);

    let visibleInGroup = 0;
    for (const q of loc.questions) {
      const key = loc.id + ':' + q.n;
      const isDone = !!state.checks[key];
      const isProdCut = q.n === 0;

      if (state.filter === 'todo' && isDone) continue;
      if (state.filter === 'done' && !isDone && !isProdCut) continue;
      if (state.filter === 'done' && isProdCut) continue;

      visibleInGroup++;

      const card = document.createElement('div');
      card.className = 'q' + (isDone ? ' done' : '');
      if (isProdCut) card.style.borderStyle = 'dashed';

      const numLabel = isProdCut ? '別' : String(q.n);
      const hintHTML = q.hint ? `<div class="q-hint">${renderHint(q.hint)}</div>` : '';

      card.innerHTML = `
        <div class="q-row" data-key="${key}">
          <div class="q-check"></div>
          <div class="q-body">
            <div class="q-meta">
              <span class="q-num">${numLabel}</span>
              <span class="q-tag">${escapeHTML(q.tag)}</span>
            </div>
            <div class="q-text">${renderQuestionText(q.q)}</div>
            ${hintHTML}
          </div>
        </div>
      `;

      card.querySelector('.q-row').addEventListener('click', () => {
        state.checks[key] = !state.checks[key];
        save();
        render();
      });

      group.appendChild(card);
    }

    if (visibleInGroup === 0) group.classList.add('empty');
    main.appendChild(group);
  }

  const pct = TOTAL > 0 ? Math.round((done / TOTAL) * 100) : 0;
  document.getElementById('progressFill').style.width = pct + '%';
  document.getElementById('progressText').textContent = `${done}/${TOTAL} (${pct}%)`;
}

document.querySelectorAll('.filter-btn[data-filter]').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.filter-btn[data-filter]').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    state.filter = btn.dataset.filter;
    render();
  });
});

document.getElementById('resetBtn').addEventListener('click', () => {
  if (confirm('모든 체크를 초기화할까요?')) {
    state.checks = {};
    save();
    render();
    showToast('초기화 완료');
  }
});

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 1500);
}

load();
render();
</script>
