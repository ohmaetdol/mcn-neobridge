<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#ffffff">
<title>0412 촬영 체크리스트 · 아는언니 세령</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
  :root {
    --bg: #ffffff;
    --card: #ffffff;
    --card2: #f8f9fb;
    --border: #e5e7eb;
    --border2: #f0f2f5;
    --text: #111827;
    --mute: #6b7280;
    --dim: #9ca3af;
    --blue: #0064ff;
    --red: #dc2626;
    --org: #d97706;
    --purple: #7c3aed;
    --grn: #16a34a;
    --dark: #1f2937;
    --done: #10b981;
    --accent: #b45309;
    --shadow-sm: 0 1px 2px rgba(17,24,39,0.04);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0;
    background: var(--bg);
    color: var(--text);
    font-family: 'Pretendard Variable', Pretendard, -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
    font-size: 15px; line-height: 1.55;
    overscroll-behavior-y: none;
    -webkit-font-smoothing: antialiased;
  }
  body { padding-bottom: 80px; }

  .header {
    position: sticky; top: 0; z-index: 50;
    background: rgba(255,255,255,0.94);
    backdrop-filter: saturate(180%) blur(14px);
    -webkit-backdrop-filter: saturate(180%) blur(14px);
    border-bottom: 1px solid var(--border);
    padding: 14px 16px 10px;
  }
  .header h1 {
    font-size: 15px; font-weight: 800; margin: 0 0 4px;
    letter-spacing: -0.02em;
    color: var(--text);
  }
  .header .sub {
    color: var(--mute); font-size: 12px; margin-bottom: 10px;
  }
  .progress-wrap {
    display: flex; align-items: center; gap: 10px; margin-bottom: 10px;
  }
  .progress-bar {
    flex: 1; height: 8px; background: var(--card2);
    border-radius: 999px; overflow: hidden;
    border: 1px solid var(--border2);
  }
  .progress-fill {
    height: 100%; background: linear-gradient(90deg, var(--blue), var(--done));
    width: 0%; transition: width 0.3s ease;
    border-radius: 999px;
  }
  .progress-text {
    font-size: 13px; font-weight: 700; color: var(--text);
    min-width: 84px; text-align: right;
    font-variant-numeric: tabular-nums;
  }
  .filter-row {
    display: flex; gap: 6px; flex-wrap: wrap;
  }
  .filter-btn {
    flex: 1; min-width: 0;
    background: var(--card); border: 1px solid var(--border);
    color: var(--mute); padding: 9px 10px;
    border-radius: 8px; font-size: 12px; font-weight: 700;
    cursor: pointer; transition: all 0.15s;
    font-family: inherit;
  }
  .filter-btn:active { transform: scale(0.97); }
  .filter-btn.active {
    background: var(--blue); border-color: var(--blue); color: #fff;
  }
  .filter-btn.reset {
    flex: 0 0 auto; color: var(--dim);
  }
  .filter-btn.reset:hover,
  .filter-btn.reset:active { color: var(--red); border-color: var(--red); }

  main { padding: 14px 14px 40px; }

  .loc-group { margin-bottom: 20px; }
  .loc-header {
    display: flex; align-items: center; gap: 10px;
    padding: 11px 14px; border-radius: 10px;
    font-weight: 800; font-size: 14px;
    margin-bottom: 10px; color: #fff;
    letter-spacing: -0.01em;
    box-shadow: var(--shadow-sm);
  }
  .loc-header .loc-title { flex: 1; min-width: 0; }
  .loc-header .loc-time {
    font-size: 11px; font-weight: 600; opacity: 0.85;
    margin-left: 6px;
  }
  .loc-header .loc-count {
    font-size: 12px; font-weight: 700;
    background: rgba(255,255,255,0.22); padding: 3px 9px;
    border-radius: 999px; font-variant-numeric: tabular-nums;
  }
  .loc-header.L1 { background: var(--blue); }
  .loc-header.L2 { background: var(--red); }
  .loc-header.L3 { background: var(--org); }
  .loc-header.L4 { background: var(--purple); }
  .loc-header.L5 { background: var(--grn); }
  .loc-header.L6 { background: var(--red); }
  .loc-header.L7 { background: var(--dark); }

  .q {
    background: var(--card); border: 1px solid var(--border);
    border-radius: 10px; margin-bottom: 8px;
    overflow: hidden; transition: all 0.15s;
    box-shadow: var(--shadow-sm);
  }
  .q.done {
    background: var(--card2);
    opacity: 0.62;
  }
  .q-row {
    display: flex; align-items: flex-start; gap: 12px;
    padding: 14px;
    cursor: pointer; user-select: none;
    min-height: 52px;
  }
  .q-check {
    flex-shrink: 0;
    width: 24px; height: 24px;
    border: 2px solid var(--dim);
    border-radius: 6px;
    display: flex; align-items: center; justify-content: center;
    transition: all 0.15s;
    margin-top: 1px;
    background: #fff;
  }
  .q.done .q-check {
    background: var(--done); border-color: var(--done);
  }
  .q-check::after {
    content: ""; width: 6px; height: 11px;
    border: solid #fff; border-width: 0 2px 2px 0;
    transform: rotate(45deg) translate(-1px, -1px);
    opacity: 0;
  }
  .q.done .q-check::after { opacity: 1; }

  .q-body { flex: 1; min-width: 0; }
  .q-meta {
    display: flex; align-items: center; gap: 8px;
    margin-bottom: 6px; flex-wrap: wrap;
  }
  .q-num {
    background: var(--blue); color: #fff;
    font-size: 11px; font-weight: 800;
    padding: 2px 8px; border-radius: 5px;
    font-variant-numeric: tabular-nums;
  }
  .q.done .q-num { background: var(--done); }
  .q-tag {
    color: var(--mute); font-size: 12px; font-weight: 700;
    letter-spacing: -0.01em;
  }
  .q-text {
    font-size: 14px; line-height: 1.65;
    color: var(--text); word-break: keep-all;
    white-space: pre-wrap;
  }
  .q.done .q-text {
    text-decoration: line-through;
    text-decoration-color: var(--dim);
    color: var(--mute);
  }

  .q-text strong {
    color: var(--accent);
    font-weight: 800;
    background: #fef3c7;
    padding: 1px 5px;
    border-radius: 4px;
  }

  .q.hidden { display: none; }
  .loc-group.empty { display: none; }

  .toast {
    position: fixed; left: 50%; bottom: 24px;
    transform: translateX(-50%) translateY(20px);
    background: #111827; color: #fff;
    padding: 10px 20px; border-radius: 999px;
    font-size: 13px; font-weight: 600;
    opacity: 0; transition: all 0.3s;
    pointer-events: none;
    box-shadow: 0 4px 20px rgba(0,0,0,0.15);
  }
  .toast.show {
    opacity: 1; transform: translateX(-50%) translateY(0);
  }

  @media (min-width: 768px) {
    body { font-size: 16px; }
    main { max-width: 760px; margin: 0 auto; padding: 18px 20px 60px; }
    .header { padding: 16px 20px 12px; }
    .header > div { max-width: 760px; margin: 0 auto; }
    .header h1 { font-size: 17px; }
  }
</style>
</head>
<body>

<div class="header">
  <div>
    <h1>아는언니 세령 · 0412 촬영 체크리스트</h1>
    <div class="sub">7곳 · 100+ 질문 · 체크 자동 저장</div>
    <div class="progress-wrap">
      <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
      <div class="progress-text" id="progressText">0/0 (0%)</div>
    </div>
    <div class="filter-row">
      <button class="filter-btn active" data-filter="all">전체</button>
      <button class="filter-btn" data-filter="todo">미완료</button>
      <button class="filter-btn" data-filter="done">완료</button>
      <button class="filter-btn reset" id="resetBtn">초기화</button>
    </div>
  </div>
</div>

<main id="main"></main>

<div class="toast" id="toast">저장됨</div>

<script>
const STORAGE_KEY = 'shoot-0412-checklist-v3';

const LOCATIONS = [
  {
    id: 'L1', color: 'L1',
    title: 'L1 자택',
    time: '09:00~10:00 · 바닥 서사 시작',
    questions: [
      { n: 1, tag: '옛날 사진', q: '"이 사진 몇 살 때예요? 지금이랑 너무 다른데, 그때가 본인이라고요?"' },
      { n: 2, tag: '대구 출신 / 어린 시절', q: '"대구 어디 출신이에요? 어린 시절 본인은 어떤 아이였어요? 똑똑했어요, 뒷줄에 있는 애였어요?"' },
      { n: 3, tag: '별명', q: '"어릴 때 본인 별명이 뭐였어요? 친구들이 뭐라고 불렀어요?"' },
      { n: 4, tag: '노현정 아나운서 롤모델', q: '"노현정 아나운서 처음 본 게 초등학교 3학년 때라고요? 그때 왜 그렇게 꽂히셨어요?"' },
      { n: 5, tag: '아나운서 연습 리인액트', q: '"지금 이 화장실에서 진짜로 아나운서 연습 하셨어요? 어떻게 했어요? 한 번 보여주실 수 있어요?"' },
      { n: 6, tag: '폭식 / 반지하', q: '"90kg까지 어떻게 찌셨어요? 그때 집은 어떤 집이었어요? 반지하였다고요?"' },
      { n: 7, tag: '부모님 직업 / 경제적 환경', q: '"부모님은 어떤 일 하셨어요? 어릴 때 경제적으로 넉넉한 편이었어요?"' },
      { n: 8, tag: '반지하 vs 지금 집', q: '"(현관/거실 와이드) 지금 이 집은 본인한테 어떤 의미예요? 반지하 시절이랑 비교하면 뭐가 제일 달라요?"' },
      { n: 9, tag: '아끼는 물건', q: '"(책상/화장대) 이 공간에서 제일 아끼는 물건 하나만 보여주세요. 왜 그게 중요해요?"' },
      { n: 10, tag: '대구 사투리', q: '"대구 사투리 아직 쓰세요? 가족이랑 통화할 때 말투 달라져요? 한 번 보여주세요."' },
      { n: 11, tag: '아침 루틴', q: '"오늘 아침 몇 시에 일어나서 뭐 하셨어요? 매일 이런 루틴이세요? 아침에 제일 먼저 뭐 해요?"' },
      { n: 12, tag: '오늘 출발 멘트', q: '"그런 집에서 시작한 사람이 오늘 어디 가시는 거예요? 오늘 스케줄 간단히 설명해주세요."' },
    ]
  },
  {
    id: 'L2', color: 'L2',
    title: 'L2 헬스장 PT',
    time: '10:30~12:00 · 다이어트 + PPL 빌드업',
    questions: [
      { n: 1, tag: '다이어트 시작 계기', q: '"언제부터 살을 빼기 시작했어요? 90kg에서 지금까지 어떻게 빼신 거예요? 계기가 뭐였어요?"' },
      { n: 2, tag: '첫 운동의 기억', q: '"운동 처음 시작할 때 90kg 몸으로 뛰는 게 얼마나 힘들어요? 남들 눈치 안 봤어요?"' },
      { n: 3, tag: '다이어트 식품 자연 노출', q: '"PT 끝나고 뭐 드세요? 요즘 챙겨 드시는 거 있어요?"' },
      { n: 4, tag: '포기하고 싶었던 순간', q: '"다이어트 중에 진짜 포기하고 싶었던 순간 한 번만 얘기해주세요. 제일 힘들었을 때요."' },
      { n: 5, tag: '제일 먹고 싶었던 음식', q: '"다이어트하면서 제일 많이 먹고 싶었던 음식 뭐예요? 지금도 참아요?"' },
      { n: 6, tag: '양극단 체감 — 투명인간 vs 지금 (공감)', q: '**단계 1**\n"뚱뚱했을 때는 남자들이 진짜 투명인간 취급했어요? 한 명도 말을 안 걸었어요?"\n\n**단계 2**\n"그럼 지금은 진짜 달라요? 같은 사람인데요?"\n\n**단계 3 (공감 포인트)**\n"지금 영상 보시는 분 중에 다이어트 중이신 분들 많을 텐데 — 살 빼면 진짜 인생 바뀐다고 말씀드려도 돼요?"' },

      { n: 8, tag: '가족 반응', q: '"가족들 반응은 어땠어요? \'너 왜 이렇게 말랐어\' 이런 말 들으셨어요?"' },
      { n: 9, tag: '치팅데이 vs 평생 절제', q: '"유지하는 게 진짜 힘들잖아요. 치팅데이 하세요? 아니면 평생 절제예요?"' },
      { n: 10, tag: '재발 공포', q: '"지금도 살찔까봐 무섭죠? 평생 관리해야 한다는 압박감 어떻게 버텨요?"' },
      { n: 11, tag: 'PT 선생님과 관계', q: '"PT 선생님이랑 얼마나 되셨어요? 여기 다닌 지는요? 운동 안 하면 불안해요?"' },
      { n: 12, tag: '대학생 시절', q: '"대학 때는 어땠어요? 캠퍼스 다니면서 어떤 생각 하셨어요?"' },
      { n: 13, tag: '아나운서 되기 전', q: '"아나운서 되기 전에 얼마나 준비하셨어요? 어디서 어떻게?"' },
    ]
  },
  {
    id: 'L3', color: 'L3',
    title: 'L3 메이크업샵',
    time: '12:30~13:30 · 반전 캐릭터 각인',
    questions: [
      { n: 1, tag: '반전 첫 마디', q: '"(풀세팅 시작 직전 거울 보며) 이 모습을 뚱뚱했을 때의 본인이 보면 뭐라고 할 것 같아요?"' },
      { n: 2, tag: '메이크업 똥손', q: '"결정사 대표가 본인이 메이크업 못 해서 받는 거라고요?"' },
      { n: 3, tag: '외모 투자 이유', q: '"결정사 대표니까 외모에 더 신경 쓰시는 건가요? 왜요?"' },

let state = { checks: {}, filter: 'all' };
function load() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) state.checks = JSON.parse(raw) || {};
  } catch (e) {}
}
function save() {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state.checks)); } catch (e) {}
}

const TOTAL = LOCATIONS.reduce((acc, l) => acc + l.questions.filter(q => q.n > 0).length, 0);

function escapeHTML(s) {
  return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}
function renderQuestionText(s) {
  return escapeHTML(s)
    .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
    .replace(/\n/g, '<br>');
}

function render() {
  const main = document.getElementById('main');
  main.innerHTML = '';
  let done = 0;

  for (const loc of LOCATIONS) {
    const group = document.createElement('section');
    group.className = 'loc-group';

    const locDone = loc.questions.filter(q => q.n > 0 && state.checks[loc.id + ':' + q.n]).length;
    const locTotal = loc.questions.filter(q => q.n > 0).length;
    done += locDone;

    const header = document.createElement('div');
    header.className = 'loc-header ' + loc.color;
    header.innerHTML = `
      <div class="loc-title">${escapeHTML(loc.title)}<span class="loc-time"> · ${escapeHTML(loc.time)}</span></div>
      <div class="loc-count">${locDone}/${locTotal}</div>
    `;
    group.appendChild(header);

    let visibleInGroup = 0;
    for (const q of loc.questions) {
      const key = loc.id + ':' + q.n;
      const isDone = !!state.checks[key];
      const isProdCut = q.n === 0;

      if (state.filter === 'todo' && isDone) continue;
      if (state.filter === 'done' && !isDone && !isProdCut) continue;
      if (state.filter === 'done' && isProdCut) continue;

      visibleInGroup++;

      const card = document.createElement('div');
      card.className = 'q' + (isDone ? ' done' : '');
      if (isProdCut) card.style.borderStyle = 'dashed';

      const numLabel = isProdCut ? '別' : String(q.n);

      card.innerHTML = `
        <div class="q-row" data-key="${key}">
          <div class="q-check"></div>
          <div class="q-body">
            <div class="q-meta">
              <span class="q-num">${numLabel}</span>
              <span class="q-tag">${escapeHTML(q.tag)}</span>
            </div>
            <div class="q-text">${renderQuestionText(q.q)}</div>
          </div>
        </div>
      `;

      card.querySelector('.q-row').addEventListener('click', () => {
        state.checks[key] = !state.checks[key];
        save();
        render();
      });

      group.appendChild(card);
    }

    if (visibleInGroup === 0) group.classList.add('empty');
    main.appendChild(group);
  }

  const pct = TOTAL > 0 ? Math.round((done / TOTAL) * 100) : 0;
  document.getElementById('progressFill').style.width = pct + '%';
  document.getElementById('progressText').textContent = `${done}/${TOTAL} (${pct}%)`;
}

document.querySelectorAll('.filter-btn[data-filter]').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.filter-btn[data-filter]').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    state.filter = btn.dataset.filter;
    render();
  });
});

document.getElementById('resetBtn').addEventListener('click', () => {
  if (confirm('모든 체크를 초기화할까요?')) {
    state.checks = {};
    save();
    render();
    showToast('초기화 완료');
  }
});

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 1500);
}

load();
render();
</script>

</body>
</html>
